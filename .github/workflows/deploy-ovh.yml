name: Deploy Nateiva School Game to OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nateiva-school-game-ovh-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.OVH_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      SSH_DIR: ${{ github.workspace }}/.nateiva-school-game-ssh
    steps:
      - name: Check out the GitHub revision
        uses: actions/checkout@v4

      - name: Prepare the SSH identity (dedicated key, or password fallback)
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
          OVH_SSH_KNOWN_HOSTS: ${{ secrets.OVH_SSH_KNOWN_HOSTS }}
          OVH_SSH_PASSWORD: ${{ secrets.OVH_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OVH_SSH_HOST" || { echo "Missing OVH_SSH_HOST repository secret" >&2; exit 1; }
          install -m 700 -d "$SSH_DIR"

          # Host verification: use the pinned known_hosts secret when provided, otherwise scan at run time.
          if [ -n "${OVH_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$OVH_SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          else
            ssh-keyscan -H "$OVH_SSH_HOST" > "$SSH_DIR/known_hosts" 2>/dev/null
            test -s "$SSH_DIR/known_hosts" || { echo "ssh-keyscan failed for $OVH_SSH_HOST" >&2; exit 1; }
          fi
          chmod 600 "$SSH_DIR/known_hosts"

          # Auth: prefer the dedicated private key; fall back to password auth via sshpass.
          if [ -n "${OVH_SSH_PRIVATE_KEY:-}" ]; then
            printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$SSH_DIR/id_ed25519"
            chmod 600 "$SSH_DIR/id_ed25519"
            echo "AUTH_MODE=key" >> "$GITHUB_ENV"
          elif [ -n "${OVH_SSH_PASSWORD:-}" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass >/dev/null
            echo "AUTH_MODE=password" >> "$GITHUB_ENV"
          else
            echo "Provide either OVH_SSH_PRIVATE_KEY or OVH_SSH_PASSWORD as a repository secret" >&2
            exit 1
          fi

          # Single SSH wrapper used by ssh and rsync in all later steps.
          cat > "$SSH_DIR/ssh.sh" <<'WRAP'
          #!/usr/bin/env bash
          set -euo pipefail
          SSH_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          OPTS=(-o UserKnownHostsFile="$SSH_DIR/known_hosts" -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          if [ -f "$SSH_DIR/id_ed25519" ]; then
            exec ssh -i "$SSH_DIR/id_ed25519" -o IdentitiesOnly=yes "${OPTS[@]}" "$@"
          else
            exec sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no "${OPTS[@]}" "$@"
          fi
          WRAP
          chmod 700 "$SSH_DIR/ssh.sh"

      - name: Upload the GitHub revision to the isolated game directory
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
          SSHPASS: ${{ secrets.OVH_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$OVH_SSH_USER" || { echo "Missing OVH_SSH_USER repository secret" >&2; exit 1; }
          SSH_TARGET="$OVH_SSH_USER@$OVH_SSH_HOST"
          "$SSH_DIR/ssh.sh" "$SSH_TARGET" 'sudo install -d -o ubuntu -g ubuntu /opt/nateiva-school-game/public /opt/nateiva-school-game/ops/ovh-school-game'
          export RSYNC_RSH="$SSH_DIR/ssh.sh"
          rsync -az --delete ./public/ "$SSH_TARGET:/opt/nateiva-school-game/public/"
          rsync -az --delete --exclude='.env.production' ./ops/ovh-school-game/ "$SSH_TARGET:/opt/nateiva-school-game/ops/ovh-school-game/"

      - name: Start the isolated game service and install its Caddy route
        env:
          OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
          OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
          SSHPASS: ${{ secrets.OVH_SSH_PASSWORD }}
        run: |
          set -euo pipefail
          "$SSH_DIR/ssh.sh" "$OVH_SSH_USER@$OVH_SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          APP_ROOT=/opt/nateiva-school-game
          OPS_DIR="$APP_ROOT/ops/ovh-school-game"
          ENV_FILE="$OPS_DIR/.env.production"
          if [ ! -f "$ENV_FILE" ]; then
            printf 'APP_ENV=production\nGAME_PORT=8091\n' > "$ENV_FILE"
            chmod 600 "$ENV_FILE"
          fi
          cd "$OPS_DIR"
          sudo docker compose --project-name nateiva-school-game --env-file .env.production -f compose.yaml pull
          sudo docker compose --project-name nateiva-school-game --env-file .env.production -f compose.yaml up -d
          sudo docker compose --project-name nateiva-school-game --env-file .env.production -f compose.yaml ps

          CADDY_ROUTE=/etc/caddy/nateiva-school-game.caddy
          CADDYFILE=/etc/caddy/Caddyfile
          sudo install -m 0644 "$OPS_DIR/nateiva-school-game.caddy" "$CADDY_ROUTE"
          if ! sudo grep -Fqx '    import /etc/caddy/nateiva-school-game.caddy' "$CADDYFILE"; then
            sudo cp -a "$CADDYFILE" "$CADDYFILE.nateiva-school-game.bak"
            sudo sed -i '/^    reverse_proxy 127\.0\.0\.1:5101$/i\    import /etc/caddy/nateiva-school-game.caddy' "$CADDYFILE"
          fi
          if ! sudo caddy validate --config "$CADDYFILE"; then
            if [ -f "$CADDYFILE.nateiva-school-game.bak" ]; then
              sudo cp "$CADDYFILE.nateiva-school-game.bak" "$CADDYFILE"
            fi
            exit 1
          fi
          sudo systemctl reload caddy
          curl --fail --silent --show-error http://127.0.0.1:8091/arcade.html >/dev/null
          curl --fail --silent --show-error https://vps-6964d2a4.vps.ovh.us/school-game/arcade.html >/dev/null
          REMOTE
