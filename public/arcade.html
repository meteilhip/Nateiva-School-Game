<head>

<title>Nateiva EduKids — Arcade Animée & Tuteur Visuel</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  padding: 0;
  background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 100%);
  color: white;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  user-select: none;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 10px 16px;
  background: rgba(30, 27, 75, 0.95);
  backdrop-filter: blur(10px);
  border-bottom: 2px solid #3730a3;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}
.brand-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.mascot-avatar {
  font-size: 32px;
  cursor: pointer;
  animation: mascotBounce 2.5s infinite ease-in-out;
}
@keyframes mascotBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
h1 {
  font-size: 19px;
  margin: 0;
  background: linear-gradient(90deg, #facc15, #fb923c);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 900;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
button {
  cursor: pointer;
  border: 0;
  border-radius: 16px;
  padding: 10px 14px;
  font-weight: 800;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: transform 0.1s, filter 0.2s;
}
button:active {
  transform: scale(0.95);
}
.btn-gold {
  background: linear-gradient(180deg, #fde047 0%, #eab308 100%);
  color: #713f12;
  box-shadow: 0 4px 12px rgba(234, 179, 8, 0.4);
}
.btn-sound {

  color: #c7d2fe;

}
main {
  max-width: 900px;

  margin: auto;
  padding: 12px;
  flex: 1;
}
.panel {
  background: rgba(30, 41, 59, 0.85);

  border-radius: 24px;

}
.selectors-bar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: space-between;
}
.pills-group {
  display: flex;
  gap: 6px;

  padding-bottom: 4px;
}
.pill-btn {
  background: #1e293b;

}
.game-selector-grid {

  background: #1e293b;
  border: 2px solid #334155;

.game-card-icon {

  gap: 4px;

<script>
"use strict";

// --- AUDIO & VOICE ENGINE ---
let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

const AudioEngine = {
  soundEnabled: true,
  playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.12) {
    if (!this.soundEnabled) return;
    try {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(gainVal, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch (e) {}
  },
  playSuccess() {
    this.playTone(523.25, 'triangle', 0.1, 0.15); // C5
    setTimeout(() => this.playTone(659.25, 'triangle', 0.1, 0.15), 100); // E5
    setTimeout(() => this.playTone(783.99, 'triangle', 0.25, 0.2), 200); // G5
  },
  playMistake() {
    this.playTone(220, 'sawtooth', 0.2, 0.15);
    setTimeout(() => this.playTone(180, 'sawtooth', 0.25, 0.15), 120);
  },
  playCoin() {
    this.playTone(987.77, 'sine', 0.08, 0.15); // B5
    setTimeout(() => this.playTone(1318.51, 'sine', 0.2, 0.15), 80); // E6
  },
  playDrop() {
    this.playTone(330, 'square', 0.08, 0.08);
  },
  playWhoosh() {
    this.playTone(440, 'sine', 0.1, 0.1);
  }
};

// Voice narration using Web Speech API with non-reader speech queues
const VoiceEngine = {
  lang: 'fr',
  speak(text) {
    if (!AudioEngine.soundEnabled || !('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = this.lang === 'fr' ? 'fr-FR' : 'en-US';
    u.rate = 0.82; // Slower, clearer speech for young kids
    u.pitch = 1.1; // Warm and friendly mascot voice
    window.speechSynthesis.speak(u);
  }
};

// --- GAME STATE ---
const state = {
  game: 'drop', // 'drop' | 'catch' | 'fruit' | 'match' | 'racing' | 'market'
  grade: 0,     // 0: Maternelle (1-5), 1: SIL/CP (1-10), 2: CE1/CE2 (1-30), 3: CM1/CM2 (1-100)
  score: 0,
  coins: 15,
  level: 1,
  lives: 3,
  running: false,
  question: null,
  errorCount: 0,
  playerX: 250,
  lastTime: 0,
  // Game specific state
  items: [],
  cards: [],
  raceCarLane: 1, // 0: left, 1: center, 2: right
  marketCoinsInPlate: [],
  targetPrice: 500,
  // Tetris Math Drop Grid
  tetrisBlock: null,
  tetrisGrid: [], // 10 cols x 8 rows
  // Idle pointer guide
  idleTime: 0,
  // Tutor
  tutorMode: 'WATCH',
  tutorStep: 0,
  tutorOpen: false,
  tutorTransferQuestion: null
};

// Translations & Audio prompts
const i18n = {
  fr: {
    nursery: 'Maternelle',
    sil_cp: 'SIL / CP',
    ce1_ce2: 'CE1 / CE2',
    cm1_cm2: 'CM1 / CM2',
    catch: 'Attrape la bonne réponse !',
    drop: 'Empile le bloc avec le bon chiffre !',
    fruit: 'Touche l\'arbre pour cueillir les fruits !',
    match: 'Touche deux cartes qui vont ensemble !',
    racing: 'Change de voie pour prendre le turbo !',
    market: 'Dépose les pièces CFA sur le plateau !',
    good: 'Bravo petit champion ! 🌟',
    again: 'Regarde bien, essaie encore ! 💡',
    tutor_watch: 'Regarde comment on groupe les objets.',
    tutor_together: 'Touche l\'écran pour réunir les deux paquets.',
    tutor_transfer: 'Maintenant, résous ce nouvel exemple tout seul !',
    tutor_trick: 'Astuce : complète d\'abord dix pour aller plus vite !',
    tutor_why: 'Pourquoi ? Chaque fois qu\'on a 10 unités, on fait une dizaine !'
  },
  en: {
    nursery: 'Nursery',
    sil_cp: 'Class 1-2',
    ce1_ce2: 'Class 3-4',
    cm1_cm2: 'Class 5-6',
    catch: 'Catch the matching star!',
    drop: 'Drop the falling block on the right target!',
    fruit: 'Tap the tree to harvest the fruits!',
    match: 'Flip and match the identical pairs!',
    racing: 'Switch lanes to hit the turbo boost!',
    market: 'Place the CFA coins on the scale!',
    good: 'Great job, champion! 🌟',
    again: 'Look closely, try again! 💡',
    tutor_watch: 'Watch how we group the items together.',
    tutor_together: 'Tap the screen to combine both groups.',
    tutor_transfer: 'Now solve this new challenge by yourself!',
    tutor_trick: 'Trick: make ten first to calculate faster!',
    tutor_why: 'Why? Every time you get 10 units, you build 1 ten-rod!'
  }
};
const t = (k) => (i18n[VoiceEngine.lang] && i18n[VoiceEngine.lang][k]) || k;

// DOM Helpers
const $ = (id) => document.getElementById(id);
const canvas = $('arena');
const ctx = canvas.getContext('2d');
const tutorCanvas = $('tutorCanvas');
const tctx = tutorCanvas.getContext('2d');
const W = 500, H = 400;

// Question Generator with concrete fruit icons
function generateQuestion() {
  const grade = state.grade;
  let a, b, op = '+', ans;
  const fruitIcons = ['🥭', '🍌', '🍍', '🥑', '🥥', '🌽'];
  const icon = fruitIcons[Math.floor(Math.random() * fruitIcons.length)];

  if (grade === 0) {
    // Nursery: 1 to 5 counting & small addition
    a = Math.floor(Math.random() * 3) + 1;
    b = Math.floor(Math.random() * 2) + 1;
    ans = a + b;
  } else if (grade === 1) {
    // SIL/CP: up to 10
    a = Math.floor(Math.random() * 5) + 2;
    b = Math.floor(Math.random() * 4) + 1;
    if (Math.random() < 0.35 && a > b) {
      op = '-';
      ans = a - b;
    } else {
      ans = a + b;
    }
  } else if (grade === 2) {
    // CE1/CE2: up to 30, multiplication beginnings
    if (Math.random() < 0.4) {
      op = '×';
      a = Math.floor(Math.random() * 5) + 2;
      b = Math.floor(Math.random() * 4) + 2;
      ans = a * b;
    } else if (Math.random() < 0.3) {
      op = '-';
      a = Math.floor(Math.random() * 15) + 10;
      b = Math.floor(Math.random() * 8) + 1;
      ans = a - b;
    } else {
      a = Math.floor(Math.random() * 14) + 6;
      b = Math.floor(Math.random() * 12) + 5;
      ans = a + b;
    }
  } else {
    // CM1/CM2: up to 100
    if (Math.random() < 0.5) {
      op = '×';
      a = Math.floor(Math.random() * 8) + 3;
      b = Math.floor(Math.random() * 8) + 3;
      ans = a * b;
    } else {
      a = Math.floor(Math.random() * 45) + 20;
      b = Math.floor(Math.random() * 35) + 15;
      ans = a + b;
    }
  }

  state.question = { a, b, op, ans, icon };
  state.errorCount = 0;
  state.idleTime = 0;

  // Render question equation
  $('display-equation').textContent = `${a} ${op} ${b} = ?`;

  // Render concrete fruit dots for non-readers
  const dotsContainer = $('concrete-dots');
  dotsContainer.innerHTML = '';
  if (ans <= 15) {
    for (let i = 0; i < a; i++) {
      const s = document.createElement('span');
      s.className = 'concrete-dot';
      s.textContent = icon;
      dotsContainer.appendChild(s);
    }
    const sep = document.createElement('span');
    sep.style.margin = '0 6px';
    sep.style.fontWeight = 'bold';
    sep.textContent = op;
    dotsContainer.appendChild(sep);
    for (let i = 0; i < b; i++) {
      const s = document.createElement('span');
      s.className = 'concrete-dot';
      s.textContent = '🍏';
      dotsContainer.appendChild(s);
    }
  }

  // Speak question
  speakCurrentQuestion();
  initActiveGameMode();
}

function speakCurrentQuestion() {
  const q = state.question;
  if (!q) return;
  const opWord = q.op === '+' ? (VoiceEngine.lang === 'fr' ? 'plus' : 'plus') :
                 q.op === '-' ? (VoiceEngine.lang === 'fr' ? 'moins' : 'minus') :
                 (VoiceEngine.lang === 'fr' ? 'fois' : 'times');
  VoiceEngine.speak(`${q.a} ${opWord} ${q.b} ! ${t(state.game)}`);
  
  const repeatBtn = $('repeat-audio-btn');
  repeatBtn.classList.add('pulse');
  setTimeout(() => repeatBtn.classList.remove('pulse'), 2000);
}

function getAnswerOptions(correct, count = 4) {
  const set = new Set([correct]);
  while (set.size < count) {
    const offset = Math.floor(Math.random() * 9) - 4;
    const val = Math.max(0, correct + (offset === 0 ? 1 : offset));
    set.add(val);
  }
  return [...set].sort(() => Math.random() - 0.5);
}

// Initialize specific game mode mechanics
function initActiveGameMode() {
  const q = state.question;
  state.items = [];

  if (state.game === 'drop') {
    // Tetris Math Drop: Spawn falling blocks with answer options
    const options = getAnswerOptions(q.ans, 3);
    state.tetrisBlock = {
      val: options[Math.floor(Math.random() * options.length)],
      x: 210,
      y: 10,
      w: 80,
      h: 40,
      vy: 60 + state.level * 8,
      color: '#3b82f6'
    };
    // Base targets at the bottom
    state.items = options.map((opt, idx) => ({
      val: opt,
      x: 55 + idx * 150,
      y: 340,
      w: 120,
      h: 45,
      isBase: true,
      color: opt === q.ans ? '#10b981' : '#334155'
    }));
  } else if (state.game === 'catch') {
    // Space Rocket Catch: spawn orbital gates moving across screen
    const options = getAnswerOptions(q.ans, 3);
    state.items = options.map((opt, idx) => ({
      val: opt,
      x: 70 + idx * 150,
      y: 70,
      radius: 36,
      vx: (idx % 2 === 0 ? 1 : -1) * 35,
      wobble: Math.random() * 6.28
    }));
    state.playerX = 250;
  } else if (state.game === 'fruit') {
    // Tree Fruit Harvester: Bouncing fruit hanging on branches
    const fruitCount = q.ans;
    state.items = [];
    for (let i = 0; i < fruitCount; i++) {
      state.items.push({
        val: i + 1,
        x: 90 + (i % 5) * 75 + Math.random() * 20,
        y: 80 + Math.floor(i / 5) * 55 + Math.random() * 15,
        harvested: false,
        icon: q.icon,
        radius: 24
      });
    }
  } else if (state.game === 'match') {
    // Memory Card Duo: pairs of cards (number and fruit dots)
    const pairs = [
      { id: 1, type: 'num', val: q.ans, label: `${q.ans}` },
      { id: 1, type: 'dots', val: q.ans, label: `${q.icon} × ${q.ans}` },
      { id: 2, type: 'num', val: q.ans + 2, label: `${q.ans + 2}` },
      { id: 2, type: 'dots', val: q.ans + 2, label: `${q.icon} × ${q.ans + 2}` }
    ].sort(() => Math.random() - 0.5);

    state.cards = pairs.map((c, i) => ({
      ...c,
      flipped: false,
      solved: false,
      x: 65 + (i % 2) * 200,
      y: 90 + Math.floor(i / 2) * 130,
      w: 170,
      h: 100
    }));
  } else if (state.game === 'racing') {
    // 3-lane Math Car Racing
    state.raceCarLane = 1;
    const options = getAnswerOptions(q.ans, 3);
    state.items = options.map((opt, i) => ({
      val: opt,
      lane: i,
      x: 80 + i * 140,
      y: 60,
      vy: 120 + state.level * 15
    }));
  } else if (state.game === 'market') {
    // Mokolo CFA Market scale
    state.targetPrice = q.ans * 50; // In Francs CFA
    state.marketCoinsInPlate = [];
    state.items = [50, 100, 250, 500].map((coin, i) => ({
      val: coin,
      x: 60 + i * 110,
      y: 330,
      radius: 32
    }));
  }
}

// Handle Answer correctness
function handleAnswer(choice) {
  if (!state.running || state.tutorOpen) return;
  const q = state.question;
  const isCorrect = choice === q.ans || choice === state.targetPrice;

  if (isCorrect) {
    AudioEngine.playSuccess();
    AudioEngine.playCoin();
    state.score += 10;
    state.coins += 5;
    state.level = 1 + Math.floor(state.score / 50);
    $('feedback-msg').style.color = '#10b981';
    $('feedback-msg').textContent = t('good');
    VoiceEngine.speak(t('good'));
    updateStatsDOM();

    setTimeout(() => {
      $('feedback-msg').textContent = '';
      generateQuestion();
    }, 1200);
  } else {
    AudioEngine.playMistake();
    state.lives = Math.max(0, state.lives - 1);
    state.errorCount++;
    $('feedback-msg').style.color = '#ef4444';
    $('feedback-msg').textContent = t('again');
    updateStatsDOM();

    // After 2 mistakes, automatically trigger the friendly voice tutor!
    if (state.errorCount >= 2 || state.lives <= 0) {
      setTimeout(() => {
        openTutor();
      }, 700);
    }
  }
}

function updateStatsDOM() {
  $('stat-score').textContent = state.score;
  $('stat-level').textContent = state.level;
  $('stat-coins').textContent = state.coins;
  $('stat-lives').textContent = state.lives;
}

// --- RENDERING LOOP ---
function draw(time) {
  ctx.clearRect(0, 0, W, H);

  // Background Starfield & Ground
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#0f172a');
  bgGrad.addColorStop(1, '#1e293b');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Subtle star sparkles
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  for (let i = 0; i < 15; i++) {
    const sx = (i * 73 + time * 0.005) % W;
    const sy = (i * 47) % (H - 50);
    ctx.fillRect(sx, sy, 2, 2);
  }

  // Render active game
  if (state.game === 'drop') {
    renderMathDrop(time);
  } else if (state.game === 'catch') {
    renderRocketCatch(time);
  } else if (state.game === 'fruit') {
    renderFruitCollector(time);
  } else if (state.game === 'match') {
    renderMatchQuest(time);
  } else if (state.game === 'racing') {
    renderRacing(time);
  } else if (state.game === 'market') {
    renderMarket(time);
  }

  // Start Screen Overlay
  if (!state.running && !state.tutorOpen) {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fde047';
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px system-ui';
    ctx.fillText('▶ TOUCHE POUR JOUER', W / 2, H / 2);
    ctx.font = 'bold 16px system-ui';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('Arcade éducative animée pour enfants', W / 2, H / 2 + 35);
  }

  // Update Idle Guide Pointer
  updateHandPointer();
}

// 1. Math Drop (Falling Tetris Blocks)
function renderMathDrop(time) {
  // Bases at the bottom
  state.items.forEach(base => {
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.roundRect(base.x, base.y, base.w, base.h, 12);
    ctx.fill();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 22px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(String(base.val), base.x + base.w / 2, base.y + 30);
  });

  // Falling block controlled by player
  const block = state.tetrisBlock;
  if (block) {
    ctx.save();
    ctx.shadowColor = '#3b82f6';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath();
    ctx.roundRect(block.x, block.y, block.w, block.h, 10);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(String(block.val), block.x + block.w / 2, block.y + 28);
    ctx.restore();
  }
}

// 2. Rocket Catch
function renderRocketCatch(time) {
  // Moving orbital target gates
  state.items.forEach(gate => {
    ctx.save();
    ctx.translate(gate.x, gate.y);
    ctx.fillStyle = '#6366f1';
    ctx.beginPath();
    ctx.arc(0, 0, gate.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#a5b4fc';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 24px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(gate.val), 0, 0);
    ctx.restore();
  });

  // Flying Rocket
  ctx.save();
  ctx.translate(state.playerX, 330);
  ctx.fillStyle = '#facc15';
  ctx.beginPath();
  ctx.moveTo(0, -32);
  ctx.lineTo(26, 18);
  ctx.lineTo(0, 8);
  ctx.lineTo(-26, 18);
  ctx.closePath();
  ctx.fill();

  // Thruster flames
  ctx.fillStyle = '#fb923c';
  ctx.fillRect(-7, 16, 14, 12 + Math.sin(time * 0.02) * 6);
  ctx.restore();
}

// 3. Fruit Harvester Tree
function renderFruitCollector(time) {
  // Big Tree trunk & foliage
  ctx.fillStyle = '#78350f';
  ctx.fillRect(225, 200, 50, 160);
  ctx.fillStyle = '#15803d';
  ctx.beginPath();
  ctx.arc(250, 140, 150, 0, Math.PI * 2);
  ctx.fill();

  // Bouncing harvestable fruits
  state.items.forEach(fruit => {
    ctx.font = '32px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(fruit.icon, fruit.x, fruit.y + Math.sin(time * 0.004 + fruit.x) * 4);
  });

  // Harvest basket at the bottom
  ctx.fillStyle = '#92400e';
  ctx.beginPath();
  ctx.roundRect(190, 320, 120, 60, [10, 10, 30, 30]);
  ctx.fill();
  ctx.fillStyle = '#fde047';
  ctx.font = 'bold 16px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('🧺 Panier', 250, 355);
}

// 4. Memory Card Duo
function renderMatchQuest(time) {
  state.cards.forEach(card => {
    ctx.save();
    ctx.translate(card.x, card.y);
    if (card.flipped || card.solved) {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(0, 0, card.w, card.h, 16);
      ctx.fill();
      ctx.strokeStyle = card.solved ? '#10b981' : '#3b82f6';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.fillStyle = '#1e293b';
      ctx.font = 'bold 24px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(card.label, card.w / 2, card.h / 2 + 8);
    } else {
      ctx.fillStyle = '#312e81';
      ctx.beginPath();
      ctx.roundRect(0, 0, card.w, card.h, 16);
      ctx.fill();
      ctx.strokeStyle = '#6366f1';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#fde047';
      ctx.font = 'bold 36px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('❓', card.w / 2, card.h / 2 + 12);
    }
    ctx.restore();
  });
}

// 5. Math Car Racing
function renderRacing(time) {
  // 3 Lanes road
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(40, 0, 420, H);
  ctx.strokeStyle = '#facc15';
  ctx.setLineDash([20, 15]);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(180, 0); ctx.lineTo(180, H);
  ctx.moveTo(320, 0); ctx.lineTo(320, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Lane Targets
  state.items.forEach(target => {
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath();
    ctx.roundRect(target.x, target.y, 60, 45, 10);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 20px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(String(target.val), target.x + 30, target.y + 28);
  });

  // Player Race Car
  const carX = [110, 250, 390][state.raceCarLane];
  ctx.font = '40px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('🏎️💨', carX, 350);
}

// 6. Mokolo CFA Market
function renderMarket(time) {
  // Market counter & scale
  ctx.fillStyle = '#334155';
  ctx.fillRect(40, 240, 420, 15);
  ctx.fillStyle = '#0f766e';
  ctx.beginPath();
  ctx.roundRect(160, 140, 180, 95, 18);
  ctx.fill();
  ctx.strokeStyle = '#2dd4bf';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 15px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText('Plateau de pesée CFA', 250, 170);
  const currentTotal = state.marketCoinsInPlate.reduce((a, b) => a + b, 0);
  ctx.font = 'bold 26px system-ui';
  ctx.fillStyle = currentTotal === state.targetPrice ? '#4ade80' : '#fde047';
  ctx.fillText(`${currentTotal} F / ${state.targetPrice} F`, 250, 205);

  // Coins in purse to drag or tap
  state.items.forEach(coin => {
    ctx.fillStyle = '#eab308';
    ctx.beginPath();
    ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#fde047';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#713f12';
    ctx.font = 'bold 14px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${coin.val}F`, coin.x, coin.y);
  });
}

// Physics & Game Tick Loop
function tick(time) {
  const dt = Math.min(0.04, (time - state.lastTime) / 1000 || 0);
  state.lastTime = time;

  if (state.running && !state.tutorOpen) {
    state.idleTime += dt;

    if (state.game === 'drop') {
      const b = state.tetrisBlock;
      if (b) {
        b.y += b.vy * dt;
        // Collision with base
        if (b.y + b.h >= 340) {
          const hitBase = state.items.find(base => 
            b.x + b.w / 2 >= base.x && b.x + b.w / 2 <= base.x + base.w
          );
          if (hitBase) {
            handleAnswer(hitBase.val);
          } else {
            handleAnswer(-1);
          }
          // Respawn new block
          const options = getAnswerOptions(state.question.ans, 3);
          b.val = options[Math.floor(Math.random() * options.length)];
          b.y = 10;
        }
      }
    } else if (state.game === 'catch') {
      state.items.forEach(gate => {
        gate.x += gate.vx * dt;
        if (gate.x < 50 || gate.x > 450) gate.vx *= -1;
      });
    } else if (state.game === 'racing') {
      state.items.forEach(target => {
        target.y += target.vy * dt;
        if (target.y > 330 && target.y < 360) {
          if (target.lane === state.raceCarLane) {
            handleAnswer(target.val);
            target.y = 600; // consumed
          }
        }
      });
      if (state.items.every(t => t.y > 380)) {
        initActiveGameMode();
      }
    }
  }

  draw(time);
  requestAnimationFrame(tick);
}

// Non-reader animated pointer guide
function updateHandPointer() {
  const hand = $('pointer-hand');
  if (!state.running || state.tutorOpen || state.idleTime < 2.5) {
    hand.classList.remove('active');
    return;
  }

  hand.classList.add('active');
  const rect = canvas.getBoundingClientRect();

  if (state.game === 'drop') {
    const correctBase = state.items.find(i => i.val === state.question.ans);
    if (correctBase) {
      hand.style.left = `${(correctBase.x + correctBase.w / 2) * (rect.width / W)}px`;
      hand.style.top = `${correctBase.y * (rect.height / H) - 40}px`;
    }
  } else if (state.game === 'fruit') {
    if (state.items.length > 0) {
      hand.style.left = `${state.items[0].x * (rect.width / W)}px`;
      hand.style.top = `${state.items[0].y * (rect.height / H) - 30}px`;
    }
  } else if (state.game === 'match') {
    const openCard = state.cards.find(c => !c.solved);
    if (openCard) {
      hand.style.left = `${(openCard.x + openCard.w / 2) * (rect.width / W)}px`;
      hand.style.top = `${openCard.y * (rect.height / H) - 30}px`;
    }
  }
}

// --- VOICE-FIRST ANIMATED TUTOR ENGINE ---
function openTutor() {
  state.tutorOpen = true;
  state.tutorStep = 0;
  state.tutorMode = 'WATCH';
  $('tutor-modal').classList.add('open');
  drawTutorScene();
}

function closeTutor() {
  state.tutorOpen = false;
  $('tutor-modal').classList.remove('open');
  state.running = true;
  state.lives = Math.max(2, state.lives);
  updateStatsDOM();
  generateQuestion();
}

function drawTutorScene() {
  const q = state.question;
  if (!q) return;
  tctx.clearRect(0, 0, 480, 190);

  // Background
  tctx.fillStyle = '#f1f5f9';
  tctx.fillRect(0, 0, 480, 190);

  const mode = state.tutorMode;

  if (mode === 'WATCH') {
    // Mode 1: Watch Me (Animated grouping of two sets of fruit)
    $('tutor-speech-text').textContent = `« Regarde : ${q.a} mangues réunies avec ${q.b} bananes font ${q.ans} ! »`;
    VoiceEngine.speak(`Regarde bien : ${q.a} mangues réunies avec ${q.b} bananes font au total ${q.ans} !`);

    // Group A (blue)
    for (let i = 0; i < q.a; i++) {
      const x = 40 + i * 40;
      tctx.font = '32px system-ui';
      tctx.fillText(q.icon, x, 80);
    }
    // Plus
    tctx.fillStyle = '#3b82f6';
    tctx.font = 'bold 36px system-ui';
    tctx.fillText('➕', 40 + q.a * 40 + 10, 80);

    // Group B (gold)
    for (let j = 0; j < q.b; j++) {
      const x = 40 + q.a * 40 + 60 + j * 40;
      tctx.fillText('🍏', x, 80);
    }

    // Arrow pointing to total
    tctx.fillStyle = '#10b981';
    tctx.font = 'bold 22px system-ui';
    tctx.fillText(`Total = ${q.ans} ! 🌟`, 240, 150);

  } else if (mode === 'TOGETHER') {
    // Mode 2: Interactive touch fusion
    $('tutor-speech-text').textContent = '« Touche le rectangle vert pour fusionner les deux paquets ! »';
    VoiceEngine.speak('Touche le rectangle vert pour fusionner les deux paquets !');

    tctx.fillStyle = '#dcfce7';
    tctx.beginPath();
    tctx.roundRect(100, 45, 280, 80, 18);
    tctx.fill();
    tctx.strokeStyle = '#22c55e';
    tctx.lineWidth = 3;
    tctx.stroke();

    tctx.fillStyle = '#15803d';
    tctx.font = 'bold 22px system-ui';
    tctx.textAlign = 'center';
    tctx.fillText(`⚡ FUSIONNER (${q.a} + ${q.b})`, 240, 92);

  } else if (mode === 'TRANSFER') {
    // Mode 3: Independent transfer problem
    $('tutor-speech-text').textContent = '« À ton tour ! Résous ce problème tout seul comme un grand ! »';
    VoiceEngine.speak('À ton tour ! Résous ce problème tout seul comme un grand !');

    tctx.fillStyle = '#fef3c7';
    tctx.beginPath();
    tctx.roundRect(80, 40, 320, 90, 20);
    tctx.fill();
    tctx.strokeStyle = '#f59e0b';
    tctx.lineWidth = 3;
    tctx.stroke();

    tctx.fillStyle = '#92400e';
    tctx.font = 'bold 28px system-ui';
    tctx.textAlign = 'center';
    tctx.fillText(`Nouveau défi : ${q.a + 1} + ${q.b} = ?`, 240, 95);

  } else if (mode === 'STRATEGY') {
    // Mode 4: Ten-Frame Regrouping Astuce
    $('tutor-speech-text').textContent = '« Astuce magique : On complète d\'abord une boîte de 10 ! »';
    VoiceEngine.speak('Astuce magique : On complète d\'abord une boîte de 10 !');

    // Draw Ten-Frame (2 rows of 5)
    tctx.strokeStyle = '#cbd5e1';
    tctx.lineWidth = 2;
    for (let c = 0; c < 5; c++) {
      for (let r = 0; r < 2; r++) {
        tctx.fillStyle = (c + r * 5) < q.ans ? '#3b82f6' : '#ffffff';
        tctx.beginPath();
        tctx.roundRect(80 + c * 60, 40 + r * 50, 50, 40, 8);
        tctx.fill();
        tctx.stroke();
      }
    }
  } else if (mode === 'WHY') {
    // Mode 5: Why it works
    $('tutor-speech-text').textContent = '« Notre écriture compte par paquets de 10. Dès qu\'on a 10 unités, on fabrique 1 dizaine ! »';
    VoiceEngine.speak('Notre écriture compte par paquets de 10. Dès qu\'on a 10 unités, on fabrique une dizaine !');

    tctx.fillStyle = '#3b82f6';
    tctx.font = 'bold 20px system-ui';
    tctx.textAlign = 'center';
    tctx.fillText('10 Petits Cubes 🟨 = 1 Barre de Dix 🟦', 240, 90);
  }
}

$('repeat-audio-btn').onclick = speakCurrentQuestion;

$('sound-btn').onclick = () => {
  AudioEngine.soundEnabled = !AudioEngine.soundEnabled;
  $('sound-btn').textContent = AudioEngine.soundEnabled ? '🔊 Son ON' : '🔇 Son OFF';
  if (!AudioEngine.soundEnabled && 'speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
};

$('lang-btn').onclick = () => {
  VoiceEngine.lang = VoiceEngine.lang === 'fr' ? 'en' : 'fr';
  $('lang-btn').textContent = VoiceEngine.lang === 'fr' ? '🇨🇲 FR' : '🇬🇧 EN';
  VoiceEngine.speak(VoiceEngine.lang === 'fr' ? 'Langue française sélectionnée' : 'English language selected');
  generateQuestion();
};

// Mascot Tap interaction
$('mascot-avatar').onclick = () => {
  AudioEngine.playSuccess();
  VoiceEngine.speak('Bonjour ! Je suis Hibou, ton tuteur malin. Prêt pour l\'aventure ?');
};

// Grade pills
document.querySelectorAll('#grade-pills .pill-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#grade-pills .pill-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.grade = parseInt(btn.dataset.grade);
    AudioEngine.playDrop();
    generateQuestion();
  };
});

// Game cards
document.querySelectorAll('.game-card-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.game-card-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.game = btn.dataset.game;
    AudioEngine.playWhoosh();
    initActiveGameMode();
    VoiceEngine.speak(t(state.game));
  };
});

// Tutor mode tabs
document.querySelectorAll('.tutor-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tutor-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.tutorMode = tab.dataset.tutorMode;
    AudioEngine.playDrop();
    drawTutorScene();
  };
});

$('tutor-btn-next').onclick = () => {
  const modes = ['WATCH', 'TOGETHER', 'TRANSFER', 'STRATEGY', 'WHY'];
  const curIdx = modes.indexOf(state.tutorMode);
  const nextMode = modes[(curIdx + 1) % modes.length];
  state.tutorMode = nextMode;
  document.querySelectorAll('.tutor-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tutorMode === nextMode);
  });
  drawTutorScene();
};

$('tutor-btn-prev').onclick = () => {
  const modes = ['WATCH', 'TOGETHER', 'TRANSFER', 'STRATEGY', 'WHY'];
  const curIdx = modes.indexOf(state.tutorMode);
  const prevMode = modes[(curIdx - 1 + modes.length) % modes.length];
  state.tutorMode = prevMode;
  document.querySelectorAll('.tutor-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tutorMode === prevMode);
  });
  drawTutorScene();
};

// On-screen tactile pad controls
$('btn-left').onclick = () => {
  state.idleTime = 0;
  if (state.game === 'drop' && state.tetrisBlock) {
    state.tetrisBlock.x = Math.max(30, state.tetrisBlock.x - 50);
  } else if (state.game === 'catch') {
    state.playerX = Math.max(40, state.playerX - 60);
  } else if (state.game === 'racing') {
    state.raceCarLane = Math.max(0, state.raceCarLane - 1);
  }
};

$('btn-right').onclick = () => {
  state.idleTime = 0;
  if (state.game === 'drop' && state.tetrisBlock) {
    state.tetrisBlock.x = Math.min(390, state.tetrisBlock.x + 50);
  } else if (state.game === 'catch') {
    state.playerX = Math.min(460, state.playerX + 60);
  } else if (state.game === 'racing') {
    state.raceCarLane = Math.min(2, state.raceCarLane + 1);
  }
};

$('btn-action').onclick = () => {
  state.idleTime = 0;
  if (state.game === 'drop' && state.tetrisBlock) {
    state.tetrisBlock.vy += 120; // Turbo drop
  } else if (state.game === 'catch') {
    // Check catch collision
    const near = state.items.find(g => Math.hypot(g.x - state.playerX, g.y - 330) < 60);
    if (near) handleAnswer(near.val);
  }
};

// Canvas Pointer Interaction (Tap / Click on elements)
canvas.addEventListener('pointerdown', (e) => {
  state.idleTime = 0;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (W / rect.width);
  const y = (e.clientY - rect.top) * (H / rect.height);

  if (!state.running) {
    state.running = true;
    updateStatsDOM();
    generateQuestion();
    return;
  }

  if (state.game === 'fruit') {
    // Tap to harvest fruit
    const touched = state.items.find(f => Math.hypot(f.x - x, f.y - y) < f.radius + 15);
    if (touched) {
      AudioEngine.playDrop();
      VoiceEngine.speak(`${touched.val}`);
      state.items = state.items.filter(f => f !== touched);
      if (state.items.length === 0) {
        handleAnswer(state.question.ans);
      }
    }
  } else if (state.game === 'match') {
    // Tap to flip cards
    const card = state.cards.find(c => x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h);
    if (card && !card.flipped && !card.solved) {
      AudioEngine.playWhoosh();
      card.flipped = true;
      const flipped = state.cards.filter(c => c.flipped && !c.solved);
      if (flipped.length === 2) {
        if (flipped[0].val === flipped[1].val) {
          flipped[0].solved = true;
          flipped[1].solved = true;
          handleAnswer(state.question.ans);
        } else {
          setTimeout(() => {
            flipped[0].flipped = false;
            flipped[1].flipped = false;
          }, 900);
        }
      }
    }
  } else if (state.game === 'drop') {
    // Touch column to position falling block directly
    if (state.tetrisBlock) {
      state.tetrisBlock.x = Math.max(30, Math.min(390, x - 40));
    }
  } else if (state.game === 'catch') {
    state.playerX = Math.max(40, Math.min(460, x));
    const near = state.items.find(g => Math.hypot(g.x - x, g.y - y) < g.radius + 15);
    if (near) handleAnswer(near.val);
  } else if (state.game === 'market') {
    // Tap coin to deposit into scale
    const coin = state.items.find(c => Math.hypot(c.x - x, c.y - y) < c.radius + 10);
    if (coin) {
      AudioEngine.playCoin();
      state.marketCoinsInPlate.push(coin.val);
      const total = state.marketCoinsInPlate.reduce((a, b) => a + b, 0);
      VoiceEngine.speak(`${coin.val} Francs déposés ! Total : ${total}`);
      if (total >= state.targetPrice) {
        handleAnswer(total);
      }
    }
  } else if (state.game === 'racing') {
    if (x < 180) state.raceCarLane = 0;
    else if (x < 320) state.raceCarLane = 1;
    else state.raceCarLane = 2;
  }
});

// Keyboard controls
window.addEventListener('keydown', (e) => {
  state.idleTime = 0;
  if (e.key === 'ArrowLeft') $('btn-left').click();
  if (e.key === 'ArrowRight') $('btn-right').click();
  if (e.key === ' ' || e.key === 'ArrowDown') $('btn-action').click();
});

// Auto-start on first load
generateQuestion();
requestAnimationFrame(tick);
</script>
</body>
</html>
