<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NATEIVA WORLD • Île aux Découvertes</title>
<!--
  NATEIVA WORLD v1.0 — Brand-new cutting-edge kids experience (built from zero).
  Only the LEARNING OBJECTIVES are shared with the classic arcade:
  Z1 Lagune aux Bulles  — counting & sums            (pop bubbles)
  Z2 Verger de Momo     — add/sub/multiply/divide    (drag fruit into baskets)
  Z3 Rivière de Fela    — phonics & syllables        (frog leaps on lily pads)
  Z4 Studio de Zara     — colors & shapes            (paint the animal)
  Z5 Lagon Splash       — float or sink physics      (drop & sort objects)
  Z6 Jardin de Nana     — plant needs & growth       (drag rain cloud & sun)
  Z7 Safari Ballon      — Africa geography           (fly the balloon to countries)
  Z8 Théâtre Kalulu     — listening comprehension    (watch the play, pick & order picture panels)
  Rules: hand-drawn SVG cartoon art (no emoji sprites), 100% direct manipulation,
  zero answer buttons, zero required reading, audio-first FR/EN, classes MAT→CM2.
-->
<style>
:root{
  --red:#FF4D57; --red2:#E5252A; --yellow:#FFD23F; --orange:#FF9F1C;
  --green:#2EC4B6; --leaf:#57CC57; --blue:#4CC9F0; --deep:#2B2D64;
  --cream:#FFF8EC; --ink:#2B2D42;
  --shadow:0 10px 24px rgba(43,45,66,0.25);
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
html,body{ width:100%; height:100%; overflow:hidden; font-family:'Baloo 2','Fredoka','Comic Sans MS',system-ui,sans-serif; background:#87CEEB; touch-action:none; }
#app{ position:fixed; inset:0; overflow:hidden; }

/* ---------- Scenes ---------- */
.scene{ position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity 0.5s ease, transform 0.6s cubic-bezier(0.22,1,0.36,1); transform:scale(1.06); }
.scene.on{ opacity:1; pointer-events:auto; transform:scale(1); }
.scene svg.stage{ width:100%; height:100%; display:block; }

/* ---------- HUD ---------- */
#hud{ position:absolute; top:0; left:0; right:0; padding:10px 14px; display:flex; align-items:center; gap:10px; z-index:40; pointer-events:none; }
#hud > *{ pointer-events:auto; }
.hbtn{ width:54px; height:54px; border-radius:50%; border:3px solid #fff; background:linear-gradient(145deg,var(--red),var(--red2)); box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1); flex:0 0 auto; }
.hbtn:active{ transform:scale(0.88); }
.hbtn svg{ width:28px; height:28px; }
.hbtn.alt{ background:linear-gradient(145deg,#5E60CE,#4EA8DE); }
.hbtn.sun{ background:linear-gradient(145deg,var(--yellow),var(--orange)); }
#star-pill{ margin-left:auto; background:#fff; border:3px solid var(--yellow); border-radius:999px; padding:7px 16px; font-size:1.25rem; font-weight:800; color:var(--ink); box-shadow:var(--shadow); display:flex; align-items:center; gap:7px; }
#star-pill svg{ width:26px; height:26px; }
#grade-dock{ position:absolute; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:7px; z-index:40; background:rgba(255,255,255,0.75); backdrop-filter:blur(8px); padding:7px 10px; border-radius:999px; box-shadow:var(--shadow); }
.gpill{ min-width:52px; padding:6px 10px; border-radius:999px; border:3px solid transparent; background:#EDF2FB; cursor:pointer; text-align:center; font-weight:800; color:#5C6784; font-size:0.78rem; line-height:1.05; transition:all 0.2s; }
.gpill small{ display:block; font-size:0.58rem; font-weight:700; opacity:0.7; }
.gpill.on{ background:linear-gradient(145deg,var(--red),var(--red2)); color:#fff; border-color:#fff; transform:scale(1.12); box-shadow:0 6px 14px rgba(229,37,42,0.45); }
.gpill.on small{ opacity:0.92; }

/* ---------- Big friendly banner ---------- */
#mission-bar{ position:absolute; top:76px; left:50%; transform:translateX(-50%) scale(0); width:min(720px,94%); z-index:35; background:rgba(255,255,255,0.82); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:3px solid rgba(255,210,63,0.95); border-radius:26px; padding:9px 14px; box-shadow:0 10px 26px rgba(43,45,66,0.22); display:flex; align-items:center; gap:10px; transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1), width 0.3s, padding 0.3s; cursor:pointer; }
#mission-bar.on{ transform:translateX(-50%) scale(1); }
#mission-icon{ width:48px; height:48px; flex:0 0 auto; }
#mission-text{ flex:1 1 auto; min-width:0; font-size:1.1rem; font-weight:800; color:var(--ink); line-height:1.22; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
/* after a few seconds the bar folds into a small pill so the game is never hidden */
#mission-bar.mini{ width:auto; padding:6px 10px; gap:7px; }
#mission-bar.mini #mission-text, #mission-bar.mini #mission-subject{ display:none; }
#mission-bar.mini #mission-icon{ width:34px; height:34px; }
#mission-speaker{ margin-left:auto; flex:0 0 auto; width:44px; height:44px; }
#mission-subject{ flex:0 0 auto; padding:7px 13px; border-radius:999px; color:#fff; font-weight:900; font-size:0.86rem; letter-spacing:0.04em; border:3px solid #fff; box-shadow:0 4px 10px rgba(0,0,0,0.18); white-space:nowrap; }
#mission-trick{ flex:0 0 auto; width:44px; height:44px; margin-left:auto; display:flex; align-items:center; justify-content:center; font-size:1.5rem; background:#FFF8E1; border:3px solid #FFD23F; border-radius:50%; cursor:pointer; transition:transform 0.2s; animation:bob 2.4s ease-in-out infinite; }
#mission-trick:active{ transform:scale(0.85); }
#mission-speaker{ margin-left:0; }
@media(max-width:760px){ #mission-subject{ font-size:0.62rem; padding:4px 8px; border-width:2px; max-width:34%; overflow:hidden; text-overflow:ellipsis; } #mission-text{ font-size:0.92rem; line-height:1.22; } }

/* ---------- Progress gems ---------- */
#round-gems{ position:absolute; top:18px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:36; }
.gem{ width:22px; height:22px; border-radius:50%; background:#fff; border:3px solid #C9D3EE; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1); }
.gem.done{ background:radial-gradient(circle at 35% 30%,#FFF3B0,var(--yellow)); border-color:var(--orange); transform:scale(1.25); box-shadow:0 0 12px rgba(255,210,63,0.9); }

/* ---------- Celebration ---------- */
#confetti-layer{ position:absolute; inset:0; pointer-events:none; z-index:60; overflow:hidden; }
.conf{ position:absolute; width:14px; height:14px; border-radius:3px; will-change:transform; }
#cheer-card{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:55; background:rgba(43,45,66,0.35); backdrop-filter:blur(4px); }
#cheer-card.on{ display:flex; }
#cheer-inner{ background:linear-gradient(160deg,#FFF8EC,#FFE8C2); border:5px solid var(--yellow); border-radius:34px; padding:30px 44px; text-align:center; box-shadow:0 30px 70px rgba(0,0,0,0.4); animation:cheerPop 0.5s cubic-bezier(0.34,1.56,0.64,1); max-width:88%; }
#cheer-art{ width:150px; height:150px; margin:0 auto; }
#cheer-title{ font-size:1.7rem; font-weight:800; color:var(--ink); margin-top:6px; }
#cheer-stars{ display:flex; justify-content:center; gap:8px; margin-top:8px; }
#cheer-stars svg{ width:46px; height:46px; animation:starIn 0.5s cubic-bezier(0.34,1.56,0.64,1) backwards; }
#cheer-stars svg:nth-child(2){ animation-delay:0.18s; } #cheer-stars svg:nth-child(3){ animation-delay:0.36s; }
#cheer-btn{ margin-top:16px; background:linear-gradient(145deg,var(--leaf),#2E9E5B); color:#fff; border:4px solid #fff; border-radius:999px; padding:12px 38px; font-size:1.3rem; font-weight:800; font-family:inherit; cursor:pointer; box-shadow:var(--shadow); transition:transform 0.18s; }
#cheer-btn:active{ transform:scale(0.9); }
@keyframes cheerPop{ from{ transform:scale(0.3) rotate(-6deg); opacity:0; } }
@keyframes starIn{ from{ transform:scale(0) rotate(-120deg); } }

/* ---------- Generic cartoon motion ---------- */
@keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-9px); } }
@keyframes bobBig{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-16px); } }
@keyframes sway{ 0%,100%{ transform:rotate(-4deg); } 50%{ transform:rotate(4deg); } }
@keyframes swimL{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(-14px); } }
@keyframes rays{ from{ transform:rotate(0); } to{ transform:rotate(360deg); } }
@keyframes drift{ from{ transform:translateX(-200px); } to{ transform:translateX(2000px); } }
@keyframes wobble{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-7deg); } 75%{ transform:rotate(7deg); } }
@keyframes squish{ 0%{ transform:scale(1,1); } 35%{ transform:scale(1.25,0.75); } 70%{ transform:scale(0.85,1.15); } 100%{ transform:scale(1,1); } }
@keyframes popIn{ from{ transform:scale(0); } to{ transform:scale(1); } }
.pop-in{ animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
.pop-in,.wobble,.squish{ transform-box:fill-box; transform-origin:center; }
.wobble{ animation:wobble 0.45s ease 2; }
.squish{ animation:squish 0.5s ease; }
.grab{ cursor:grab; } .grabbing{ cursor:grabbing; }

/* Map stations */
.station{ cursor:pointer; }
.station:hover .st-ring-main{ stroke-width:11; filter:brightness(1.06); }
.station:hover .st-pill{ filter:brightness(1.12); }
.station .ring{ animation:bob 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
#back-home-float{ position:absolute; bottom:14px; right:14px; z-index:40; }
.hbtn.search{ background:linear-gradient(145deg,#2EC4B6,#1B9C8F); }
#search-overlay{ position:fixed; inset:0; z-index:70; background:rgba(43,45,66,0.45); backdrop-filter:blur(6px); display:none; align-items:flex-start; justify-content:center; padding:70px 16px 16px; }
#search-overlay.on{ display:flex; }
#search-panel{ background:#fff; border:5px solid #2EC4B6; border-radius:30px; width:min(760px,100%); max-height:82vh; overflow:auto; padding:18px; box-shadow:0 30px 70px rgba(0,0,0,0.4); }
#search-head{ display:flex; gap:10px; }
#search-input{ flex:1; font-family:inherit; font-size:1.3rem; font-weight:800; color:var(--ink); border:4px solid #C9D3EE; border-radius:999px; padding:12px 22px; outline:none; }
#search-input:focus{ border-color:#2EC4B6; }
.sage-chips{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 2px; }
.sage-chip{ font-family:inherit; font-weight:800; font-size:0.95rem; color:#4A3AA8; background:#EFEAFF; border:3px solid #C9B6F5; border-radius:999px; padding:8px 14px; cursor:pointer; }
.sage-chip:active{ transform:scale(0.94); }
.sage-card{ display:flex; gap:12px; align-items:center; background:linear-gradient(135deg,#FFF8E1,#FFEFF4); border:4px solid #FFD23F; border-radius:24px; padding:14px; margin:10px 0; }
.sage-card .sage-a{ flex:1; min-width:0; font-weight:800; font-size:1.08rem; color:#2B2D42; line-height:1.35; }
.sage-card button{ font-family:inherit; font-weight:800; font-size:0.95rem; color:#fff; background:linear-gradient(135deg,#FF2A32,#E5252A); border:3px solid #fff; border-radius:999px; padding:10px 14px; cursor:pointer; box-shadow:0 6px 14px rgba(229,37,42,0.35); }
@media (max-width:700px){ .sage-card{ flex-wrap:wrap; } .sage-card button{ width:100%; } }
#search-close{ width:56px; border-radius:50%; border:4px solid #fff; background:linear-gradient(145deg,#FF4D57,#E5252A); color:#fff; font-size:1.2rem; cursor:pointer; }
#search-results{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; margin-top:16px; }
.sr-card{ border:4px solid #E3E8F7; border-radius:22px; padding:14px 10px; text-align:center; cursor:pointer; background:#FBFCFF; transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1), border-color 0.2s; }
.sr-card:hover{ transform:scale(1.05); border-color:#2EC4B6; }
.sr-card svg{ width:70px; height:70px; }
.sr-sub{ display:inline-block; margin-top:4px; padding:4px 12px; border-radius:999px; color:#fff; font-weight:900; font-size:0.74rem; }
.sr-name{ font-weight:800; color:var(--ink); margin-top:5px; font-size:1.02rem; }

/* ---------- Academy quiz (searchable curriculum quizzes) ---------- */
.quiz-wrap{ position:absolute; inset:0; overflow:auto; background:linear-gradient(160deg,#5E60CE 0%,#4EA8DE 100%); padding:150px 14px 24px; display:flex; flex-direction:column; align-items:center; gap:14px; }
.qz-panel{ background:#fff; border:5px solid #FFD23F; border-radius:28px; width:min(880px,97%); padding:18px 22px; box-shadow:0 20px 50px rgba(0,0,0,0.3); }
.qz-title{ font-size:1.5rem; font-weight:800; color:#2B2D42; text-align:center; }
.qz-sub{ text-align:center; color:#8A93AD; font-weight:700; margin-top:4px; }
.qz-cur{ background:#EDF2FB; border-radius:16px; padding:10px 14px; margin-top:12px; font-weight:700; color:#5C6784; font-size:0.95rem; line-height:1.45; }
.qz-cur b{ color:#5E60CE; }
.qz-search{ width:100%; font-family:inherit; font-size:1.1rem; font-weight:800; color:#2B2D42; border:4px solid #C9D3EE; border-radius:999px; padding:11px 20px; outline:none; margin-top:12px; }
.qz-search:focus{ border-color:#5E60CE; }
.qz-chips{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:14px; }
.qz-chip{ border:3px solid #E3E8F7; background:#FBFCFF; border-radius:999px; padding:11px 18px; font-family:inherit; font-weight:800; font-size:1rem; color:#2B2D42; cursor:pointer; transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1), border-color 0.18s; }
.qz-chip:hover{ transform:scale(1.07); border-color:#5E60CE; }
.qz-chip .dot{ display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:8px; }
.qz-q{ font-size:1.5rem; font-weight:800; color:#2B2D42; text-align:center; line-height:1.35; }
.qz-dots{ font-size:1.9rem; text-align:center; letter-spacing:4px; margin-top:6px; }
.qz-answers{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-top:16px; }
.qz-a{ border:4px solid #C9D3EE; background:#FBFCFF; border-radius:20px; padding:16px 10px; font-family:inherit; font-size:1.3rem; font-weight:800; color:#2B2D42; cursor:pointer; transition:transform 0.15s, border-color 0.15s; }
.qz-a:hover:not(:disabled){ border-color:#5E60CE; transform:scale(1.04); }
.qz-a.good{ background:#57CC57; border-color:#2E9E5B; color:#fff; }
.qz-a.bad{ background:#FF4D57; border-color:#C42631; color:#fff; }
.qz-a:disabled{ cursor:default; }
.qz-steps{ margin-top:14px; background:#FFF8E1; border:3px solid #FFD23F; border-radius:18px; padding:12px 16px; display:none; text-align:left; }
.qz-steps.on{ display:block; }
.qz-steps h4{ color:#B4654A; margin-bottom:6px; font-size:1.05rem; }
.qz-steps ol{ margin-left:24px; color:#2B2D42; font-weight:700; line-height:1.55; }
.qz-btnrow{ text-align:center; }
.qz-next{ margin-top:14px; background:linear-gradient(145deg,#57CC57,#2E9E5B); color:#fff; border:4px solid #fff; border-radius:999px; padding:12px 36px; font-size:1.15rem; font-weight:800; font-family:inherit; cursor:pointer; box-shadow:var(--shadow); display:none; }
.qz-next.on{ display:inline-block; }
.qz-next:active{ transform:scale(0.93); }
.qz-hintbtn{ margin-top:12px; background:#FFF8E1; border:3px solid #FFD23F; border-radius:999px; padding:9px 22px; font-family:inherit; font-weight:800; font-size:1rem; color:#B4654A; cursor:pointer; display:inline-block; }
.qz-prog{ text-align:center; font-weight:800; color:#5E60CE; margin-bottom:4px; }
.qz-sheet-row{ border:3px solid #E3E8F7; border-radius:16px; padding:10px 14px; margin-top:10px; font-weight:700; color:#2B2D42; }
.qz-sheet-row.ok{ border-color:#57CC57; background:#F0FBF0; }
.qz-sheet-row.ko{ border-color:#FF4D57; background:#FFF3F3; }
.qz-sheet-row details{ margin-top:6px; }
.qz-sheet-row summary{ cursor:pointer; color:#B4654A; font-weight:800; }
.qz-sheet-row ol{ margin-left:22px; margin-top:6px; line-height:1.5; }
.qz-score{ text-align:center; font-size:1.3rem; font-weight:800; color:#2B2D42; margin-top:8px; }

/* ---------- Phone-first (95% of kids play on phones) ---------- */
#grade-dock{ max-width:96vw; overflow-x:auto; scrollbar-width:none; }
#grade-dock::-webkit-scrollbar{ display:none; }
@media(max-width:760px){
  .hbtn{ width:46px; height:46px; border-width:2.5px; }
  .hbtn svg{ width:24px; height:24px; }
  #hud{ padding:8px 8px; gap:7px; }
  #star-pill{ padding:5px 12px; font-size:1.05rem; }
  #star-pill svg{ width:21px; height:21px; }
  .gpill{ min-width:46px; padding:5px 8px; font-size:0.72rem; }
  #grade-dock{ bottom:8px; gap:5px; padding:6px 8px; }
  #mission-bar{ top:60px; padding:8px 10px; gap:8px; border-radius:20px; border-width:3px; }
  #mission-icon{ width:34px; height:34px; }
  #mission-trick,#mission-speaker{ width:36px; height:36px; font-size:1.15rem; }
  #round-gems{ top:11px; gap:6px; } .gem{ width:17px; height:17px; }
  .quiz-wrap{ padding:112px 8px 16px; }
  .qz-panel{ padding:13px 12px; border-radius:20px; border-width:4px; }
  .qz-title{ font-size:1.18rem; } .qz-q{ font-size:1.12rem; }
  .qz-a{ font-size:1.02rem; padding:12px 8px; border-radius:16px; border-width:3px; }
  .qz-answers{ grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:9px; }
  .qz-chip{ font-size:0.86rem; padding:8px 12px; }
  .qz-cur{ font-size:0.84rem; }
  .qz-search{ font-size:0.95rem; padding:9px 16px; }
  .qz-steps{ padding:10px 12px; }
  .qz-steps ol{ margin-left:18px; font-size:0.92rem; }
  .qz-next{ font-size:1rem; padding:10px 26px; }
  .qz-hintbtn{ font-size:0.9rem; padding:8px 16px; }
  .qz-sheet-row{ font-size:0.92rem; padding:9px 11px; }
  #search-overlay{ padding:56px 8px 8px; }
  #search-results{ grid-template-columns:repeat(auto-fill,minmax(136px,1fr)); gap:8px; }
  .sr-card svg{ width:52px; height:52px; }
  .sr-name{ font-size:0.86rem; }
  #search-input{ font-size:1rem; padding:9px 16px; }
  #cheer-inner{ padding:20px 22px; }
  #cheer-title{ font-size:1.3rem; }
  #cheer-art{ width:110px; height:110px; }
}
/* rotate hint for big playground zones on portrait phones */
#rotate-hint{ position:absolute; left:50%; bottom:78px; transform:translateX(-50%); z-index:45; background:rgba(43,45,66,0.9); color:#fff; font-weight:800; padding:10px 20px; border-radius:999px; font-size:0.92rem; display:none; align-items:center; gap:8px; box-shadow:var(--shadow); pointer-events:none; white-space:nowrap; }
#rotate-hint.on{ display:flex; animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
#ver-tag{ position:absolute; right:9px; bottom:4px; z-index:41; font-size:0.62rem; font-weight:700; color:rgba(43,45,66,0.55); text-shadow:0 1px 2px rgba(255,255,255,0.7); pointer-events:none; }
/* ---------- Math Lab lesson player ---------- */
.ml-stage{ width:100%; border:4px solid #FFD23F; border-radius:20px; background:linear-gradient(180deg,#FFFFFF,#F2F7FF); margin-top:12px; display:block; }
.ml-step{ margin-top:12px; background:#FFF8E1; border:3px solid #FFD23F; border-radius:16px; padding:11px 15px; font-weight:800; color:#2B2D42; font-size:1.1rem; line-height:1.4; text-align:center; }
@media(max-width:760px){ .ml-step{ font-size:0.95rem; padding:9px 11px; } }
/* ---------- Griot story player ---------- */
.gr-art{ width:min(340px,70%); margin:10px auto 0; display:block; }
.gr-text{ margin-top:12px; font-size:1.22rem; font-weight:800; color:#2B2D42; line-height:1.5; text-align:center; }
.gr-page{ text-align:center; color:#A0522D; font-weight:800; margin-top:8px; }
@media(max-width:760px){ .gr-text{ font-size:1.02rem; } }

/* ---------- Scrolling adventure trail (phone home) ---------- */
#scene-map.scroll{ overflow-y:auto; overflow-x:hidden; touch-action:pan-y; }
#scene-map.scroll svg.trail{ width:100%; height:auto; display:block; }
/* ---------- Visible FR | EN switch ---------- */
.hbtn.langbtn{ width:auto; min-width:92px; padding:0 15px; border-radius:999px; font-size:1.05rem; font-weight:800; color:#fff; letter-spacing:0.02em; gap:6px; font-family:inherit; }
.langbtn span{ opacity:0.5; transition:all 0.2s; }
.langbtn span.on{ opacity:1; transform:scale(1.18); text-shadow:0 1px 3px rgba(0,0,0,0.35); }
.langbtn .lsep{ opacity:0.55; }
@media(max-width:760px){ .hbtn.langbtn{ min-width:78px; padding:0 11px; font-size:0.95rem; } }

/* ---------- Activity doors: pick your game inside a playground ---------- */
.act-menu{ position:absolute; inset:0; overflow:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:120px 14px 30px; }
.act-title{ font-size:1.6rem; font-weight:800; color:#fff; text-shadow:0 3px 8px rgba(0,0,0,0.35); text-align:center; }

function mkStage(host) {

  const W = landscape ? 1500 : 850, H = landscape ? 850 : 1500;

      }
    }
  }
  function finishRound() {

  function nextRound() {

      else drawFish(pa, 0, 0, 0.5, wantColor ? wantColor[0] : '#4CC9F0');

      const whatE = (wantColor ? wantColor[2] + ' ' : '') + (wantKind === 'star' ? 'starfish' : 'fish');

    }
    roundLive = true;
    clearInterval(spawnTimer);
    spawnTimer = setInterval(spawnBubble, Math.max(430, 900 - D() * 60 - Rounds.idx * 45));
    for (let i = 0; i < 4; i++) setTimeout(spawnBubble, i * 180);
  }
  nextRound();
};

/* ================= Z2 — VERGER DE MOMO (drag fruit: add, multiply, share) ================= */
ZONE_BUILDERS.orchard = function (host) {
  const ST = mkStage(host); const svg = ST.svg, PT = ST.P, SW = ST.W, SH = ST.H;
  gradDefs(svg);
  S('rect', { width: SW, height: PT(560, 1180), fill: skyFill() }, svg);
  S('rect', { y: PT(540, 1160), width: SW, height: PT(310, 360), fill: 'url(#gGrass)' }, svg);
  drawSun(svg, PT(1370, 700), PT(110, 330), PT(0.9, 0.8));
  drawCloud(svg, PT(300, 170), PT(100, 320), PT(0.9, 0.75));
  // big tree
  const tree = S('g', { transform: PT('translate(330,430)', 'translate(230,560) scale(0.78)') }, svg);
  S('rect', { x: -40, y: -40, width: 80, height: 240, rx: 30, fill: 'url(#gWood)' }, tree);
  S('path', { d: 'M -20 60 Q -70 60 -90 110', stroke: '#8A5A33', 'stroke-width': 22, fill: 'none', 'stroke-linecap': 'round' }, tree);
  [[-150, -120, 110], [0, -190, 130], [150, -120, 110], [-70, -60, 90], [80, -60, 90]].forEach(([cx, cy, r]) => S('circle', { cx, cy, r, fill: '#3FA34D' }, tree));
  [[-150, -120], [0, -190], [150, -120]].forEach(([cx, cy]) => S('circle', { cx: cx - 26, cy: cy - 22, r: 30, fill: 'rgba(255,255,255,0.18)' }, tree));
  const momo = drawMonkey(svg, PT(1210, 660), PT(330, 560), PT(1.05, 0.9));
  fxBob(momo, 9, 2600);
  const fruitLayer = S('g', {}, svg);
  const basketLayer = S('g', {}, svg);
  const FRUITS = [
    { name: ['banane', 'banana'], draw: (g) => { S('path', { d: 'M -24 6 Q 0 30 26 2 Q 30 -4 24 -4 Q 2 16 -18 -2 Q -26 0 -24 6 Z', fill: '#FFD23F', stroke: '#D9A400', 'stroke-width': 3 }, g); } },
    { name: ['mangue', 'mango'], draw: (g) => { S('ellipse', { cx: 0, cy: 2, rx: 22, ry: 17, fill: '#FF9F1C', stroke: '#D97800', 'stroke-width': 3 }, g); S('path', { d: 'M 8 -14 Q 16 -24 24 -18', stroke: '#3FA34D', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }, g); } },
    { name: ['pomme', 'apple'], draw: (g) => { S('path', { d: 'M 0 -8 C 22 -22 32 6 14 18 C 6 24 -6 24 -14 18 C -32 6 -22 -22 0 -8 Z', fill: '#FF4D57', stroke: '#C42631', 'stroke-width': 3 }, g); S('rect', { x: -2, y: -22, width: 4, height: 12, rx: 2, fill: '#6B421D' }, g); } }
  ];
  let baskets = [], fruits = [], needPer = [], mode = 'count', roundLive = false, fruitDef = FRUITS[0];
  function activeBasket() {
    if (mode === 'share') { const total = baskets.reduce((s2, b) => s2 + b.got, 0); return baskets.every(b => b.got >= b.slots) ? null : baskets[total % baskets.length]; }
    for (let i = 0; i < baskets.length; i++) if (baskets[i].got < needPer[i]) return baskets[i];
    return null;
  }
  function highlightActive() {
    const a = activeBasket();
    baskets.forEach(b => b.hl.setAttribute('opacity', b === a ? 1 : 0));
  }
  function dropInto(b, g) {
    const slotIdx = b.got; b.got++;
    const fg = S('g', { transform: `translate(${-52 + (slotIdx % 5) * 26},${28 + Math.floor(slotIdx / 5) * 24}) scale(0.55)` }, b.fills);
    fruitDef.draw(fg); fxPop(fg);
    g.remove(); sfx.pop();
    highlightActive();
    say(String(b.got), String(b.got));
    checkDone();
  }
  function drawBasket(x, y, slots, label) {
    const g = S('g', { transform: `translate(${x},${y})` }, basketLayer);
    S('path', { d: 'M -78 0 L 78 0 L 60 66 Q 0 80 -60 66 Z', fill: 'url(#gWood)', stroke: '#6B421D', 'stroke-width': 4 }, g);
    S('path', { d: 'M -80 -4 L 80 -4 L 78 10 L -78 10 Z', fill: '#A96F3C', stroke: '#6B421D', 'stroke-width': 3, rx: 4 }, g);
    const slotG = S('g', {}, g);
    for (let i = 0; i < slots; i++) S('circle', { cx: -52 + (i % 5) * 26, cy: 28 + Math.floor(i / 5) * 24, r: 10, fill: 'none', stroke: 'rgba(255,255,255,0.65)', 'stroke-width': 2.6, 'stroke-dasharray': '4 4' }, slotG);
    if (label != null) S('text', { x: 0, y: -16, 'text-anchor': 'middle', 'font-size': 40, 'font-weight': 800, fill: '#5C3A17', 'font-family': 'inherit', text: String(label) }, g);
    const hl = S('circle', { cx: 0, cy: 28, r: 112, fill: 'none', stroke: '#FFD23F', 'stroke-width': 8, 'stroke-dasharray': '18 13', opacity: 0 }, g);
    try { hl.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 9000, iterations: Infinity }); hl.style.transformBox = 'fill-box'; hl.style.transformOrigin = 'center'; } catch (e) {}
    return { g, x, y, got: 0, slots, fills: S('g', {}, g), hl };
  }
  function spawnFruit(x, y) {
    const g = S('g', { transform: `translate(${x},${y})` }, fruitLayer);
    S('circle', { r: PT(42, 58), fill: 'rgba(255,255,255,0.001)' }, g); // fat touch target
    const art = S('g', { transform: PT('', 'scale(1.35)') }, g);
    fruitDef.draw(art);
    fxPop(art);
    const f = { g, home: [x, y], free: true };
    makeDraggable(g, svg, {
      start: () => { if (!roundLive || !f.free) return; sfx.tap(); g.parentNode.appendChild(g); },
      move: p => { if (!roundLive || !f.free) return; g.setAttribute('transform', `translate(${p.x},${p.y}) scale(1.2)`); },
      tap: () => {
        // phone-first: tap a fruit and it flies into the glowing basket by itself
        if (!roundLive || !f.free) return;
        const b = activeBasket();
        if (!b || b.got >= b.slots) return;
        f.free = false; sfx.tap();
        const [hx, hy] = f.home;
        const slotIdx = b.got;
        const tx = b.x + (-52 + (slotIdx % 5) * 26), ty = b.y + (28 + Math.floor(slotIdx / 5) * 24);
        tween(560, k => { const e = easeOut(k); g.setAttribute('transform', `translate(${hx + (tx - hx) * e},${hy + (ty - hy) * e - Math.sin(k * Math.PI) * 170})`); }, () => dropInto(b, g));
      },
      end: p => {
        if (!roundLive || !f.free) return;
        const b = baskets.find(bk => Math.abs(p.x - bk.x) < PT(95, 120) && p.y > bk.y - PT(40, 60) && p.y < bk.y + PT(95, 120));
        if (b && b.got < b.slots) {
          f.free = false;
          dropInto(b, g);
        } else {
          g.animate([{ transform: `translate(${p.x}px,${p.y}px)` }, { transform: `translate(${f.home[0]}px,${f.home[1]}px)` }], { duration: 420, easing: 'cubic-bezier(0.34,1.56,0.64,1)' }).onfinish = () => g.setAttribute('transform', `translate(${f.home[0]},${f.home[1]})`);
          sfx.whoosh();
        }
      }
    });
    fruits.push(f);
  }
  function checkDone() {
    const total = baskets.reduce((s, b) => s + b.got, 0);
    const needTotal = needPer.reduce((s, n) => s + n, 0);
    if (mode === 'share') {
      if (total === needTotal) {
        const per = needTotal / baskets.length;
        if (baskets.every(b => b.got === per)) winRound();
        else { sfx.bad(); Rounds.miss(); fxWobble(momo); say('Partage pareil dans chaque panier !', 'Share the same in every basket!'); }
      }
      return;
    }
    if (baskets.every((b, i) => b.got === needPer[i])) winRound();
    else if (total >= needTotal) { sfx.bad(); Rounds.miss(); say('Regarde bien chaque panier !', 'Look at each basket!'); }
  }
  function winRound() {
    roundLive = false;
    fxSquish(momo);
    say('Miam ! Merci !', 'Yummy! Thank you!');
    if (Rounds.gem()) setTimeout(zoneComplete, 900); else setTimeout(nextRound, 1200);
  }
  function nextRound() {
    basketLayer.innerHTML = ''; fruitLayer.innerHTML = '';
    baskets = []; fruits = []; fruitDef = FRUITS[ri(0, FRUITS.length - 1)];
    const d = D();
    const am = ZoneAct.cur;
    if (am === 'count' || (!am && d <= 1)) { mode = 'count'; needPer = [Math.min(9, ri(2, d === 0 ? 4 : 6) + Rounds.ramp())]; baskets = [drawBasket(PT(750, 425), PT(640, 1250), needPer[0], needPer[0])];
      mission('Donne ' + needPer[0] + ' fruits à Momo !', 'Give Momo ' + needPer[0] + ' fruits!', ZONE_ICONS.orchard);
    } else if (am === 'add' || (!am && d <= 3)) { mode = 'add'; const a = ri(2, 4 + Rounds.ramp(2)), b = ri(2, 4 + Rounds.ramp(2)); needPer = [a, b];
      baskets = [drawBasket(PT(620, 240), PT(640, 1250), a, a), drawBasket(PT(900, 610), PT(640, 1250), b, b)];
      mission(`${a} + ${b} = ? Remplis les paniers : ${a} et ${b} fruits !`, `${a} + ${b} = ? Fill the baskets: ${a} and ${b} fruits!`, ZONE_ICONS.orchard);
    } else if (am === 'mult' || (!am && d <= 5)) { mode = 'mult'; const n = ri(2, 2 + (Rounds.idx >= 2 ? 1 : 0)), k = ri(3, 4 + Rounds.ramp()); needPer = Array(n).fill(k);
      baskets = needPer.map((kk, i) => drawBasket(PT(600 + i * 240, 425 + (i - (needPer.length - 1) / 2) * 250), PT(640, 1250), kk, kk));
      mission(`${n} × ${k} = ? Remplis ${n} paniers de ${k} fruits !`, `${n} × ${k} = ? Fill ${n} baskets of ${k} fruits!`, ZONE_ICONS.orchard);
    } else { mode = 'share'; const n = ri(2, 3), per = ri(3, 4); needPer = Array(n).fill(per);
      baskets = needPer.map((kk, i) => drawBasket(PT(600 + i * 240, 425 + (i - (needPer.length - 1) / 2) * 250), PT(640, 1250), kk, null));
      mission(`${n * per} ÷ ${n} = ? Partage ${n * per} fruits entre les ${n} paniers, pareil partout !`, `${n * per} ÷ ${n} = ? Share ${n * per} fruits equally between the ${n} baskets!`, ZONE_ICONS.orchard);
    }
    const totalFruit = needPer.reduce((s, n) => s + n, 0) + ri(2, 4);
    for (let i = 0; i < totalFruit; i++) spawnFruit(PT(170 + (i % 4) * 100, 180 + (i % 4) * 165) + rnd(-16, 16), PT(370 + Math.floor(i / 4) * 88, 700 + Math.floor(i / 4) * 125) + rnd(-12, 12));
    highlightActive();
    handHint(svg, PT(170, 180), PT(370, 700));
    roundLive = true;
  }
  nextRound();
};

    en: [['SUN'], ['CAT'], ['DOG'], ['MAP'], ['RED'], ['BIG'], ['HOP'], ['BUS'], ['PEN'], ['HAT'], ['BED'], ['CUP'], ['FOX'], ['JAM']]
  };
  let targetSeq = [], seqIdx = 0, pads = [], roundLive = false, driftAnims = [];
  function buildSlots() {
    slotBox.innerHTML = '';

    targetSeq.forEach((syl, i) => {
      const x = (i - (targetSeq.length - 1) / 2) * (w + 14);
      S('rect', { x: x - w / 2, y: -40, width: w, height: 76, rx: 18, fill: i < seqIdx ? '#57CC57' : 'rgba(255,255,255,0.92)', stroke: i === seqIdx ? '#FFD23F' : '#C9D3EE', 'stroke-width': i === seqIdx ? 7 : 4 }, slotBox);
      S('text', { x, y: 14, 'text-anchor': 'middle', 'font-size': 42, 'font-weight': 800, 'font-family': 'inherit', fill: i < seqIdx ? '#fff' : (i === seqIdx ? '#2B2D42' : '#AEB7D0'), text: i <= seqIdx ? syl : '•' }, slotBox);
    });
  }
  function felaLeapTo(x, y, cb) {
    const x0 = felaPos.x, y0 = felaPos.y;
    sfx.boing();
    tween(620, k => {
      const xx = x0 + (x - x0) * k;
      const yy = y0 + (y - y0) * k - Math.sin(k * Math.PI) * 190;
      fela.setAttribute('transform', `translate(${xx},${yy}) scale(1.1) rotate(${Math.sin(k * Math.PI) * (x > x0 ? 14 : -14)})`);
    }, () => { felaPos = { x, y }; splash(x, y + 24); cb && cb(); });
  }
  function splash(x, y) {

      const ring = S('ellipse', { cx: x, cy: y, rx: 8, ry: 3.4, fill: 'none', stroke: 'rgba(255,255,255,0.75)', 'stroke-width': 3.6 }, svg);

    }
  }

    const current = targetSeq[seqIdx];
    const decoys = [];
    const bank = isEN() ? ['SUN', 'CAT', 'MAP', 'DOG', 'HOP', 'BIG', 'RED', 'BUS'] : ['BA', 'MA', 'TO', 'SA', 'LI', 'VE', 'PA', 'LU', 'MO', 'NE', 'RI', 'FU'];
    while (decoys.length < (D() <= 1 ? 2 : 3)) { const c = bank[ri(0, bank.length - 1)]; if (c !== current && !decoys.includes(c)) decoys.push(c); }
    const all = shuffle([current, ...decoys]);
    all.forEach((syl, i) => {
      const x = PT(260 + i * (980 / Math.max(1, all.length - 1)), 425 + ((i % 2) - 0.5) * 330);
      const y = PT(430 + (i % 2) * 150, 640 + Math.floor(i / 2) * 250);
      const g = S('g', { transform: `translate(${x},${y})`, class: 'grab' }, padLayer);
      S('ellipse', { cx: 0, cy: 10, rx: PT(92, 118), ry: PT(34, 44), fill: '#2C6B2A' }, g);
      S('ellipse', { cx: 0, cy: 0, rx: PT(92, 118), ry: PT(34, 44), fill: '#59C14E', stroke: '#2C6B2A', 'stroke-width': 4 }, g);
      S('path', { d: 'M 0 0 L 58 -20 A 60 24 0 0 0 30 -26 Z', fill: '#2C6B2A', opacity: 0.4 }, g);
      S('text', { x: 0, y: PT(12, 16), 'text-anchor': 'middle', 'font-size': PT(40, 52), 'font-weight': 800, 'font-family': 'inherit', fill: colorFor(syl), stroke: '#fff', 'stroke-width': 0.8, text: syl }, g);

      driftAnims.push(anim);
      g.addEventListener('pointerdown', ev => {
        ev.preventDefault();
        if (!roundLive) return;
        const m = new DOMMatrix(getComputedStyle(g).transform);

          roundLive = false;
          felaLeapTo(m.e, m.f - 26, () => {
            seqIdx++;
            say(syl, syl);
            buildSlots();
            if (seqIdx >= targetSeq.length) {
              say(targetSeq.join(''), targetSeq.join(''));
              setTimeout(() => { if (Rounds.gem()) setTimeout(zoneComplete, 800); else nextRound(); }, 900);
            } else { roundLive = true; spawnPads(); }
          });
        } else {
          Rounds.miss(); sfx.bad();
          fxWobble(g);
          const sink = g.animate([{ transform: `translate(${m.e}px,${m.f}px)` }, { transform: `translate(${m.e}px,${m.f + 26}px)` }, { transform: `translate(${m.e}px,${m.f}px)` }], { duration: 700 });
          say('Écoute bien : ' + current, 'Listen: ' + current);
        }
      });
      pads.push(g);
    });
  }
  function nextRound() {
    const list = WORDS[isEN() ? 'en' : 'fr'];
    const d = D();
    let w = pickFresh('river_' + (isEN() ? 'en' : 'fr'), list, x => x.join('-'));
    if (!isEN() && d === 0) w = [w[0]];
    targetSeq = w; seqIdx = 0;
    buildSlots();
    felaPos = { x: PT(750, 425), y: PT(700, 1330) };
    fela.setAttribute('transform', `translate(${felaPos.x},${felaPos.y}) scale(1.1)`);
    mission('Saute sur « ' + targetSeq[0] + ' » avec Fela !', 'Leap on "' + targetSeq[0] + '" with Fela!', ZONE_ICONS.river);
    roundLive = true;
    spawnPads();
  }
  nextRound();
};

      S('path', { d: 'M 10 -6 Q 18 10 10 26', stroke: p[2], 'stroke-width': 9, fill: 'none', 'stroke-linecap': 'round' }, g);

  }
  const zebraParts = () => {
    artG.innerHTML = '';
    const parts = [];
    const mk = (d, name, fr, en) => { const p = S('path', { d, fill: '#FFFFFF', stroke: '#2B2D42', 'stroke-width': 5, class: 'grab' }, artG); p.dataset.fr = fr; p.dataset.en = en; parts.push({ el: p, name }); return p; };
    mk('M -40 -150 Q 120 -210 180 -90 Q 220 -10 140 30 L -60 30 Q -140 10 -120 -80 Q -105 -140 -40 -150 Z', 'body', 'le corps', 'the body');
    mk('M -120 -80 Q -220 -120 -230 -40 Q -232 10 -170 6 L -80 -10 Z', 'head', 'la tête', 'the head');
    mk('M -228 -96 L -205 -140 L -180 -98 Z', 'ear', "l'oreille", 'the ear');
    [[-50], [40], [100], [160]].forEach(([x], i) => mk(`M ${x} 26 L ${x + 26} 26 L ${x + 22} 150 L ${x + 2} 150 Z`, 'leg' + i, 'la patte', 'the leg'));
    mk('M 178 -70 Q 240 -60 246 10 L 226 16 Q 214 -36 170 -40 Z', 'tail', 'la queue', 'the tail');
    const eye = S('circle', { cx: -196, cy: -74, r: 7, fill: '#2B2D42' }, artG);
    return parts;
  };
  const shapeMural = () => {
    artG.innerHTML = '';
    const parts = [];
    const kinds = [
      { n: 'triangle', fr: 'les triangles', en: 'the triangles', mk: (x, y, s2) => S('path', { d: `M ${x} ${y - s2} L ${x + s2} ${y + s2} L ${x - s2} ${y + s2} Z`, fill: '#fff', stroke: '#2B2D42', 'stroke-width': 5 }, artG) },
      { n: 'cercle', fr: 'les cercles', en: 'the circles', mk: (x, y, s2) => S('circle', { cx: x, cy: y, r: s2, fill: '#fff', stroke: '#2B2D42', 'stroke-width': 5 }, artG) },
      { n: 'carré', fr: 'les carrés', en: 'the squares', mk: (x, y, s2) => S('rect', { x: x - s2, y: y - s2, width: s2 * 2, height: s2 * 2, rx: 6, fill: '#fff', stroke: '#2B2D42', 'stroke-width': 5 }, artG) }
    ];
    for (let i = 0; i < 9; i++) {
      const kind = kinds[i % 3];
      const el = kind.mk(-220 + (i % 3) * 220 + rnd(-30, 30), -170 + Math.floor(i / 3) * 170 + rnd(-16, 16), rnd(36, 52));

  };
  const fractionFence = () => {
    artG.innerHTML = '';
    const parts = [];
    const N = [3, 4, 5, 6][ri(0, 3)];
    const w = 560 / N;
    S('rect', { x: -290, y: -60, width: 580, height: 20, rx: 8, fill: '#B07B4C' }, artG);
    S('rect', { x: -290, y: 100, width: 580, height: 20, rx: 8, fill: '#B07B4C' }, artG);
    for (let i = 0; i < N; i++) {
      const x0 = -280 + i * w + 4, x1 = -280 + (i + 1) * w - 4;
      const el = S('path', { d: `M ${x0} 190 L ${x0} -130 L ${(x0 + x1) / 2} -175 L ${x1} -130 L ${x1} 190 Z`, fill: '#FFFFFF', stroke: '#2B2D42', 'stroke-width': 5, class: 'grab' }, artG);
      parts.push({ el, name: 'plank' });
    }
    return parts;
  };
  let parts = [];
  function wirePainting(done) {
    parts.forEach(p => {
      p.el.addEventListener('pointerdown', () => {
        if (!roundLive || !selected) { if (!selected) say('Choisis une couleur !', 'Pick a color first!'); return; }
        const task = tasks[taskIdx];
        const okPart = task.match(p);
        if (okPart && selected[2] === task.color[2]) {
          p.el.setAttribute('fill', selected[2]);
          fxSquish(p.el);
          sfx.pop();
          task.left--;
          if (task.onPaint) task.onPaint(task);
          if (task.left <= 0) { taskIdx++; if (taskIdx >= tasks.length) done(); else announceTask(); }
        } else {
          Rounds.miss(); sfx.bad();
          fxWobble(p.el);
          announceTask();
        }
      });
    });
  }
  function announceTask() {
    const t = tasks[taskIdx];
    mission(t.fr, t.en, g => { S('circle', { cx: 0, cy: 0, r: 22, fill: t.color[2], stroke: '#fff', 'stroke-width': 5 }, g); });
    if (D() <= 1) {
      // toddlers: the right pot picks itself and bounces — they only paint
      selected = t.color;
      const pi2 = POTS.indexOf(t.color);
      potEls.forEach(pe => pe.setAttribute('transform', pe.dataset.base));
      if (potEls[pi2]) { const bpos = potEls[pi2].dataset.base; potEls[pi2].setAttribute('transform', bpos + ' scale(1.3)'); fxPop(potEls[pi2]); }
    }
  }
  function nextRound() {

    buildPots();

    } else if (am === 'fraction' || (!am && d >= 5)) {
      // CM1/CM2: paint an exact FRACTION of the fence (visual fractions)
      parts = fractionFence();
      const N = parts.length, k = ri(1, N - 1);
      const c = POTS[ri(0, POTS.length - 1)];
      const lab = S('text', { x: 0, y: 312, 'text-anchor': 'middle', 'font-size': 46, 'font-weight': 800, fill: '#9B5DE5', 'font-family': 'inherit', text: '0/' + N }, easelG);
      tasks = [{ color: c, left: k,
        match: q => q.name === 'plank' && String(q.el.getAttribute('fill')).toUpperCase() === '#FFFFFF',
        fr: 'Fraction magique : peins ' + k + '/' + N + ' de la barrière en ' + c[0] + ' !',
        en: 'Magic fraction: paint ' + k + '/' + N + ' of the fence ' + c[1] + '!',
        onPaint: t => { lab.textContent = (k - t.left) + '/' + N; mlPulse(lab, 1); say((k - t.left) + ' sur ' + N + (t.left <= 0 ? ' : exactement ' + k + '/' + N + ' !' : ''), (k - t.left) + ' out of ' + N + (t.left <= 0 ? ': exactly ' + k + '/' + N + '!' : '')); } }];
    } else {
      parts = shapeMural();
      const kind = ['triangle', 'cercle', 'carré'][ri(0, 2)];
      const c = POTS[ri(0, POTS.length - 1)];
      const count = parts.filter(p => p.name === kind).length;
      tasks = [{ color: c, left: count, match: q => q.name === kind, fr: 'Peins tous les ' + kind + 's en ' + c[0] + ' !', en: 'Paint all the ' + ({ triangle: 'triangles', cercle: 'circles', 'carré': 'squares' })[kind] + ' ' + c[1] + '!' }];
    }
    taskIdx = 0;
    wirePainting(() => {
      roundLive = false;
      say('Magnifique !', 'Beautiful!');
      if (Rounds.gem()) setTimeout(zoneComplete, 900); else setTimeout(nextRound, 1100);
    });
    announceTask();
    handHint(svg, PT(750, 425), PT(420, 660));
    roundLive = true;
  }
  nextRound();
};

    { fr: 'le ballon', en: 'the ball', floats: true, dens: '0,1', draw: g => { S('circle', { cx: 0, cy: 0, r: 20, fill: '#FF4D57', stroke: '#C42631', 'stroke-width': 3 }, g); S('path', { d: 'M -20 0 Q 0 -12 20 0 M -20 0 Q 0 12 20 0', stroke: '#fff', 'stroke-width': 3.4, fill: 'none' }, g); } },
    { fr: 'la cuillère', en: 'the spoon', floats: false, dens: '7,9', draw: g => { S('ellipse', { cx: -16, cy: 0, rx: 10, ry: 14, fill: '#C0C7D8', stroke: '#8D99AE', 'stroke-width': 3 }, g); S('rect', { x: -6, y: -4, width: 34, height: 8, rx: 4, fill: '#C0C7D8', stroke: '#8D99AE', 'stroke-width': 2.4 }, g); } },
    { fr: 'la mangue', en: 'the mango', floats: true, dens: '0,95', draw: g => { S('ellipse', { cx: 0, cy: 0, rx: 22, ry: 16, fill: '#FF9F1C', stroke: '#D97800', 'stroke-width': 3 }, g); S('path', { d: 'M 8 -12 Q 16 -22 24 -16', stroke: '#3FA34D', 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, g); } },
    { fr: "l'ancre", en: 'the anchor', floats: false, dens: '7,8', draw: g => { S('path', { d: 'M 0 -20 L 0 16 M -16 6 Q 0 26 16 6 M 0 -20 m -6 0 a 6 6 0 1 0 12 0 a 6 6 0 1 0 -12 0', stroke: '#2B2D42', 'stroke-width': 6, fill: 'none', 'stroke-linecap': 'round' }, g); } }

      { transform: `translate(${x}px,${WATER_Y + 5}px) rotate(5deg)` },
      { transform: `translate(${x}px,${WATER_Y - 4}px) rotate(-5deg)` }
    ], { duration: 2000, iterations: Infinity });
  }
  const btnLayer = S('g', {}, svg);
  function bigBtn(x, y, fr2, en2, col, cb) {
    const g = S('g', { transform: `translate(${x},${y})`, class: 'grab' }, btnLayer);
    S('rect', { x: -128, y: -52, width: 256, height: 104, rx: 30, fill: '#fff', stroke: col, 'stroke-width': 8 }, g);

  const BX1 = PT(540, 228), BX2 = PT(960, 622), BY = PT(315, 500);

        for (let b = 0; b < 5; b++) { const bb = S('circle', { cx: x + rnd(-14, 14), cy: WATER_Y + 40 + b * 40, r: rnd(3, 7), fill: 'rgba(255,255,255,0.7)' }, svg); bb.animate([{ opacity: 0.8, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-70px)' }], { duration: 900, delay: b * 120 }).onfinish = () => bb.remove(); }

    } else {
      tries++;
      Rounds.miss(); sfx.bad();
      if (tries >= 2) {
        btnLayer.innerHTML = '';
        say('Regarde : ' + it.o.fr + (it.o.floats ? ' reste SUR l’eau : il flotte !' : ' est tombé AU FOND : il coule !'), 'Look: ' + it.o.en + (it.o.floats ? ' stays ON the water: it floats!' : ' sank to the BOTTOM: it sinks!'), 0.8);

      } else say('Regarde bien l’eau... est-il resté en haut ou tombé au fond ?', 'Look at the water... did it stay on top or fall to the bottom?', 0.8);
    }
  }
  function askAnswer(it) {
    phase = 'answer'; tries = 0;
    const flip = Math.random() < 0.5;
    bigBtn(flip ? BX2 : BX1, BY, 'FLOTTE !', 'FLOATS!', '#1C7ED6', () => { if (phase === 'answer') judge(true, it); });

    g.addEventListener('pointerdown', () => {

      it.used = true;
      say(it.o.fr, it.o.en);

  });

  sayPick();

/* ================= Z7 — SAFARI BALLON (Africa geography) ================= */

  const map = S('g', { transform: `translate(${ox},${oy}) scale(${K})` }, svg);

  const REGION_HUE = { 'North Africa': '#F5C96B', 'West Africa': '#8ED081', 'Central Africa': '#69B578', 'East Africa': '#F28F6B', 'Southern Africa': '#F2A6C4', 'Central/Southern Africa': '#7FC9C0' };
  const els = {};

  DATA.forEach(c => {
    const p = S('path', { d: c.path, fill: REGION_HUE[c.region] || '#B3A6E0', stroke: '#fff', 'stroke-width': 0.38, 'stroke-linejoin': 'round', class: 'grab', style: 'transition:filter 0.2s;' }, map);
    els[c.id] = p;
    p.addEventListener('pointerenter', () => { if (!found.includes(c.id)) p.style.filter = 'brightness(1.16)'; });
    p.addEventListener('pointerleave', () => { if (!found.includes(c.id)) p.style.filter = ''; });
  });
  // balloon with Leo
  const balloon = S('g', { transform: PT('translate(170,190)', 'translate(170,260)') }, svg);
  const balloonInner = S('g', {}, balloon);
  S('path', { d: 'M 0 -96 A 62 70 0 1 1 -0.1 -96 Z', fill: '#FF4D57', stroke: '#C42631', 'stroke-width': 5 }, balloonInner);
  S('path', { d: 'M 0 -96 A 62 70 0 0 1 0 36 A 24 70 0 0 0 0 -96 Z', fill: '#FFD23F', opacity: 0.9 }, balloonInner);
  S('path', { d: 'M -34 20 L -16 62 M 34 20 L 16 62', stroke: '#8A5A33', 'stroke-width': 4 }, balloonInner);
  S('path', { d: 'M -18 60 L 18 60 L 12 92 L -12 92 Z', fill: 'url(#gWood)', stroke: '#6B421D', 'stroke-width': 4 }, balloonInner);
  drawLeo(balloonInner, 0, 44, 0.42);
  fxBob(balloonInner, 13, 3000);
  let balloonPos = { x: 170, y: PT(190, 260) };
  // clue card: the country's REAL shape + name (or only its capital for the big kids)
  const clueCard = S('g', { transform: PT('translate(170,600)', 'translate(425,1330)') }, svg);
  const EASY = ['ma', 'eg', 'ng', 'cm', 'za', 'cd', 'ke', 'sn', 'dz', 'mg'];
  const MID = EASY.concat(['tz', 'gh', 'ci', 'ml', 'ne', 'td', 'sd', 'et', 'ug', 'zm', 'zw', 'ao', 'mz', 'ly', 'tn', 'bf']);
  const capMode = () => ZoneAct.cur ? ZoneAct.cur === 'capitals' : D() >= 4;
  function pool() { const d = D(); const ids = (capMode() && d >= 2) || d > 3 ? DATA.map(c => c.id) : (d <= 1 ? EASY : MID); return DATA.filter(c => ids.includes(c.id) && !found.includes(c.id)); }
  function showClue() {
    clueCard.innerHTML = '';
    const d = D();
    S('rect', { x: -108, y: -92, width: 216, height: 196, rx: 22, fill: '#fff', stroke: '#FFD23F', 'stroke-width': 6 }, clueCard);
    if (!capMode() || d <= 4) {
      let bb; try { bb = els[target.id].getBBox(); } catch (e) { bb = { x: 0, y: 0, width: 20, height: 20 }; }
      const sc = Math.min(112 / Math.max(1, bb.width), 112 / Math.max(1, bb.height));
      const mini = S('g', { transform: `translate(0,-30) scale(${sc}) translate(${-(bb.x + bb.width / 2)},${-(bb.y + bb.height / 2)})` }, clueCard);
      S('path', { d: target.path, fill: '#5E60CE', stroke: '#2B2D42', 'stroke-width': Math.min(1.4, 0.8 / sc) }, mini);
    } else {

    }
    const lbl = capMode() ? T('Capitale : ' + target.cap, 'Capital: ' + target.cap) : T(target.fr, target.en);
    S('text', { x: 0, y: 52, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 800, fill: '#2B2D42', 'font-family': 'inherit', text: d < 1 ? '' : lbl }, clueCard);
    if (d >= 2 && d <= 3) S('text', { x: 0, y: 82, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, fill: '#8A93AD', 'font-family': 'inherit', text: T('Région : ', 'Region: ') + target.region }, clueCard);
    else if (capMode()) S('text', { x: 0, y: 82, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, fill: '#8A93AD', 'font-family': 'inherit', text: T('Quel pays ?', 'Which country?') }, clueCard);
    fxPop(clueCard);

      balloon.setAttribute('transform', `translate(${x0 + (x - x0) * e},${y0 + (y - y0) * e - Math.sin(k * Math.PI) * 60}) rotate(${Math.sin(k * Math.PI * 2) * 4})`);
    }, () => { balloonPos = { x, y }; cb && cb(); });
  }

            'This is ' + hit.en + ', in ' + hit.region + '! Look for ' + (capMode() ? 'the country of ' + target.cap : target.en) + '!');
        if (tries >= 3) hintTarget();
        roundLive = true;
      }
    });
  });
  function nextRound() {
    tries = 0;
    const po = pool();
    target = po[ri(0, po.length - 1)] || DATA[ri(0, DATA.length - 1)];
    showClue();
    const d = D();

    else mission('Vole avec Léo vers ' + target.fr + ' ! Regarde sa forme !', 'Fly with Leo to ' + target.en + '! Look at its shape!', ZONE_ICONS.safari);
    roundLive = true;
  }
  nextRound();
};

    if (part.t === 'c') return S('circle', Object.assign({ cx: part.x, cy: part.y, r: part.r }, common), parent);
    return S('path', Object.assign({ d: 'M ' + part.pts.map(p => p.join(' ')).join(' L ') + ' Z' }, common), parent);
  }
  const center = p => p.t === 'r' ? [p.x + p.w / 2, p.y + p.h / 2] : (p.t === 'c' ? [p.x, p.y] : [(p.pts[0][0] + p.pts[1][0] + p.pts[2][0]) / 3, (p.pts[0][1] + p.pts[1][1] + p.pts[2][1]) / 3]);

            sfx.whoosh();

  }

    roundLive = true;
  }
  nextRound();
};

      S('rect', { x: x - w / 2, y: -46, width: w, height: 92, rx: 16, fill: 'rgba(0,0,0,0)', 'data-slot': i, class: 'word-slot' }, slotG);
    });

  function spawnTiles() {

    const decoyCount = (d <= 1 ? 0 : (d <= 3 ? 1 : 3)) + Rounds.ramp();

        end: p => {

          const rel = { x: p.x - SLX, y: p.y - SLY };

ZONE_BUILDERS.academy = function (host) {
  const d = D();
  const wrap = H('div', { class: 'quiz-wrap' }, host);
  const topics = QUIZ_TOPICS.filter(t => d >= t.lo && d <= t.hi);
  const gradeName = GRADES[save.grade] ? T(GRADES[save.grade].fr, GRADES[save.grade].en) : '';
  const pending = Academy.pending; Academy.pending = null;

  function picker(filter) {
    wrap.innerHTML = '';
    const p = H('div', { class: 'qz-panel' }, wrap);
    H('div', { class: 'qz-title', text: T('🎓 Académie des Champions', '🎓 Champions Academy') }, p);
    H('div', { class: 'qz-sub', text: T('Classe ' + gradeName + ' — choisis ou tape un sujet, gagne ton quiz !', 'Class ' + gradeName + ' — pick or type a topic, win your quiz!') }, p);
    const cur = CURRICULUM[save.grade] || CURRICULUM[0];
    const cb = H('div', { class: 'qz-cur' }, p);
    cb.innerHTML = '<b>' + T('Programme de ta classe :', 'Your class program:') + '</b><br>' +
      '🔢 ' + T(cur.m[0], cur.m[1]) + '<br>📖 ' + T(cur.l[0], cur.l[1]) + '<br>🔬 ' + T(cur.s[0], cur.s[1]) + '<br>🌍 ' + T(cur.g[0], cur.g[1]);
    const exRow = H('div', { class: 'qz-btnrow' }, p);
    const exBtn = H('button', { class: 'qz-next on', text: '\uD83D\uDCDD ' + T('EXAMEN BLANC \u2014 10 questions', 'MOCK EXAM \u2014 10 questions') }, exRow);
    exBtn.style.background = 'linear-gradient(145deg,#5E60CE,#4EA8DE)';
    exBtn.addEventListener('click', () => { sfx.boing(); playExam(); });
    const best0 = (save.examBest || {})[save.grade];
    const log0 = ((save.examLog || {})[save.grade] || []);
    if (log0.length) {
      const hist = H('div', { class: 'qz-cur' }, p);
      const lvl = best0 >= 9 ? T('🏆 Expert', '🏆 Expert') : best0 >= 7 ? T('🌟 Avancé', '🌟 Advanced') : best0 >= 5 ? T('👍 En progrès', '👍 Improving') : T('💪 Débutant courageux', '💪 Brave beginner');
      hist.innerHTML = '<b>' + T('Ton niveau en ' + gradeName + ' : ', 'Your level in ' + gradeName + ': ') + lvl + '</b> — ' + T('meilleur score ', 'best score ') + best0 + '/10<br>' +
        T('Tes essais : ', 'Your tries: ') + log0.slice(-6).map(s2 => s2 + '/10').join(' \u2192 ') + (log0.length >= 2 && log0[log0.length - 1] > log0[log0.length - 2] ? ' \uD83D\uDCC8' : '');
    } else if (best0 != null) H('div', { class: 'qz-sub', text: '\uD83C\uDFC6 ' + T('Meilleur score ', 'Best score ') + gradeName + ' : ' + best0 + ' / 10' }, p);
    H('div', { class: 'qz-sub', text: T('\u2014 ENTRAÎNEMENT : prépare l\u2019examen sujet par sujet, avec les astuces \u2014', '\u2014 TRAINING: prep the exam topic by topic, with the tricks \u2014') }, p);
    const inp = H('input', { class: 'qz-search', type: 'text', autocomplete: 'off', spellcheck: 'false' }, p);
    inp.placeholder = T('Recherche un sujet : fractions, conjugaison, capitales…', 'Search a topic: fractions, conjugation, capitals…');
    const chips = H('div', { class: 'qz-chips' }, p);
    function renderChips(q) {
      q = (q || '').trim().toLowerCase();
      chips.innerHTML = '';
      const hits = topics.filter(t => !q || t.kw.some(k => k.includes(q) || q.includes(k)) || T(t.f, t.e).toLowerCase().includes(q));
      (hits.length ? hits : topics).forEach(t => {
        const b = H('button', { class: 'qz-chip' }, chips);
        b.innerHTML = '<span class="dot" style="background:' + SUBJ[t.sub].c + '"></span>' + T(t.f, t.e);
        b.addEventListener('click', () => { sfx.boing(); playTopic(t); });
      });
    }
    inp.addEventListener('input', ev => renderChips(ev.target.value));
    renderChips(filter || '');
    if (filter) inp.value = filter;
    mission('Bienvenue à l’Académie ! Choisis un sujet de ta classe et gagne ton quiz !', 'Welcome to the Academy! Pick a topic from your class and win your quiz!', ZONE_ICONS.academy);
  }

  function playTopic(t) {
    const QN = 5;
    const records = [];
    let qi = 0;
    say(T(t.f, t.e) + ' ! ' + T('Cinq questions, à toi de jouer !', 'Five questions, your turn!'));
    function ask() {
      wrap.innerHTML = '';
      const q = freshQ(t.id, d, t.gen);
      const p = H('div', { class: 'qz-panel' }, wrap);
      H('div', { class: 'qz-prog', text: T('Question ', 'Question ') + (qi + 1) + ' / ' + QN + ' — ' + T(t.f, t.e) }, p);
      H('div', { class: 'qz-q', text: T(q.qf, q.qe) }, p);
      if (q.dots) H('div', { class: 'qz-dots', text: q.dots }, p);
      const grid = H('div', { class: 'qz-answers' }, p);
      const steps = H('div', { class: 'qz-steps' }, p);
      steps.innerHTML = '<h4>💡 ' + T('Astuce pas à pas', 'Step-by-step trick') + '</h4><ol>' + (isEN() ? q.se : q.sf).map(s => '<li>' + s + '</li>').join('') + '</ol>';
      const row = H('div', { class: 'qz-btnrow' }, p);
      const hintBtn = H('button', { class: 'qz-hintbtn', text: '💡 ' + T('Voir l’astuce', 'Show the trick') }, row);
      const next = H('button', { class: 'qz-next', text: qi + 1 < QN ? T('Question suivante ➡', 'Next question ➡') : T('Voir ma fiche de réponses 📄', 'See my answer sheet 📄') }, row);
      hintBtn.addEventListener('click', () => { steps.classList.toggle('on'); sfx.tap(); say((isEN() ? q.se : q.sf).join(' '), null, d <= 2 ? 0.8 : 0.92); });
      let answered = false;
      const btns = [];
      q.ch.forEach(([cf, ce], i) => {
        const b = H('button', { class: 'qz-a', text: T(cf, ce) }, grid);
        btns.push(b);
        b.addEventListener('click', () => {
          if (answered) return; answered = true;
          btns.forEach(x => x.disabled = true);
          const ok = i === q.ci;
          b.classList.add(ok ? 'good' : 'bad');
          btns[q.ci].classList.add('good');
          records.push({ q, pick: i, ok });
          if (ok) { Rounds.gem(); say(['Bravo !', 'Exact !', 'Champion !'][ri(0, 2)], ['Great!', 'Correct!', 'Champion!'][ri(0, 2)]); }
          else { Rounds.miss(); sfx.bad(); steps.classList.add('on'); say('Pas grave ! Regarde l’astuce pas à pas !', 'No worries! Look at the step-by-step trick!'); }
          next.classList.add('on');
        });
      });
      if (d <= 2) say(q.qf, q.qe, 0.84);
      next.addEventListener('click', () => {
        qi++;
        if (qi < QN) ask(); else sheet();
      });
    }
    function sheet() {
      wrap.innerHTML = '';
      const p = H('div', { class: 'qz-panel' }, wrap);
      const score = records.filter(r => r.ok).length;
      H('div', { class: 'qz-title', text: '📄 ' + T('Fiche de réponses', 'Answer sheet') + ' — ' + T(t.f, t.e) }, p);
      H('div', { class: 'qz-score', text: T('Score : ', 'Score: ') + score + ' / ' + records.length + (score === records.length ? ' 🏆' : '') }, p);
      records.forEach((r, i) => {
        const row = H('div', { class: 'qz-sheet-row ' + (r.ok ? 'ok' : 'ko') }, p);
        const yours = T(r.q.ch[r.pick][0], r.q.ch[r.pick][1]);
        const good = T(r.q.ch[r.q.ci][0], r.q.ch[r.q.ci][1]);
        row.innerHTML = '<div>' + (r.ok ? '✅' : '❌') + ' <b>Q' + (i + 1) + '.</b> ' + T(r.q.qf, r.q.qe) + '</div>' +
          '<div>' + T('Ta réponse : ', 'Your answer: ') + '<b>' + yours + '</b>' + (r.ok ? '' : ' — ' + T('Bonne réponse : ', 'Correct answer: ') + '<b>' + good + '</b>') + '</div>' +
          '<details' + (r.ok ? '' : ' open') + '><summary>💡 ' + T('Astuce pas à pas', 'Step-by-step trick') + '</summary><ol>' + (isEN() ? r.q.se : r.q.sf).map(s => '<li>' + s + '</li>').join('') + '</ol></details>';
      });
      const row = H('div', { class: 'qz-btnrow' }, p);
      const again = H('button', { class: 'qz-next on', text: '🔁 ' + T('Autre sujet', 'Another topic') }, row);
      const fin = H('button', { class: 'qz-next on', text: '🏁 ' + T('Terminer', 'Finish') }, row);
      again.style.marginRight = '10px';
      again.addEventListener('click', () => { Rounds.start('academy', 5); picker(); });
      fin.addEventListener('click', () => zoneComplete());
      say(T('Ta fiche de réponses ! Tu as ', 'Your answer sheet! You got ') + score + T(' bonnes réponses sur ', ' right out of ') + records.length + ' !');
    }
    ask();
  }

  function playExam() {
    const QN = 10;
    Rounds.start('academy', QN);
    const order = ['m', 'l', 's', 'g', 'm', 'l', 's', 'g', 'm', 'l'];
    const records = [];
    let qi = 0;
    const usedT = {};
    function ask() {
      wrap.innerHTML = '';
      let pool2 = topics.filter(t2 => t2.sub === order[qi % order.length]);
      if (!pool2.length) pool2 = topics;
      const minUse = Math.min(...pool2.map(t2 => usedT[t2.id] || 0));
      pool2 = pool2.filter(t2 => (usedT[t2.id] || 0) === minUse);
      const t = pool2[ri(0, pool2.length - 1)];
      usedT[t.id] = (usedT[t.id] || 0) + 1;
      const q = freshQ(t.id, d, t.gen);
      const p = H('div', { class: 'qz-panel' }, wrap);
      H('div', { class: 'qz-prog', text: '📝 ' + T('Examen ', 'Exam ') + gradeName + ' — ' + (qi + 1) + ' / ' + QN }, p);
      H('div', { class: 'qz-q', text: T(q.qf, q.qe) }, p);
      if (q.dots) H('div', { class: 'qz-dots', text: q.dots }, p);
      const grid = H('div', { class: 'qz-answers' }, p);
      const row = H('div', { class: 'qz-btnrow' }, p);
      const next = H('button', { class: 'qz-next', text: qi + 1 < QN ? T('Question suivante ➡', 'Next question ➡') : '🏁 ' + T('Voir mes résultats', 'See my results') }, row);
      let answered = false;
      const btns = [];
      q.ch.forEach(([cf, ce], i) => {
        const b = H('button', { class: 'qz-a', text: T(cf, ce) }, grid);
        btns.push(b);
        b.addEventListener('click', () => {
          if (answered) return; answered = true;
          btns.forEach(x => x.disabled = true);
          const ok = i === q.ci;
          b.classList.add(ok ? 'good' : 'bad');
          btns[q.ci].classList.add('good');
          records.push({ q, pick: i, ok });
          if (ok) Rounds.gem(); else { Rounds.miss(); sfx.bad(); }
          next.classList.add('on');
        });
      });
      if (d <= 2) say(q.qf, q.qe, 0.84);
      next.addEventListener('click', () => { sfx.tap(); qi++; if (qi < QN) ask(); else results(); });
    }
    function results() {
      const score = records.filter(r => r.ok).length;
      save.examBest = save.examBest || {};
      const isRecord = score > (save.examBest[save.grade] || -1);
      if (isRecord) save.examBest[save.grade] = score;
      save.examLog = save.examLog || {};
      const log2 = save.examLog[save.grade] = (save.examLog[save.grade] || []);
      log2.push(score);
      if (log2.length > 10) log2.shift();
      persist();
      wrap.innerHTML = '';
      const p = H('div', { class: 'qz-panel' }, wrap);
      const mention = score >= 9 ? ['🏆 EXCELLENT !', '🏆 EXCELLENT!'] : score >= 7 ? ['🌟 TRÈS BIEN !', '🌟 VERY GOOD!'] : score >= 5 ? ['👍 BIEN — continue !', '👍 GOOD — keep going!'] : ['💪 Entraîne-toi et reviens !', '💪 Practise and come back!'];
      H('div', { class: 'qz-title', text: '📝 ' + T('Résultats — Examen ', 'Results — Exam ') + gradeName }, p);
      H('div', { class: 'qz-score', text: T('Essai n°' + log2.length + ' : ', 'Try #' + log2.length + ': ') + score + ' / 10 — ' + T(mention[0], mention[1]) + (isRecord && score > 0 ? ' \uD83C\uDD95 ' + T('RECORD !', 'RECORD!') : '') }, p);
      if (log2.length >= 2) {
        const tr = H('div', { class: 'qz-sub' }, p);
        const up = score > log2[log2.length - 2];
        tr.textContent = T('Ta progression : ', 'Your progress: ') + log2.slice(-6).map(s4 => s4 + '/10').join(' \u2192 ') + (up ? ' \uD83D\uDCC8 ' + T('Tu montes !', 'Going up!') : '');
      }
      records.forEach((r, i2) => {
        const row2 = H('div', { class: 'qz-sheet-row ' + (r.ok ? 'ok' : 'ko') }, p);
        const yours = T(r.q.ch[r.pick][0], r.q.ch[r.pick][1]);
        const good = T(r.q.ch[r.q.ci][0], r.q.ch[r.q.ci][1]);
        row2.innerHTML = '<div>' + (r.ok ? '✅' : '❌') + ' <b>Q' + (i2 + 1) + '.</b> ' + T(r.q.qf, r.q.qe) + '</div>' +
          '<div>' + T('Ta réponse : ', 'Your answer: ') + '<b>' + yours + '</b>' + (r.ok ? '' : ' — ' + T('Bonne réponse : ', 'Correct answer: ') + '<b>' + good + '</b>') + '</div>' +
          '<details' + (r.ok ? '' : ' open') + '><summary>💡 ' + T('Astuce pas à pas', 'Step-by-step trick') + '</summary><ol>' + (isEN() ? r.q.se : r.q.sf).map(s3 => '<li>' + s3 + '</li>').join('') + '</ol></details>';
      });
      const row3 = H('div', { class: 'qz-btnrow' }, p);
      const again = H('button', { class: 'qz-next on', text: '🔁 ' + T('Repasser l’examen', 'Retake the exam') }, row3);
      const fin = H('button', { class: 'qz-next on', text: '🏁 ' + T('Terminer', 'Finish') }, row3);
      again.style.marginRight = '10px';
      again.addEventListener('click', () => playExam());
      fin.addEventListener('click', () => zoneComplete());
      if (score >= 9) { confetti(80); sfx.fanfare(); }
      say(T('Ton score : ', 'Your score: ') + score + T(' sur dix ! ', ' out of ten! '));
    }
    say('Examen blanc, classe ' + gradeName + ' ! Dix questions, pas d\u2019astuce pendant l\u2019examen. Tu peux le repasser autant de fois que tu veux pour voir ton niveau monter. Concentre-toi... c\u2019est parti !', 'Mock exam, class ' + gradeName + '! Ten questions, no hints during the exam. Retake it as often as you like and watch your level climb. Focus... here we go!');
    ask();
  }
  Academy._exam = playExam;
  pending ? playTopic(pending) : picker();
};


/* ================= Z14 — LABO DES MATHS (lessons that MOVE: highlight, underline, motion) ================= */
function mlFly(el, x0, y0, x1, y1, dur = 700) {
  el.setAttribute('transform', `translate(${x1},${y1})`);
  try { el.animate([{ transform: `translate(${x0}px,${y0}px)` }, { transform: `translate(${x1}px,${y1}px)` }], { duration: dur, easing: 'cubic-bezier(0.3,1.2,0.5,1)' }); } catch (e) {}
}
function mlPulse(el, n = 3) { try { el.animate([{ opacity: 1 }, { opacity: 0.22 }, { opacity: 1 }], { duration: 480, iterations: n }); } catch (e) {} }
function mlTxt(sv, x, y, txt, size = 44, fill = '#2B2D42') { return S('text', { x, y, 'text-anchor': 'middle', 'font-size': size, 'font-weight': 800, 'font-family': 'inherit', fill, text: txt }, sv); }
function mlUnder(sv, x, y, w, color = '#FF4D57') {
  const r = S('rect', { x: x - w / 2, y, width: w, height: 8, rx: 4, fill: color }, sv);
  r.style.transformBox = 'fill-box'; r.style.transformOrigin = 'left';
  try { r.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 550, easing: 'ease-out' }); } catch (e) {}
  return r;
}
function mlHalo(sv, x, y, rx, ry) {
  const e = S('ellipse', { cx: x, cy: y, rx, ry: ry == null ? rx : ry, fill: 'none', stroke: '#FFD23F', 'stroke-width': 7 }, sv);
  mlPulse(e, 4); return e;
}
function mlBall(sv, color = '#FF9F1C', r = 20) {
  const g = S('g', {}, sv);
  S('circle', { r, fill: color, stroke: 'rgba(0,0,0,0.18)', 'stroke-width': 2.5 }, g);
  S('circle', { cx: -r * 0.3, cy: -r * 0.35, r: r * 0.28, fill: 'rgba(255,255,255,0.55)' }, g);
  return g;
}
const ML_LESSONS = [
  { id: 'ml1', f: 'Compter : un par un', e: 'Counting: one by one', lo: 0, hi: 1, make(sv) {

    const steps = [{ f: 'Voici un panier vide. On va compter des mangues, une par une !', e: 'Here is an empty basket. We will count mangoes, one by one!', run() { mlHalo(sv, 450, 350, 200, 80); } }];
    const WORDS_F = ['UN !', 'DEUX !', 'TROIS !', 'QUATRE !', 'CINQ !'], WORDS_E = ['ONE!', 'TWO!', 'THREE!', 'FOUR!', 'FIVE!'];
    for (let i = 1; i <= 5; i++) steps.push({ f: WORDS_F[i - 1] + ' Une mangue tombe dans le panier.', e: WORDS_E[i - 1] + ' A mango drops into the basket.', run() {
      const b = mlBall(sv, '#FF9F1C', 26); mlFly(b, 450, -40, 320 + (i - 1) * 65, 340, 650);
      numEl.textContent = i; mlPulse(numEl, 2);

    steps.push({ f: 'Le DERNIER nombre dit la quantité : il y a 5 mangues !', e: 'The LAST number tells how many: there are 5 mangoes!', run() { mlUnder(sv, 450, 140, 110, '#F77F00'); mlHalo(sv, 450, 350, 210, 85); } });
    return steps;
  } },
  { id: 'ml2', f: 'Addition : compter en avant', e: 'Addition: counting on', lo: 1, hi: 2, make(sv) {

    for (let i = 0; i < 3; i++) { const b = mlBall(sv, '#FF4D57', 26); b.setAttribute('transform', `translate(${260 + i * 75},300)`); }
    const cnt = mlTxt(sv, 450, 420, '', 56, '#2E9E5B');
    return [
      { f: 'On calcule 3 + 2. Voici déjà 3 pommes rouges.', e: 'We solve 3 + 2. Here are 3 red apples already.', run() { mlHalo(sv, 335, 300, 150, 60); mlPulse(t1); } },
      { f: 'Astuce : garde le 3 dans ta tête, puis compte EN AVANT.', e: 'Trick: keep the 3 in your head, then count ON.', run() { mlHalo(sv, 310, 92, 48, 52); } },
      { f: 'QUATRE !', e: 'FOUR!', run() { const b = mlBall(sv, '#57CC57', 26); mlFly(b, 450, -40, 500, 300); cnt.textContent = '4 !'; mlPulse(cnt, 2); } },
      { f: 'CINQ !', e: 'FIVE!', run() { const b = mlBall(sv, '#57CC57', 26); mlFly(b, 450, -40, 575, 300); cnt.textContent = '5 !'; mlPulse(cnt, 2); } },
      { f: '3 + 2 = 5 ! Compter en avant marche à tous les coups.', e: '3 + 2 = 5! Counting on works every single time.', run() { tq.textContent = '5'; tq.setAttribute('fill', '#2E9E5B'); mlPulse(tq, 3); mlUnder(sv, 455, 132, 340); } }
    ];

  { id: 'ml3', f: 'Addition : la dizaine amie (8 + 5)', e: 'Addition: make a ten (8 + 5)', lo: 2, hi: 4, make(sv) {

    return [

ZONE_BUILDERS.mathlab = function (host) {
  const d = D();
  Rounds.start('mathlab', 2);
  const wrap = H('div', { class: 'quiz-wrap' }, host);
  wrap.style.background = 'linear-gradient(160deg,#F77F00 0%,#FFB703 100%)';
  const lessons = ML_LESSONS.filter(L => d >= L.lo && d <= L.hi);
  function picker() {
    wrap.innerHTML = '';
    const p = H('div', { class: 'qz-panel' }, wrap);
    H('div', { class: 'qz-title', text: '🔬 ' + T('Labo des Maths', 'Math Lab') }, p);
    H('div', { class: 'qz-sub', text: T('Des leçons qui BOUGENT : regarde chaque méthode se construire sous tes yeux !', 'Lessons that MOVE: watch every method build itself before your eyes!') }, p);
    const chips = H('div', { class: 'qz-chips' }, p);
    lessons.forEach(L => {
      const b = H('button', { class: 'qz-chip' }, chips);
      b.innerHTML = '<span class="dot" style="background:#F77F00"></span>' + T(L.f, L.e);
      b.addEventListener('click', () => { sfx.boing(); play(L); });
    });
    mission('Choisis une leçon : je montre la méthode en mouvement, étape par étape !', 'Pick a lesson: I show the method in motion, step by step!', ZONE_ICONS.mathlab);
  }
  function play(L) {
    wrap.innerHTML = '';
    const p = H('div', { class: 'qz-panel' }, wrap);
    H('div', { class: 'qz-prog', text: T(L.f, L.e) }, p);
    const sv = S('svg', { viewBox: '0 0 900 460', class: 'ml-stage' });
    p.appendChild(sv);
    const stepDiv = H('div', { class: 'ml-step' }, p);
    const row = H('div', { class: 'qz-btnrow' }, p);
    const back = H('button', { class: 'qz-hintbtn', text: '🔁 ' + T('Revoir', 'Replay') }, row);
    const next = H('button', { class: 'qz-next on' }, row);
    next.style.marginLeft = '10px';
    let steps = L.make(sv, d), si = -1;
    function show() {
      si++;
      if (si >= steps.length) {
        sfx.fanfare(); confetti(40);
        const complete = Rounds.gem();
        if (complete || lessons.length < 2) setTimeout(zoneComplete, 900); else picker();
        return;
      }
      const st = steps[si];
      stepDiv.textContent = T(st.f, st.e);
      say(st.f, st.e, d <= 2 ? 0.8 : 0.9);
      try { st.run(); } catch (e) {}
      next.textContent = si + 1 >= steps.length ? '🏁 ' + T('Leçon terminée !', 'Lesson done!') : '▶ ' + T('Étape suivante', 'Next step');
    }
    back.addEventListener('click', () => { sfx.tap(); sv.innerHTML = ''; steps = L.make(sv, d); si = -1; show(); });
    next.addEventListener('click', () => { sfx.tap(); show(); });
    show();
  }
  picker();
};

    stories.forEach(st => {

  function buildLire() {
    const READ_FR = [['BA', 'NANE'], ['MA', 'MAN'], ['VÉ', 'LO'], ['MO', 'TO'], ['SA', 'VON'], ['TO', 'MATE'], ['PA', 'PA'], ['LU', 'NE'], ['BA', 'TEAU'], ['DO', 'MI', 'NO'], ['CA', 'MI', 'ON'], ['PY', 'JA', 'MA'], ['TA', 'BLEAU'], ['KA', 'RA', 'TÉ']];

    let roundLive = false;
    function nextRound() {
      cardLayer.innerHTML = '';
      roundLive = false;
      const useEN = d >= 4 && Math.random() < 0.5;

      const syls = pickFresh('read_' + (useEN ? 'en' : 'fr'), bank, x => x.join('-'));
      const word = syls.join('');
      const lang2 = useEN ? 'en-US' : 'fr-FR';
      const n2 = syls.length;
      const TW = Math.min(PT(230, 210), PT(700, 640) / n2 - 14);
      const x0 = PT(750, 425) - ((n2 - 1) / 2) * (TW + 14);
      const TY = PT(620, 700);
      const tiles = [];
      syls.forEach((syl, i) => {
        const g = S('g', { transform: `translate(${x0 + i * (TW + 14)},${TY})`, class: 'grab' }, cardLayer);
        const bg = S('rect', { x: -TW / 2, y: PT(-62, -72), width: TW, height: PT(124, 144), rx: 22, fill: '#fff', stroke: '#0CA678', 'stroke-width': 6 }, g);
        const fs = Math.min(PT(58, 66), (TW - 20) / (syl.length * 0.62));
        colorWord(g, syl, fs, fs * 0.35);
        tiles.push({ g, bg, syl, done: false });
        g.addEventListener('pointerdown', () => tapTile(i));
      });
      let nextIdx = 0, fails = 0, missed = false;
      function lightTile(i, color2) { tiles[i].bg.setAttribute('fill', color2); fxPop(tiles[i].g); }
      function demo(cb) {
        syls.forEach((syl, i) => setTimeout(() => {
          if (activeZone !== 'parrot') return;
          tiles[i].bg.setAttribute('fill', '#FFF8E1'); tiles[i].bg.setAttribute('stroke', '#FFD23F');
          fxPop(tiles[i].g);

          say(syl, syl, 0.62, lang2);

        }, 700 + i * 1050));
        setTimeout(() => { if (activeZone !== 'parrot') return; speakWaves(); say(word + ' !', word + '!', 0.78, lang2); tiles.forEach(t2 => fxPop(t2.g)); cb && cb(); }, 700 + n2 * 1050 + 500);
      }
      function tapTile(i) {
        if (!roundLive || tiles[i].done) return;
        sfx.tap();
        say(tiles[i].syl, tiles[i].syl, 0.66, lang2);
        if (i === nextIdx) {
          tiles[i].done = true;
          lightTile(i, '#D3F9D8'); tiles[i].bg.setAttribute('stroke', '#2E9E5B');

            }, 500);

      else { speakWaves(); setTimeout(() => say(word, word, 0.72, lang2), 900); roundLive = true; }
    }
    nextRound();
  }

function sageNorm(s2) { return String(s2).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function sageAnswer(q) {
  const nq = ' ' + sageNorm(q).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  if (nq.trim().length < 3) return null;
  for (const c of (window.AFRICA_MAP || [])) {
    const nf = ' ' + sageNorm(c.fr) + ' ', ne = ' ' + sageNorm(c.en) + ' ';
    if (nq.includes(nf) || nq.includes(ne)) {
      return { a: [c.flag + ' ' + c.fr + ' : la capitale est ' + c.cap + ' ! C\u2019est un pays de la région ' + c.region + '.', c.flag + ' ' + c.en + ': the capital is ' + c.cap + '! It is a country of the ' + c.region + ' region.'], p: null, z: 'safari' };
    }
  }
  let best = null, bestScore = 0;
  for (const e of SAGE_QA) {
    let sc = 0;
    for (const k of e.kw) {
      const nk = sageNorm(k);
      if (nk.length <= 5 ? nq.includes(' ' + nk.trim() + ' ') : nq.includes(nk)) sc += nk.length;
    }
    if (sc > bestScore) { bestScore = sc; best = e; }
  }
  return best;
}

  (q ? tHits : THEMES_DATA.slice(0, 4)).forEach(th => {

    H('div', { class: 'sr-name', text: ((save.themeBadges || {})[th.id] ? '\uD83C\uDFC5 ' : '') + T(th.fr, th.en) }, card);
    card.addEventListener('click', () => { $('search-overlay').classList.remove('on'); sfx.boing(); Themes.pending = th; enterZone('themes'); });
  });

    card.addEventListener('click', () => { $('search-overlay').classList.remove('on'); sfx.boing(); enterZone(z.key); });
  });
  if (q && !hits.length && !qt.length) say('Essaie un mot comme maths, fractions, conjugaison ou capitales !', 'Try a word like math, fractions, conjugation or capitals!');
}
