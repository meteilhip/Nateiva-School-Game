ZONE_BUILDERS.academy = function (host) {
  const d = D();
  const wrap = H('div', { class: 'quiz-wrap' }, host);
  const topics = QUIZ_TOPICS.filter(t => d >= t.lo && d <= t.hi);
  const gradeName = GRADES[save.grade] ? T(GRADES[save.grade].fr, GRADES[save.grade].en) : '';
  const pending = Academy.pending; Academy.pending = null;

  function picker(filter) {
    wrap.innerHTML = '';
    const p = H('div', { class: 'qz-panel' }, wrap);
    H('div', { class: 'qz-title', text: T('🎓 Académie des Champions', '🎓 Champions Academy') }, p);
    H('div', { class: 'qz-sub', text: T('Classe ' + gradeName + ' — choisis ou tape un sujet, gagne ton quiz !', 'Class ' + gradeName + ' — pick or type a topic, win your quiz!') }, p);
    const cur = CURRICULUM[save.grade] || CURRICULUM[0];
    const cb = H('div', { class: 'qz-cur' }, p);
    cb.innerHTML = '<b>' + T('Programme de ta classe :', 'Your class program:') + '</b><br>' +
      '🔢 ' + T(cur.m[0], cur.m[1]) + '<br>📖 ' + T(cur.l[0], cur.l[1]) + '<br>🔬 ' + T(cur.s[0], cur.s[1]) + '<br>🌍 ' + T(cur.g[0], cur.g[1]);
    const inp = H('input', { class: 'qz-search', type: 'text', autocomplete: 'off', spellcheck: 'false' }, p);
    inp.placeholder = T('Recherche un sujet : fractions, conjugaison, capitales…', 'Search a topic: fractions, conjugation, capitals…');
    const chips = H('div', { class: 'qz-chips' }, p);
    function renderChips(q) {
      q = (q || '').trim().toLowerCase();
      chips.innerHTML = '';
      const hits = topics.filter(t => !q || t.kw.some(k => k.includes(q) || q.includes(k)) || T(t.f, t.e).toLowerCase().includes(q));
      (hits.length ? hits : topics).forEach(t => {
        const b = H('button', { class: 'qz-chip' }, chips);
        b.innerHTML = '<span class="dot" style="background:' + SUBJ[t.sub].c + '"></span>' + T(t.f, t.e);
        b.addEventListener('click', () => { sfx.boing(); playTopic(t); });
      });
    }
    inp.addEventListener('input', ev => renderChips(ev.target.value));
    renderChips(filter || '');
    if (filter) inp.value = filter;
    mission('Bienvenue à l’Académie ! Choisis un sujet de ta classe et gagne ton quiz !', 'Welcome to the Academy! Pick a topic from your class and win your quiz!', ZONE_ICONS.academy);
  }

  function playTopic(t) {
    const QN = 5;
    const records = [];
    let qi = 0;
    say(T(t.f, t.e) + ' ! ' + T('Cinq questions, à toi de jouer !', 'Five questions, your turn!'));
    function ask() {
      wrap.innerHTML = '';
      const q = t.gen(d);
      const p = H('div', { class: 'qz-panel' }, wrap);
      H('div', { class: 'qz-prog', text: T('Question ', 'Question ') + (qi + 1) + ' / ' + QN + ' — ' + T(t.f, t.e) }, p);
      H('div', { class: 'qz-q', text: T(q.qf, q.qe) }, p);
      if (q.dots) H('div', { class: 'qz-dots', text: q.dots }, p);
      const grid = H('div', { class: 'qz-answers' }, p);
      const steps = H('div', { class: 'qz-steps' }, p);
      steps.innerHTML = '<h4>💡 ' + T('Astuce pas à pas', 'Step-by-step trick') + '</h4><ol>' + (isEN() ? q.se : q.sf).map(s => '<li>' + s + '</li>').join('') + '</ol>';
      const row = H('div', { class: 'qz-btnrow' }, p);
      const hintBtn = H('button', { class: 'qz-hintbtn', text: '💡 ' + T('Voir l’astuce', 'Show the trick') }, row);
      const next = H('button', { class: 'qz-next', text: qi + 1 < QN ? T('Question suivante ➡', 'Next question ➡') : T('Voir ma fiche de réponses 📄', 'See my answer sheet 📄') }, row);
      hintBtn.addEventListener('click', () => { steps.classList.toggle('on'); sfx.tap(); say((isEN() ? q.se : q.sf).join(' '), null, d <= 2 ? 0.8 : 0.92); });
      let answered = false;
      const btns = [];
      q.ch.forEach(([cf, ce], i) => {
        const b = H('button', { class: 'qz-a', text: T(cf, ce) }, grid);
        btns.push(b);
        b.addEventListener('click', () => {
          if (answered) return; answered = true;
          btns.forEach(x => x.disabled = true);
          const ok = i === q.ci;
          b.classList.add(ok ? 'good' : 'bad');
          btns[q.ci].classList.add('good');
          records.push({ q, pick: i, ok });
          if (ok) { Rounds.gem(); say(['Bravo !', 'Exact !', 'Champion !'][ri(0, 2)], ['Great!', 'Correct!', 'Champion!'][ri(0, 2)]); }
          else { Rounds.miss(); sfx.bad(); steps.classList.add('on'); say('Pas grave ! Regarde l’astuce pas à pas !', 'No worries! Look at the step-by-step trick!'); }
          next.classList.add('on');
        });
      });
      if (d <= 2) say(q.qf, q.qe, 0.84);
      next.addEventListener('click', () => {
        qi++;
        if (qi < QN) ask(); else sheet();
      });
    }
    function sheet() {
      wrap.innerHTML = '';
      const p = H('div', { class: 'qz-panel' }, wrap);
      const score = records.filter(r => r.ok).length;
      H('div', { class: 'qz-title', text: '📄 ' + T('Fiche de réponses', 'Answer sheet') + ' — ' + T(t.f, t.e) }, p);
      H('div', { class: 'qz-score', text: T('Score : ', 'Score: ') + score + ' / ' + records.length + (score === records.length ? ' 🏆' : '') }, p);
      records.forEach((r, i) => {
        const row = H('div', { class: 'qz-sheet-row ' + (r.ok ? 'ok' : 'ko') }, p);
        const yours = T(r.q.ch[r.pick][0], r.q.ch[r.pick][1]);
        const good = T(r.q.ch[r.q.ci][0], r.q.ch[r.q.ci][1]);
        row.innerHTML = '<div>' + (r.ok ? '✅' : '❌') + ' <b>Q' + (i + 1) + '.</b> ' + T(r.q.qf, r.q.qe) + '</div>' +
          '<div>' + T('Ta réponse : ', 'Your answer: ') + '<b>' + yours + '</b>' + (r.ok ? '' : ' — ' + T('Bonne réponse : ', 'Correct answer: ') + '<b>' + good + '</b>') + '</div>' +
          '<details' + (r.ok ? '' : ' open') + '><summary>💡 ' + T('Astuce pas à pas', 'Step-by-step trick') + '</summary><ol>' + (isEN() ? r.q.se : r.q.sf).map(s => '<li>' + s + '</li>').join('') + '</ol></details>';
      });
      const row = H('div', { class: 'qz-btnrow' }, p);
      const again = H('button', { class: 'qz-next on', text: '🔁 ' + T('Autre sujet', 'Another topic') }, row);
      const fin = H('button', { class: 'qz-next on', text: '🏁 ' + T('Terminer', 'Finish') }, row);
      again.style.marginRight = '10px';
      again.addEventListener('click', () => { Rounds.start('academy', 5); picker(); });
      fin.addEventListener('click', () => zoneComplete());
      say(T('Ta fiche de réponses ! Tu as ', 'Your answer sheet! You got ') + score + T(' bonnes réponses sur ', ' right out of ') + records.length + ' !');
    }
    ask();
  }

  pending ? playTopic(pending) : picker();
};

}
// ---- SEARCH a subject or topic (CE1+ typists; bilingual keywords) ----
function renderSearch(q) {
  q = (q || '').trim().toLowerCase();
  const box = $('search-results'); box.innerHTML = '';
  const hits = ZONES.filter(z => !q ||
    z.topics.some(t => t.includes(q) || q.includes(t)) ||
    T(z.fr, z.en).toLowerCase().includes(q) ||
    T(z.subject.fr, z.subject.en).toLowerCase().includes(q));
  const d = D();
  const qt = QUIZ_TOPICS.filter(t => d >= t.lo && d <= t.hi && q && (t.kw.some(k => k.includes(q) || q.includes(k)) || T(t.f, t.e).toLowerCase().includes(q)));
  qt.forEach(t => {
    const card = H('div', { class: 'sr-card' }, box);
    const ic = iconSvg(g2 => { S('circle', { cx: 0, cy: 0, r: 34, fill: '#fff', stroke: '#5E60CE', 'stroke-width': 5 }, g2); const gg = S('g', {}, g2); ZONE_ICONS.academy(gg); }, '-40 -40 80 80');
    card.appendChild(ic);
    const sub = H('div', { class: 'sr-sub' }, card); sub.textContent = 'QUIZ • ' + T(SUBJ[t.sub].f, SUBJ[t.sub].e); sub.style.background = SUBJ[t.sub].c;
    H('div', { class: 'sr-name', text: T(t.f, t.e) }, card);
    card.addEventListener('click', () => { $('search-overlay').classList.remove('on'); sfx.boing(); Academy.pending = t; enterZone('academy'); });
  });
  (hits.length || qt.length ? hits : ZONES).forEach(z => {
    const card = H('div', { class: 'sr-card' }, box);
    const ic = iconSvg(g2 => { S('circle', { cx: 0, cy: 0, r: 34, fill: '#fff', stroke: z.color, 'stroke-width': 5 }, g2); const gg = S('g', {}, g2); (ZONE_ICONS[z.key] || (() => {}))(gg); }, '-40 -40 80 80');
    card.appendChild(ic);
    const sub = H('div', { class: 'sr-sub' }, card); sub.textContent = T(z.subject.fr, z.subject.en); sub.style.background = z.subject.color;
    H('div', { class: 'sr-name', text: T(z.fr, z.en) }, card);
    card.addEventListener('click', () => { $('search-overlay').classList.remove('on'); sfx.boing(); enterZone(z.key); });
  });
  if (q && !hits.length && !qt.length) say('Essaie un mot comme maths, fractions, conjugaison ou capitales !', 'Try a word like math, fractions, conjugation or capitals!');
}
$('btn-search').appendChild(iconSvg(svg2 => { S('circle', { cx: 10.5, cy: 10.5, r: 6.5, fill: 'none', stroke: '#fff', 'stroke-width': 3 }, svg2); S('path', { d: 'M 15.5 15.5 L 21 21', stroke: '#fff', 'stroke-width': 3.4, 'stroke-linecap': 'round' }, svg2); }));
$('btn-search').addEventListener('click', () => {
  sfx.tap();
  $('search-overlay').classList.add('on');
  $('search-input').value = '';
  $('search-input').placeholder = T('Tape une matière : maths, sciences, pays, syllabes…', 'Type a subject: math, science, countries, syllables…');
  renderSearch('');
  say('Tape une matière ou un sujet, ou touche une carte !', 'Type a subject or topic, or tap a card!');
  setTimeout(() => $('search-input').focus(), 150);
});
$('search-close').addEventListener('click', () => $('search-overlay').classList.remove('on'));
$('search-overlay').addEventListener('click', ev => { if (ev.target === $('search-overlay')) $('search-overlay').classList.remove('on'); });
$('search-input').addEventListener('input', ev => renderSearch(ev.target.value));

$('btn-home').addEventListener('click', () => { sfx.tap(); showMap(); });
$('btn-lang').addEventListener('click', () => { save.lang = isEN() ? 'fr' : 'en'; persist(); sfx.tap(); say('Bonjour !', 'Hello!'); if (activeZone) enterZone(activeZone); else showMap(); });
$('btn-sound').addEventListener('click', () => { save.sound = !save.sound; $('btn-sound').style.opacity = save.sound ? 1 : 0.45; sfx.tap(); });
document.addEventListener('pointerdown', () => { const c = ac(); if (c && c.state === 'suspended') c.resume(); }, { once: true });
buildHudIcons();
buildGradeDock();
updateStarPill();
showMap();
window.__WORLD__ = { ZONES, ZONE_BUILDERS, enterZone, showMap, save, Rounds, QUIZ_TOPICS, CURRICULUM, Academy };
})();
</script>
