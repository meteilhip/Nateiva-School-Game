<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NATEIVA WORLD • Île aux Découvertes</title>
<!--
  NATEIVA WORLD v1.0 — Brand-new cutting-edge kids experience (built from zero).
  Only the LEARNING OBJECTIVES are shared with the classic arcade:
  Z1 Lagune aux Bulles  — counting & sums            (pop bubbles)
  Z2 Verger de Momo     — add/sub/multiply/divide    (drag fruit into baskets)
  Z3 Rivière de Fela    — phonics & syllables        (frog leaps on lily pads)
  Z4 Studio de Zara     — colors & shapes            (paint the animal)
  Z5 Lagon Splash       — float or sink physics      (drop & sort objects)
  Z6 Jardin de Nana     — plant needs & growth       (drag rain cloud & sun)
  Z7 Safari Ballon      — Africa geography           (fly the balloon to countries)
  Z8 Théâtre Kalulu     — listening comprehension    (watch the play, pick & order picture panels)
  Rules: hand-drawn SVG cartoon art (no emoji sprites), 100% direct manipulation,
  zero answer buttons, zero required reading, audio-first FR/EN, classes MAT→CM2.
-->
<style>
:root{
  --red:#FF4D57; --red2:#E5252A; --yellow:#FFD23F; --orange:#FF9F1C;
  --green:#2EC4B6; --leaf:#57CC57; --blue:#4CC9F0; --deep:#2B2D64;
  --cream:#FFF8EC; --ink:#2B2D42;
  --shadow:0 10px 24px rgba(43,45,66,0.25);
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
html,body{ width:100%; height:100%; overflow:hidden; font-family:'Baloo 2','Fredoka','Comic Sans MS',system-ui,sans-serif; background:#87CEEB; touch-action:none; }
#app{ position:fixed; inset:0; overflow:hidden; }

/* ---------- Scenes ---------- */
.scene{ position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity 0.5s ease, transform 0.6s cubic-bezier(0.22,1,0.36,1); transform:scale(1.06); }
.scene.on{ opacity:1; pointer-events:auto; transform:scale(1); }
.scene svg.stage{ width:100%; height:100%; display:block; }

/* ---------- HUD ---------- */
#hud{ position:absolute; top:0; left:0; right:0; padding:10px 14px; display:flex; align-items:center; gap:10px; z-index:40; pointer-events:none; }
#hud > *{ pointer-events:auto; }
.hbtn{ width:54px; height:54px; border-radius:50%; border:3px solid #fff; background:linear-gradient(145deg,var(--red),var(--red2)); box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1); flex:0 0 auto; }
.hbtn:active{ transform:scale(0.88); }
.hbtn svg{ width:28px; height:28px; }
.hbtn.alt{ background:linear-gradient(145deg,#5E60CE,#4EA8DE); }
.hbtn.sun{ background:linear-gradient(145deg,var(--yellow),var(--orange)); }
#star-pill{ margin-left:auto; background:#fff; border:3px solid var(--yellow); border-radius:999px; padding:7px 16px; font-size:1.25rem; font-weight:800; color:var(--ink); box-shadow:var(--shadow); display:flex; align-items:center; gap:7px; }
#star-pill svg{ width:26px; height:26px; }
#grade-dock{ position:absolute; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:7px; z-index:40; background:rgba(255,255,255,0.75); backdrop-filter:blur(8px); padding:7px 10px; border-radius:999px; box-shadow:var(--shadow); }
.gpill{ min-width:52px; padding:6px 10px; border-radius:999px; border:3px solid transparent; background:#EDF2FB; cursor:pointer; text-align:center; font-weight:800; color:#5C6784; font-size:0.78rem; line-height:1.05; transition:all 0.2s; }
.gpill small{ display:block; font-size:0.58rem; font-weight:700; opacity:0.7; }
.gpill.on{ background:linear-gradient(145deg,var(--red),var(--red2)); color:#fff; border-color:#fff; transform:scale(1.12); box-shadow:0 6px 14px rgba(229,37,42,0.45); }
.gpill.on small{ opacity:0.92; }

/* ---------- Big friendly banner ---------- */
#mission-bar{ position:absolute; top:76px; left:50%; transform:translateX(-50%) scale(0); width:min(720px,92%); z-index:35; background:#fff; border:4px solid var(--yellow); border-radius:26px; padding:10px 18px; box-shadow:var(--shadow); display:flex; align-items:center; gap:14px; transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1); cursor:pointer; }
#mission-bar.on{ transform:translateX(-50%) scale(1); }
#mission-icon{ width:56px; height:56px; flex:0 0 auto; }
#mission-text{ font-size:1.22rem; font-weight:800; color:var(--ink); line-height:1.15; }
#mission-speaker{ margin-left:auto; flex:0 0 auto; width:44px; height:44px; }
#mission-subject{ flex:0 0 auto; padding:7px 13px; border-radius:999px; color:#fff; font-weight:900; font-size:0.86rem; letter-spacing:0.04em; border:3px solid #fff; box-shadow:0 4px 10px rgba(0,0,0,0.18); white-space:nowrap; }
#mission-trick{ flex:0 0 auto; width:44px; height:44px; margin-left:auto; display:flex; align-items:center; justify-content:center; font-size:1.5rem; background:#FFF8E1; border:3px solid #FFD23F; border-radius:50%; cursor:pointer; transition:transform 0.2s; animation:bob 2.4s ease-in-out infinite; }
#mission-trick:active{ transform:scale(0.85); }
#mission-speaker{ margin-left:0; }
@media(max-width:760px){ #mission-subject{ font-size:0.7rem; padding:5px 9px; } #mission-text{ font-size:0.98rem; } }

/* ---------- Progress gems ---------- */
#round-gems{ position:absolute; top:18px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:36; }
.gem{ width:22px; height:22px; border-radius:50%; background:#fff; border:3px solid #C9D3EE; transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1); }
.gem.done{ background:radial-gradient(circle at 35% 30%,#FFF3B0,var(--yellow)); border-color:var(--orange); transform:scale(1.25); box-shadow:0 0 12px rgba(255,210,63,0.9); }

/* ---------- Celebration ---------- */
#confetti-layer{ position:absolute; inset:0; pointer-events:none; z-index:60; overflow:hidden; }
.conf{ position:absolute; width:14px; height:14px; border-radius:3px; will-change:transform; }
#cheer-card{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:55; background:rgba(43,45,66,0.35); backdrop-filter:blur(4px); }
#cheer-card.on{ display:flex; }
#cheer-inner{ background:linear-gradient(160deg,#FFF8EC,#FFE8C2); border:5px solid var(--yellow); border-radius:34px; padding:30px 44px; text-align:center; box-shadow:0 30px 70px rgba(0,0,0,0.4); animation:cheerPop 0.5s cubic-bezier(0.34,1.56,0.64,1); max-width:88%; }
#cheer-art{ width:150px; height:150px; margin:0 auto; }
#cheer-title{ font-size:1.7rem; font-weight:800; color:var(--ink); margin-top:6px; }
#cheer-stars{ display:flex; justify-content:center; gap:8px; margin-top:8px; }
#cheer-stars svg{ width:46px; height:46px; animation:starIn 0.5s cubic-bezier(0.34,1.56,0.64,1) backwards; }
#cheer-stars svg:nth-child(2){ animation-delay:0.18s; } #cheer-stars svg:nth-child(3){ animation-delay:0.36s; }
#cheer-btn{ margin-top:16px; background:linear-gradient(145deg,var(--leaf),#2E9E5B); color:#fff; border:4px solid #fff; border-radius:999px; padding:12px 38px; font-size:1.3rem; font-weight:800; font-family:inherit; cursor:pointer; box-shadow:var(--shadow); transition:transform 0.18s; }
#cheer-btn:active{ transform:scale(0.9); }
@keyframes cheerPop{ from{ transform:scale(0.3) rotate(-6deg); opacity:0; } }
@keyframes starIn{ from{ transform:scale(0) rotate(-120deg); } }

/* ---------- Generic cartoon motion ---------- */
@keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-9px); } }
@keyframes bobBig{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-16px); } }
@keyframes sway{ 0%,100%{ transform:rotate(-4deg); } 50%{ transform:rotate(4deg); } }
@keyframes swimL{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(-14px); } }
@keyframes rays{ from{ transform:rotate(0); } to{ transform:rotate(360deg); } }
@keyframes drift{ from{ transform:translateX(-200px); } to{ transform:translateX(2000px); } }
@keyframes wobble{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-7deg); } 75%{ transform:rotate(7deg); } }
@keyframes squish{ 0%{ transform:scale(1,1); } 35%{ transform:scale(1.25,0.75); } 70%{ transform:scale(0.85,1.15); } 100%{ transform:scale(1,1); } }
@keyframes popIn{ from{ transform:scale(0); } to{ transform:scale(1); } }
.pop-in{ animation:popIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
.pop-in,.wobble,.squish{ transform-box:fill-box; transform-origin:center; }
.wobble{ animation:wobble 0.45s ease 2; }
.squish{ animation:squish 0.5s ease; }
.grab{ cursor:grab; } .grabbing{ cursor:grabbing; }

/* Map stations */
.station{ cursor:pointer; }
.station:hover .st-ring-main{ stroke-width:11; filter:brightness(1.06); }
.station:hover .st-pill{ filter:brightness(1.12); }
.station .ring{ animation:bob 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
#back-home-float{ position:absolute; bottom:14px; right:14px; z-index:40; }
.hbtn.search{ background:linear-gradient(145deg,#2EC4B6,#1B9C8F); }
#search-overlay{ position:fixed; inset:0; z-index:70; background:rgba(43,45,66,0.45); backdrop-filter:blur(6px); display:none; align-items:flex-start; justify-content:center; padding:70px 16px 16px; }
#search-overlay.on{ display:flex; }
#search-panel{ background:#fff; border:5px solid #2EC4B6; border-radius:30px; width:min(760px,100%); max-height:82vh; overflow:auto; padding:18px; box-shadow:0 30px 70px rgba(0,0,0,0.4); }
#search-head{ display:flex; gap:10px; }
#search-input{ flex:1; font-family:inherit; font-size:1.3rem; font-weight:800; color:var(--ink); border:4px solid #C9D3EE; border-radius:999px; padding:12px 22px; outline:none; }
#search-input:focus{ border-color:#2EC4B6; }
#search-close{ width:56px; border-radius:50%; border:4px solid #fff; background:linear-gradient(145deg,#FF4D57,#E5252A); color:#fff; font-size:1.2rem; cursor:pointer; }
#search-results{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; margin-top:16px; }
.sr-card{ border:4px solid #E3E8F7; border-radius:22px; padding:14px 10px; text-align:center; cursor:pointer; background:#FBFCFF; transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1), border-color 0.2s; }
.sr-card:hover{ transform:scale(1.05); border-color:#2EC4B6; }
.sr-card svg{ width:70px; height:70px; }
.sr-sub{ display:inline-block; margin-top:4px; padding:4px 12px; border-radius:999px; color:#fff; font-weight:900; font-size:0.74rem; }
.sr-name{ font-weight:800; color:var(--ink); margin-top:5px; font-size:1.02rem; }

/* ---------- Academy quiz (searchable curriculum quizzes) ---------- */
.quiz-wrap{ position:absolute; inset:0; overflow:auto; background:linear-gradient(160deg,#5E60CE 0%,#4EA8DE 100%); padding:150px 14px 24px; display:flex; flex-direction:column; align-items:center; gap:14px; }
.qz-panel{ background:#fff; border:5px solid #FFD23F; border-radius:28px; width:min(880px,97%); padding:18px 22px; box-shadow:0 20px 50px rgba(0,0,0,0.3); }
.qz-title{ font-size:1.5rem; font-weight:800; color:#2B2D42; text-align:center; }
.qz-sub{ text-align:center; color:#8A93AD; font-weight:700; margin-top:4px; }
.qz-cur{ background:#EDF2FB; border-radius:16px; padding:10px 14px; margin-top:12px; font-weight:700; color:#5C6784; font-size:0.95rem; line-height:1.45; }
.qz-cur b{ color:#5E60CE; }
.qz-search{ width:100%; font-family:inherit; font-size:1.1rem; font-weight:800; color:#2B2D42; border:4px solid #C9D3EE; border-radius:999px; padding:11px 20px; outline:none; margin-top:12px; }
.qz-search:focus{ border-color:#5E60CE; }
.qz-chips{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:14px; }
.qz-chip{ border:3px solid #E3E8F7; background:#FBFCFF; border-radius:999px; padding:11px 18px; font-family:inherit; font-weight:800; font-size:1rem; color:#2B2D42; cursor:pointer; transition:transform 0.18s cubic-bezier(0.34,1.56,0.64,1), border-color 0.18s; }
.qz-chip:hover{ transform:scale(1.07); border-color:#5E60CE; }
.qz-chip .dot{ display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:8px; }
.qz-q{ font-size:1.5rem; font-weight:800; color:#2B2D42; text-align:center; line-height:1.35; }
.qz-dots{ font-size:1.9rem; text-align:center; letter-spacing:4px; margin-top:6px; }
.qz-answers{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-top:16px; }
.qz-a{ border:4px solid #C9D3EE; background:#FBFCFF; border-radius:20px; padding:16px 10px; font-family:inherit; font-size:1.3rem; font-weight:800; color:#2B2D42; cursor:pointer; transition:transform 0.15s, border-color 0.15s; }
.qz-a:hover:not(:disabled){ border-color:#5E60CE; transform:scale(1.04); }
.qz-a.good{ background:#57CC57; border-color:#2E9E5B; color:#fff; }
.qz-a.bad{ background:#FF4D57; border-color:#C42631; color:#fff; }
.qz-a:disabled{ cursor:default; }
.qz-steps{ margin-top:14px; background:#FFF8E1; border:3px solid #FFD23F; border-radius:18px; padding:12px 16px; display:none; text-align:left; }
.qz-steps.on{ display:block; }
.qz-steps h4{ color:#B4654A; margin-bottom:6px; font-size:1.05rem; }
.qz-steps ol{ margin-left:24px; color:#2B2D42; font-weight:700; line-height:1.55; }
.qz-btnrow{ text-align:center; }
.qz-next{ margin-top:14px; background:linear-gradient(145deg,#57CC57,#2E9E5B); color:#fff; border:4px solid #fff; border-radius:999px; padding:12px 36px; font-size:1.15rem; font-weight:800; font-family:inherit; cursor:pointer; box-shadow:var(--shadow); display:none; }
.qz-next.on{ display:inline-block; }
.qz-next:active{ transform:scale(0.93); }
.qz-hintbtn{ margin-top:12px; background:#FFF8E1; border:3px solid #FFD23F; border-radius:999px; padding:9px 22px; font-family:inherit; font-weight:800; font-size:1rem; color:#B4654A; cursor:pointer; display:inline-block; }
.qz-prog{ text-align:center; font-weight:800; color:#5E60CE; margin-bottom:4px; }
.qz-sheet-row{ border:3px solid #E3E8F7; border-radius:16px; padding:10px 14px; margin-top:10px; font-weight:700; color:#2B2D42; }
.qz-sheet-row.ok{ border-color:#57CC57; background:#F0FBF0; }
.qz-sheet-row.ko{ border-color:#FF4D57; background:#FFF3F3; }
.qz-sheet-row details{ margin-top:6px; }
.qz-sheet-row summary{ cursor:pointer; color:#B4654A; font-weight:800; }
.qz-sheet-row ol{ margin-left:22px; margin-top:6px; line-height:1.5; }
.qz-score{ text-align:center; font-size:1.3rem; font-weight:800; color:#2B2D42; margin-top:8px; }
</style>
</head>
<body>
<div id="app">
  <div class="scene" id="scene-map"></div>
  <div class="scene" id="scene-game"></div>
  <div id="round-gems"></div>
  <div id="mission-bar"><div id="mission-subject"></div><div id="mission-icon"></div><div id="mission-text"></div><div id="mission-trick" title="Astuce / Trick">💡</div><div id="mission-speaker"></div></div>
  <div id="hud">
    <button class="hbtn" id="btn-home" title="Île / Island"></button>
    <button class="hbtn alt" id="btn-lang" title="FR / EN"></button>
    <button class="hbtn sun" id="btn-sound" title="Son / Sound"></button>
    <button class="hbtn search" id="btn-search" title="Chercher / Search"></button>
    <div id="star-pill"><span id="star-art"></span><span id="star-count">0</span></div>
  </div>
  <div id="grade-dock"></div>
  <div id="confetti-layer"></div>
  <div id="search-overlay">
    <div id="search-panel">
      <div id="search-head"><input id="search-input" type="text" autocomplete="off" spellcheck="false"><button id="search-close">✖</button></div>
      <div id="search-results"></div>
    </div>
  </div>
  <div id="cheer-card"><div id="cheer-inner"><div id="cheer-art"></div><div id="cheer-title"></div><div id="cheer-stars"></div><button id="cheer-btn"></button></div></div>
</div>
<script src="africa-data.js"></script>
<script>
(() => {
'use strict';
/* ================= CORE UTILITIES ================= */
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function S(tag, attrs = {}, parent = null) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) {
    if (k === 'text') el.textContent = attrs[k];
    else el.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(el);
  return el;
}
function H(tag, attrs = {}, parent = null) {
  const el = document.createElement(tag);
  for (const k in attrs) { if (k === 'text') el.textContent = attrs[k]; else el.setAttribute(k, attrs[k]); }
  if (parent) parent.appendChild(el);
  return el;
}
// Pointer-drag helper (mouse + touch), SVG-coordinate aware
function makeDraggable(el, svg, handlers) {
  let dragging = false;
  const pt = () => svg.createSVGPoint();
  const toSvg = (ev) => { const p = pt(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  el.addEventListener('pointerdown', ev => {
    ev.preventDefault();
    dragging = true;
    try { el.setPointerCapture(ev.pointerId); } catch (e) {}
    el.classList.add('grabbing');
    handlers.start && handlers.start(toSvg(ev), ev);
  });
  const move = ev => { if (dragging && el.isConnected) { handlers.move && handlers.move(toSvg(ev), ev); } };
  const up = ev => {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('grabbing');
    if (el.isConnected) handlers.end && handlers.end(toSvg(ev), ev);
  };
  // window-level tracking survives fast pointers, synthetic input and capture failures
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  el.classList.add('grab');
}
// rAF tween
function tween(ms, step, done) {
  const t0 = performance.now();
  (function loop(t) {
    const k = clamp((t - t0) / ms, 0, 1);
    step(k);
    if (k < 1) requestAnimationFrame(loop); else done && done();
  })(t0);
}
const easeOutBack = k => 1 + 2.70158 * Math.pow(k - 1, 3) + 1.70158 * Math.pow(k - 1, 2);
// FX that COMPOSE with an element's SVG transform attribute (never override position)
function fxPrep(el) { el.style.transformBox = 'fill-box'; el.style.transformOrigin = 'center'; }
function fxBob(el, amp = 9, dur = 2600) { fxPrep(el); try { el.animate([{ transform: 'translateY(0px)' }, { transform: `translateY(${-amp}px)` }, { transform: 'translateY(0px)' }], { duration: dur, iterations: Infinity, composite: 'add', easing: 'ease-in-out' }); } catch (e) {} }
function fxPop(el) { fxPrep(el); try { el.animate([{ transform: 'scale(0.05)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'cubic-bezier(0.34,1.56,0.64,1)', composite: 'add' }); } catch (e) {} }
function fxWobble(el) { fxPrep(el); try { el.animate([{ transform: 'rotate(0deg)' }, { transform: 'rotate(-8deg)' }, { transform: 'rotate(8deg)' }, { transform: 'rotate(0deg)' }], { duration: 440, iterations: 2, composite: 'add' }); } catch (e) {} }
function fxSquish(el) { fxPrep(el); try { el.animate([{ transform: 'scale(1,1)' }, { transform: 'scale(1.25,0.75)' }, { transform: 'scale(0.85,1.15)' }, { transform: 'scale(1,1)' }], { duration: 520, composite: 'add' }); } catch (e) {} }
const easeIn = k => k * k;
const easeOut = k => 1 - (1 - k) * (1 - k);

/* ================= STATE ================= */
const GRADES = [
  { code: 'MAT', fr: 'Maternelle', en: 'Nursery', sub: 'KG', d: 0 },
  { code: 'SIL', fr: 'SIL', en: 'Grade 1', sub: 'Gr.1', d: 1 },
  { code: 'CP', fr: 'CP', en: 'Grade 2', sub: 'Gr.2', d: 2 },
  { code: 'CE1', fr: 'CE1', en: 'Grade 3', sub: 'Gr.3', d: 3 },
  { code: 'CE2', fr: 'CE2', en: 'Grade 4', sub: 'Gr.4', d: 4 },
  { code: 'CM1', fr: 'CM1', en: 'Grade 5', sub: 'Gr.5', d: 5 },
  { code: 'CM2', fr: 'CM2', en: 'Grade 6', sub: 'Gr.6', d: 6 }
];
let save = { grade: 0, lang: 'fr', sound: true, stars: {}, done: {} };
try { Object.assign(save, JSON.parse(localStorage.getItem('nateiva_world_v1') || '{}')); } catch (e) {}
const persist = () => { try { localStorage.setItem('nateiva_world_v1', JSON.stringify(save)); } catch (e) {} };
const D = () => GRADES[save.grade].d;            // difficulty 0..6
const isEN = () => save.lang === 'en';
const T = (fr, en) => isEN() ? en : fr;

/* ================= AUDIO (WebAudio SFX + speech) ================= */
let AC = null;
const ac = () => { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; };
function tone(freq, dur = 0.12, type = 'sine', gain = 0.16, when = 0) {
  const c = ac(); if (!c || !save.sound) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(gain, c.currentTime + when);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + when + dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime + when); o.stop(c.currentTime + when + dur + 0.02);

function say(fr, en, rate) {
  if (!save.sound || !('speechSynthesis' in window)) return;
  const text = T(fr, en == null ? fr : en);
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = isEN() ? 'en-US' : 'fr-FR';
  u.rate = rate || (D() <= 1 ? 0.82 : 0.95);
  u.pitch = 1.06;
  const pool = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(isEN() ? 'en' : 'fr'));
  const best = pool.find(v => /natural|neural|premium|google/i.test(v.name)) || pool[0];
  if (best) u.voice = best;
  speechSynthesis.speak(u);
}

// Eyes that blink
function drawEyes(g, x, y, gap, r) {
  [-1, 1].forEach(s => {
    S('circle', { cx: x + s * gap, cy: y, r: r, fill: '#fff' }, g);
    const pupil = S('circle', { cx: x + s * gap, cy: y + r * 0.18, r: r * 0.45, fill: '#2B2D42' }, g);
    S('circle', { cx: x + s * gap + r * 0.15, cy: y - r * 0.05, r: r * 0.14, fill: '#fff' }, g);
    const lid = S('rect', { x: x + s * gap - r, y: y - r, width: 2 * r, height: 0, rx: r * 0.4, fill: 'inherit' }, g);
    lid.setAttribute('class', 'lid');
  });
  // blink loop
  const lids = g.querySelectorAll('.lid');
  (function blink() {
    setTimeout(() => {
      lids.forEach(l => { l.setAttribute('height', String(2 * r)); l.setAttribute('fill', g.dataset.skin || '#E8A33D'); });
      setTimeout(() => { lids.forEach(l => l.setAttribute('height', '0')); blink(); }, 140);
    }, rnd(2200, 5200));
  })();
}

function confetti(n = 36) {
  const layer = $('confetti-layer');
  const colors = ['#FF4D57', '#FFD23F', '#2EC4B6', '#4CC9F0', '#9B5DE5', '#57CC57'];
  for (let i = 0; i < n; i++) {
    const c = H('div', { class: 'conf' }, layer);
    c.style.background = colors[i % colors.length];
    c.style.left = rnd(5, 95) + '%';
    c.style.top = '-20px';
    const fall = c.animate([
      { transform: `translateY(0) rotate(0deg)`, opacity: 1 },
      { transform: `translateY(${innerHeight + 60}px) rotate(${rnd(360, 1080)}deg)`, opacity: 0.9 }
    ], { duration: rnd(1600, 3200), easing: 'cubic-bezier(0.2,0.6,0.4,1)' });
    fall.onfinish = () => c.remove();
  }
}

const Rounds = {
  total: 5, idx: 0, mistakes: 0, zone: null,
  start(zoneKey, total = 5) {
    this.zone = zoneKey; this.total = total; this.idx = 0; this.mistakes = 0; this._subjectSaid = false;
    const g = $('round-gems'); g.innerHTML = '';
    for (let i = 0; i < total; i++) H('div', { class: 'gem' }, g);
  },
  miss() { this.mistakes++; },
  gem() {
    const gems = document.querySelectorAll('#round-gems .gem');
    if (gems[this.idx]) gems[this.idx].classList.add('done');
    this.idx++;
    sfx.good();
    confetti(14);
    return this.idx >= this.total;
  },
  stars() { return this.mistakes <= 1 ? 3 : (this.mistakes <= 3 ? 2 : 1); }
};
function zoneComplete() {
  const stars = Rounds.stars();
  const z = Rounds.zone;
  save.stars[z] = Math.max(save.stars[z] || 0, stars);
  save.done[z] = (save.done[z] || 0) + 1;
  persist();
  updateStarPill();
  sfx.fanfare(); confetti(70);
  const art = $('cheer-art'); art.innerHTML = '';
  art.appendChild(iconSvg(svg => { drawLeo(svg, 0, 6, 0.95); }, '-75 -75 150 150'));
  $('cheer-title').textContent = T('BRAVO ! Zone réussie !', 'AMAZING! Zone complete!');
  const cs = $('cheer-stars'); cs.innerHTML = '';
  for (let i = 0; i < 3; i++) cs.appendChild(iconSvg(svg => drawStarIcon(svg, 1.9, i < stars ? '#FFD23F' : '#E3E6F0'), '0 0 46 46'));
  $('cheer-btn').textContent = T("Retour à l'île", 'Back to the island');
  $('cheer-card').classList.add('on');
  say('Bravo ! Tu as gagné ' + stars + ' étoiles !', 'Amazing! You earned ' + stars + ' stars!');
}

      { transform: `translate(${x}px,${900 + r}px)` },
      { transform: `translate(${x + drift}px,${-120}px)` }
    ], { duration: dur, easing: 'linear' });
    anim.onfinish = () => { ob.popped = true; g.remove(); };
    g.addEventListener('pointerdown', ev => {
      ev.preventDefault();
      if (ob.popped || !roundLive) return;
      ob.popped = true;
      const m = new DOMMatrix(getComputedStyle(g).transform);
      anim.cancel();
      g.setAttribute('transform', `translate(${m.e},${m.f})`);
      popAt(g, m.e, m.f, ob);
    });
  }
  function popAt(g, x, y, ob) {
    sfx.pop();
    for (let i = 0; i < 8; i++) {
      const d = S('circle', { cx: x, cy: y, r: rnd(4, 9), fill: 'rgba(200,240,255,0.9)' }, svg);
      const a = rnd(0, Math.PI * 2), dist = rnd(30, 90);
      d.animate([{ transform: 'translate(0,0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * dist}px,${Math.sin(a) * dist}px)`, opacity: 0 }], { duration: 500 }).onfinish = () => d.remove();
    }
    g.remove();
    if (sumMode) {
      sum += ob.val;
      if (sum === target) { finishRound(); }
      else if (sum > target) { sfx.bad(); Rounds.miss(); say('Oh ! Trop ! On recommence.', 'Oops! Too much! Try again.'); sum = 0; bigNum.textContent = target; }
      else { bigNum.textContent = (target - sum); say(String(target - sum), String(target - sum)); }
    } else {
      caught++;
      netShow();
      say(String(caught), String(caught));
      if (caught === need) finishRound();
      else if (caught > need) { /* cannot exceed: finish already called */ }
    }
  }
  function finishRound() {
    roundLive = false;
    clearInterval(spawnTimer);
    layer.innerHTML = '';
    say('Super !', 'Great job!');
    if (Rounds.gem()) setTimeout(zoneComplete, 900); else setTimeout(nextRound, 1100);
  }
  function nextRound() {
    caught = 0; sum = 0; netShow(); layer.innerHTML = ''; alive = [];
    const d = D();
    sumMode = d >= 3;
    if (sumMode) {
      target = d >= 5 ? ri(12, 25) : ri(6, 12);
      bigNum.textContent = target; drawDots(0);
      mission('Attrape des bulles pour faire ' + target + ' !', 'Pop bubbles to make ' + target + '!', g => { ZONE_ICONS.bubbles(g); });
    } else {
      need = d === 0 ? ri(2, 5) : (d === 1 ? ri(3, 8) : ri(5, 10));
      bigNum.textContent = need; drawDots(need);
      mission('Attrape ' + need + ' poissons !', 'Catch ' + need + ' fish!', g => { ZONE_ICONS.bubbles(g); });
    }
    roundLive = true;
    clearInterval(spawnTimer);
    spawnTimer = setInterval(spawnBubble, Math.max(520, 900 - D() * 60));
    for (let i = 0; i < 4; i++) setTimeout(spawnBubble, i * 180);
  }
  nextRound();
};

/* ================= Z2 — VERGER DE MOMO (drag fruit: add, multiply, share) ================= */
ZONE_BUILDERS.orchard = function (host) {
  const svg = S('svg', { class: 'stage', viewBox: '0 0 1500 850', preserveAspectRatio: (innerWidth >= innerHeight * 1.02 ? 'xMidYMid slice' : 'xMidYMid meet') }, host);
  gradDefs(svg);
  S('rect', { width: 1500, height: 560, fill: 'url(#gSky)' }, svg);
  S('rect', { y: 540, width: 1500, height: 310, fill: 'url(#gGrass)' }, svg);
  drawSun(svg, 1370, 110, 0.9);
  drawCloud(svg, 300, 100, 0.9);
  // big tree
  const tree = S('g', { transform: 'translate(330,430)' }, svg);
  S('rect', { x: -40, y: -40, width: 80, height: 240, rx: 30, fill: 'url(#gWood)' }, tree);
  S('path', { d: 'M -20 60 Q -70 60 -90 110', stroke: '#8A5A33', 'stroke-width': 22, fill: 'none', 'stroke-linecap': 'round' }, tree);
  [[-150, -120, 110], [0, -190, 130], [150, -120, 110], [-70, -60, 90], [80, -60, 90]].forEach(([cx, cy, r]) => S('circle', { cx, cy, r, fill: '#3FA34D' }, tree));
  [[-150, -120], [0, -190], [150, -120]].forEach(([cx, cy]) => S('circle', { cx: cx - 26, cy: cy - 22, r: 30, fill: 'rgba(255,255,255,0.18)' }, tree));
  const momo = drawMonkey(svg, 1210, 330, 1.05);
  fxBob(momo, 9, 2600);
  const fruitLayer = S('g', {}, svg);
  const basketLayer = S('g', {}, svg);
  const FRUITS = [
    { name: ['banane', 'banana'], draw: (g) => { S('path', { d: 'M -24 6 Q 0 30 26 2 Q 30 -4 24 -4 Q 2 16 -18 -2 Q -26 0 -24 6 Z', fill: '#FFD23F', stroke: '#D9A400', 'stroke-width': 3 }, g); } },
    { name: ['mangue', 'mango'], draw: (g) => { S('ellipse', { cx: 0, cy: 2, rx: 22, ry: 17, fill: '#FF9F1C', stroke: '#D97800', 'stroke-width': 3 }, g); S('path', { d: 'M 8 -14 Q 16 -24 24 -18', stroke: '#3FA34D', 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }, g); } },
    { name: ['pomme', 'apple'], draw: (g) => { S('path', { d: 'M 0 -8 C 22 -22 32 6 14 18 C 6 24 -6 24 -14 18 C -32 6 -22 -22 0 -8 Z', fill: '#FF4D57', stroke: '#C42631', 'stroke-width': 3 }, g); S('rect', { x: -2, y: -22, width: 4, height: 12, rx: 2, fill: '#6B421D' }, g); } }
  ];
  let baskets = [], fruits = [], needPer = [], mode = 'count', roundLive = false, fruitDef = FRUITS[0];
  function drawBasket(x, y, slots, label) {
    const g = S('g', { transform: `translate(${x},${y})` }, basketLayer);
    S('path', { d: 'M -78 0 L 78 0 L 60 66 Q 0 80 -60 66 Z', fill: 'url(#gWood)', stroke: '#6B421D', 'stroke-width': 4 }, g);
    S('path', { d: 'M -80 -4 L 80 -4 L 78 10 L -78 10 Z', fill: '#A96F3C', stroke: '#6B421D', 'stroke-width': 3, rx: 4 }, g);
    const slotG = S('g', {}, g);
    for (let i = 0; i < slots; i++) S('circle', { cx: -52 + (i % 5) * 26, cy: 28 + Math.floor(i / 5) * 24, r: 10, fill: 'none', stroke: 'rgba(255,255,255,0.65)', 'stroke-width': 2.6, 'stroke-dasharray': '4 4' }, slotG);
    if (label != null) S('text', { x: 0, y: -16, 'text-anchor': 'middle', 'font-size': 40, 'font-weight': 800, fill: '#5C3A17', 'font-family': 'inherit', text: String(label) }, g);
    return { g, x, y, got: 0, slots, fills: S('g', {}, g) };
  }
  function spawnFruit(x, y) {
    const g = S('g', { transform: `translate(${x},${y})` }, fruitLayer);
    S('circle', { r: 42, fill: 'rgba(255,255,255,0.001)' }, g); // fat touch target
    const art = S('g', {}, g);
    fruitDef.draw(art);
    fxPop(art);
    const f = { g, home: [x, y], free: true };
    makeDraggable(g, svg, {
      start: () => { if (!roundLive || !f.free) return; sfx.tap(); g.parentNode.appendChild(g); },
      move: p => { if (!roundLive || !f.free) return; g.setAttribute('transform', `translate(${p.x},${p.y}) scale(1.2)`); },
      end: p => {
        if (!roundLive || !f.free) return;
        const b = baskets.find(bk => Math.abs(p.x - bk.x) < 95 && p.y > bk.y - 40 && p.y < bk.y + 95);
        if (b && b.got < b.slots) {
          b.got++; f.free = false;
          const fg = S('g', { transform: `translate(${-52 + ((b.got - 1) % 5) * 26},${28 + Math.floor((b.got - 1) / 5) * 24}) scale(0.55)` }, b.fills);
          fruitDef.draw(fg);
          fxPop(fg);
          g.remove(); sfx.pop();
          checkDone();
        } else {
          g.animate([{ transform: `translate(${p.x}px,${p.y}px)` }, { transform: `translate(${f.home[0]}px,${f.home[1]}px)` }], { duration: 420, easing: 'cubic-bezier(0.34,1.56,0.64,1)' }).onfinish = () => g.setAttribute('transform', `translate(${f.home[0]},${f.home[1]})`);
          sfx.whoosh();
        }
      }
    });
    fruits.push(f);
  }
  function checkDone() {
    const total = baskets.reduce((s, b) => s + b.got, 0);
    const needTotal = needPer.reduce((s, n) => s + n, 0);
    if (mode === 'share') {
      if (total === needTotal) {
        const per = needTotal / baskets.length;
        if (baskets.every(b => b.got === per)) winRound();
        else { sfx.bad(); Rounds.miss(); fxWobble(momo); say('Partage pareil dans chaque panier !', 'Share the same in every basket!'); }
      }
      return;
    }
    if (baskets.every((b, i) => b.got === needPer[i])) winRound();
    else if (total >= needTotal) { sfx.bad(); Rounds.miss(); say('Regarde bien chaque panier !', 'Look at each basket!'); }
  }
  function winRound() {
    roundLive = false;
    fxSquish(momo);
    say('Miam ! Merci !', 'Yummy! Thank you!');
    if (Rounds.gem()) setTimeout(zoneComplete, 900); else setTimeout(nextRound, 1200);
  }
  function nextRound() {
    basketLayer.innerHTML = ''; fruitLayer.innerHTML = '';
    baskets = []; fruits = []; fruitDef = FRUITS[ri(0, FRUITS.length - 1)];
    const d = D();
    if (d <= 1) { mode = 'count'; needPer = [ri(2, d === 0 ? 5 : 8)]; baskets = [drawBasket(750, 640, needPer[0], needPer[0])];
      mission('Donne ' + needPer[0] + ' fruits à Momo !', 'Give Momo ' + needPer[0] + ' fruits!', ZONE_ICONS.orchard);
    } else if (d <= 3) { mode = 'add'; const a = ri(2, 6), b = ri(2, 6); needPer = [a, b];
      baskets = [drawBasket(620, 640, a, a), drawBasket(900, 640, b, b)];
      mission(`${a} + ${b} = ? Remplis les paniers : ${a} et ${b} fruits !`, `${a} + ${b} = ? Fill the baskets: ${a} and ${b} fruits!`, ZONE_ICONS.orchard);
    } else if (d <= 5) { mode = 'mult'; const n = ri(2, 3), k = ri(3, 5); needPer = Array(n).fill(k);
      baskets = needPer.map((kk, i) => drawBasket(600 + i * 240, 640, kk, kk));
      mission(`${n} × ${k} = ? Remplis ${n} paniers de ${k} fruits !`, `${n} × ${k} = ? Fill ${n} baskets of ${k} fruits!`, ZONE_ICONS.orchard);
    } else { mode = 'share'; const n = ri(2, 3), per = ri(3, 4); needPer = Array(n).fill(per);
      baskets = needPer.map((kk, i) => drawBasket(600 + i * 240, 640, kk, null));
      mission(`${n * per} ÷ ${n} = ? Partage ${n * per} fruits entre les ${n} paniers, pareil partout !`, `${n * per} ÷ ${n} = ? Share ${n * per} fruits equally between the ${n} baskets!`, ZONE_ICONS.orchard);
    }
    const totalFruit = needPer.reduce((s, n) => s + n, 0) + ri(2, 4);
    for (let i = 0; i < totalFruit; i++) spawnFruit(170 + (i % 4) * 100 + rnd(-16, 16), 370 + Math.floor(i / 4) * 88 + rnd(-12, 12));
    roundLive = true;
  }
  nextRound();
};

/* ================= Z3 — RIVIÈRE DE FELA (phonics leaps) ================= */
ZONE_BUILDERS.river = function (host) {
  const svg = S('svg', { class: 'stage', viewBox: '0 0 1500 850', preserveAspectRatio: (innerWidth >= innerHeight * 1.02 ? 'xMidYMid slice' : 'xMidYMid meet') }, host);
  gradDefs(svg);
  S('rect', { width: 1500, height: 850, fill: 'url(#gNight)' }, svg);
  S('circle', { cx: 1310, cy: 130, r: 56, fill: '#FFF3B0', opacity: 0.95 }, svg);
  S('circle', { cx: 1288, cy: 118, r: 50, fill: '#30346B' }, svg);
  for (let i = 0; i < 26; i++) { const st = S('circle', { cx: rnd(20, 1480), cy: rnd(20, 300), r: rnd(1.5, 3.4), fill: '#fff', opacity: rnd(0.4, 1) }, svg); st.animate([{ opacity: 0.2 }, { opacity: 1 }, { opacity: 0.2 }], { duration: rnd(1500, 3600), iterations: Infinity }); }
  S('rect', { y: 330, width: 1500, height: 520, fill: 'url(#gDeepSea)', opacity: 0.9 }, svg);
  S('path', { d: 'M 0 330 Q 375 300 750 330 T 1500 330 L 1500 360 Q 1125 390 750 360 T 0 360 Z', fill: 'rgba(255,255,255,0.14)' }, svg);
  // word slots
  const slotBar = S('g', { transform: 'translate(750,120)' }, svg);
  const slotBox = S('g', {}, slotBar);
  const padLayer = S('g', {}, svg);
  const fela = drawFrog(svg, 750, 700, 1.1);
  let felaPos = { x: 750, y: 700 };
  const VOWELS = 'AEIOUY';
  const colorFor = ch => VOWELS.includes(ch[0]) ? '#FF4D57' : '#4CC9F0';
  const WORDS = {
    fr: [['BA', 'NANE'], ['MA', 'MAN'], ['TO', 'MATE'], ['SA', 'VANE'], ['LI', 'ON'], ['VE', 'LO'], ['PA', 'PA'], ['CA', 'DEAU'], ['LU', 'NE'], ['MO', 'TO']],
    en: [['SUN'], ['CAT'], ['DOG'], ['MAP'], ['RED'], ['BIG'], ['HOP'], ['BUS']]
  };
  let targetSeq = [], seqIdx = 0, pads = [], roundLive = false, driftAnims = [];
  function buildSlots() {
    slotBox.innerHTML = '';
    const w = 96;
    targetSeq.forEach((syl, i) => {
      const x = (i - (targetSeq.length - 1) / 2) * (w + 14);
      S('rect', { x: x - w / 2, y: -40, width: w, height: 76, rx: 18, fill: i < seqIdx ? '#57CC57' : 'rgba(255,255,255,0.92)', stroke: i === seqIdx ? '#FFD23F' : '#C9D3EE', 'stroke-width': i === seqIdx ? 7 : 4 }, slotBox);
      S('text', { x, y: 14, 'text-anchor': 'middle', 'font-size': 42, 'font-weight': 800, 'font-family': 'inherit', fill: i < seqIdx ? '#fff' : (i === seqIdx ? '#2B2D42' : '#AEB7D0'), text: i <= seqIdx ? syl : '•' }, slotBox);
    });
  }
  function felaLeapTo(x, y, cb) {
    const x0 = felaPos.x, y0 = felaPos.y;
    sfx.boing();
    tween(620, k => {
      const xx = x0 + (x - x0) * k;
      const yy = y0 + (y - y0) * k - Math.sin(k * Math.PI) * 190;
      fela.setAttribute('transform', `translate(${xx},${yy}) scale(1.1) rotate(${Math.sin(k * Math.PI) * (x > x0 ? 14 : -14)})`);
    }, () => { felaPos = { x, y }; splash(x, y + 24); cb && cb(); });
  }
  function splash(x, y) {
    sfx.splash();
    for (let i = 0; i < 3; i++) {
      const ring = S('ellipse', { cx: x, cy: y, rx: 8, ry: 3.4, fill: 'none', stroke: 'rgba(255,255,255,0.75)', 'stroke-width': 3.6 }, svg);
      ring.animate([{ transform: 'scale(1)', opacity: 0.9 }, { transform: 'scale(5)', opacity: 0 }], { duration: 700 + i * 160 }).onfinish = () => ring.remove();
    }
  }
  function spawnPads() {
    padLayer.innerHTML = ''; pads = []; driftAnims = [];
    const current = targetSeq[seqIdx];
    const decoys = [];
    const bank = isEN() ? ['SUN', 'CAT', 'MAP', 'DOG', 'HOP', 'BIG', 'RED', 'BUS'] : ['BA', 'MA', 'TO', 'SA', 'LI', 'VE', 'PA', 'LU', 'MO', 'NE', 'RI', 'FU'];
    while (decoys.length < (D() <= 1 ? 2 : 3)) { const c = bank[ri(0, bank.length - 1)]; if (c !== current && !decoys.includes(c)) decoys.push(c); }
    const all = shuffle([current, ...decoys]);
    all.forEach((syl, i) => {
      const x = 260 + i * (980 / Math.max(1, all.length - 1));
      const y = 430 + (i % 2) * 150;
      const g = S('g', { transform: `translate(${x},${y})`, class: 'grab' }, padLayer);
      S('ellipse', { cx: 0, cy: 10, rx: 92, ry: 34, fill: '#2C6B2A' }, g);
      S('ellipse', { cx: 0, cy: 0, rx: 92, ry: 34, fill: '#59C14E', stroke: '#2C6B2A', 'stroke-width': 4 }, g);
      S('path', { d: 'M 0 0 L 58 -20 A 60 24 0 0 0 30 -26 Z', fill: '#2C6B2A', opacity: 0.4 }, g);
      S('text', { x: 0, y: 12, 'text-anchor': 'middle', 'font-size': 40, 'font-weight': 800, 'font-family': 'inherit', fill: colorFor(syl), stroke: '#fff', 'stroke-width': 0.8, text: syl }, g);
      const anim = g.animate([{ transform: `translate(${x}px,${y}px)` }, { transform: `translate(${x + rnd(-36, 36)}px,${y + rnd(-18, 18)}px)` }, { transform: `translate(${x}px,${y}px)` }], { duration: rnd(3200, 5200), iterations: Infinity });
      driftAnims.push(anim);
      g.addEventListener('pointerdown', ev => {
        ev.preventDefault();
        if (!roundLive) return;
        const m = new DOMMatrix(getComputedStyle(g).transform);
        if (syl === current) {
          roundLive = false;
          felaLeapTo(m.e, m.f - 26, () => {
            seqIdx++;
            say(syl, syl);
            buildSlots();
            if (seqIdx >= targetSeq.length) {
              say(targetSeq.join(''), targetSeq.join(''));
              setTimeout(() => { if (Rounds.gem()) setTimeout(zoneComplete, 800); else nextRound(); }, 900);
            } else { roundLive = true; spawnPads(); }
          });
        } else {
          Rounds.miss(); sfx.bad();
          fxWobble(g);
          const sink = g.animate([{ transform: `translate(${m.e}px,${m.f}px)` }, { transform: `translate(${m.e}px,${m.f + 26}px)` }, { transform: `translate(${m.e}px,${m.f}px)` }], { duration: 700 });
          say('Écoute bien : ' + current, 'Listen: ' + current);
        }
      });
      pads.push(g);
    });
  }
  function nextRound() {
    const list = WORDS[isEN() ? 'en' : 'fr'];
    const d = D();
    let w = list[ri(0, list.length - 1)];
    if (!isEN() && d === 0) w = [w[0]];
    targetSeq = w; seqIdx = 0;
    buildSlots();
    felaPos = { x: 750, y: 700 };
    fela.setAttribute('transform', 'translate(750,700) scale(1.1)');
    mission('Saute sur « ' + targetSeq[0] + ' » avec Fela !', 'Leap on "' + targetSeq[0] + '" with Fela!', ZONE_ICONS.river);
    roundLive = true;
    spawnPads();
  }
  nextRound();
};

  let parts = [];
  function wirePainting(done) {
    parts.forEach(p => {
      p.el.addEventListener('pointerdown', () => {
        if (!roundLive || !selected) { if (!selected) say('Choisis une couleur !', 'Pick a color first!'); return; }
        const task = tasks[taskIdx];
        const okPart = task.match(p);
        if (okPart && selected[2] === task.color[2]) {
          p.el.setAttribute('fill', selected[2]);
          fxSquish(p.el);
          sfx.pop();
          task.left--;
          if (task.left <= 0) { taskIdx++; if (taskIdx >= tasks.length) done(); else announceTask(); }
        } else {
          Rounds.miss(); sfx.bad();
          fxWobble(p.el);
          announceTask();
        }
      });
    });
  }
  function announceTask() {
    const t = tasks[taskIdx];
    mission(t.fr, t.en, g => { S('circle', { cx: 0, cy: 0, r: 22, fill: t.color[2], stroke: '#fff', 'stroke-width': 5 }, g); });
  }
  function nextRound() {
    selected = null;
    const d = D();
    buildPots();
    if (d <= 2) {
      parts = zebraParts();
      const pool = shuffle(parts.filter(p => true)).slice(0, 3);
      tasks = pool.map(p => { const c = POTS[ri(0, POTS.length - 1)]; return { color: c, left: 1, match: q => q === p, fr: 'Peins ' + p.el.dataset.fr + ' en ' + c[0] + ' !', en: 'Paint ' + p.el.dataset.en + ' ' + c[1] + '!' }; });
    } else {
      parts = shapeMural();
      const kind = ['triangle', 'cercle', 'carré'][ri(0, 2)];
      const c = POTS[ri(0, POTS.length - 1)];
      const count = parts.filter(p => p.name === kind).length;
      tasks = [{ color: c, left: count, match: q => q.name === kind, fr: 'Peins tous les ' + kind + 's en ' + c[0] + ' !', en: 'Paint all the ' + ({ triangle: 'triangles', cercle: 'circles', 'carré': 'squares' })[kind] + ' ' + c[1] + '!' }];
    }
    taskIdx = 0;
    wirePainting(() => {
      roundLive = false;
      say('Magnifique !', 'Beautiful!');
      if (Rounds.gem()) setTimeout(zoneComplete, 900); else setTimeout(nextRound, 1100);
    });
    announceTask();
    roundLive = true;
  }
  nextRound();
};

  S('path', { d: 'M -40 -36 Q 0 -66 40 -36 Q 0 -6 -40 -36 Z', fill: '#fff', stroke: '#4CC9F0', 'stroke-width': 5 }, dockF);
  S('text', { x: 0, y: 48, 'text-anchor': 'middle', 'font-size': 23, 'font-weight': 800, fill: '#fff', 'font-family': 'inherit', text: T('FLOTTE', 'FLOATS') }, dockF);

  S('rect', { x: -150, y: 20, width: 300, height: 26, rx: 12, fill: '#30346B', stroke: '#1E2048', 'stroke-width': 3 }, dockS);
  S('path', { d: 'M 0 -24 L 16 0 L 5 0 L 5 16 L -5 16 L -5 0 L -16 0 Z', fill: '#fff', transform: 'rotate(180)', 'stroke-width': 0 }, dockS);
  S('text', { x: 0, y: 64, 'text-anchor': 'middle', 'font-size': 23, 'font-weight': 800, fill: '#fff', 'font-family': 'inherit', text: T('COULE', 'SINKS') }, dockS);
  const OBJECTS = [
    { fr: 'la feuille', dens: '0,3', en: 'the leaf', floats: true, draw: g => { S('path', { d: 'M 0 -26 Q 30 -8 0 26 Q -30 -8 0 -26 Z', fill: '#57CC57', stroke: '#2C6B2A', 'stroke-width': 3 }, g); S('path', { d: 'M 0 -20 L 0 20', stroke: '#2C6B2A', 'stroke-width': 2.4 }, g); } },
    { fr: 'la pierre', dens: '2,7', en: 'the stone', floats: false, draw: g => { S('path', { d: 'M -26 10 Q -30 -16 -6 -22 Q 22 -28 28 -4 Q 32 16 10 22 Q -14 28 -26 10 Z', fill: '#8D99AE', stroke: '#5C6784', 'stroke-width': 3 }, g); } },
    { fr: 'le canard', dens: '0,4', en: 'the duck', floats: true, draw: g => { S('ellipse', { cx: 2, cy: 8, rx: 24, ry: 15, fill: '#FFD23F', stroke: '#D9A400', 'stroke-width': 3 }, g); S('circle', { cx: -16, cy: -10, r: 11, fill: '#FFD23F', stroke: '#D9A400', 'stroke-width': 3 }, g); S('path', { d: 'M -27 -10 L -38 -6 L -27 -3 Z', fill: '#FF9F1C' }, g); S('circle', { cx: -18, cy: -12, r: 2.4, fill: '#222' }, g); } },
    { fr: 'la clé', dens: '7,8', en: 'the key', floats: false, draw: g => { S('circle', { cx: -14, cy: 0, r: 10, fill: 'none', stroke: '#C9A227', 'stroke-width': 6 }, g); S('path', { d: 'M -4 0 L 26 0 M 16 0 L 16 9 M 24 0 L 24 9', stroke: '#C9A227', 'stroke-width': 6, 'stroke-linecap': 'round' }, g); } },
    { fr: 'le ballon', dens: '0,1', en: 'the ball', floats: true, draw: g => { S('circle', { cx: 0, cy: 0, r: 20, fill: '#FF4D57', stroke: '#C42631', 'stroke-width': 3 }, g); S('path', { d: 'M -20 0 Q 0 -12 20 0 M -20 0 Q 0 12 20 0', stroke: '#fff', 'stroke-width': 3.4, fill: 'none' }, g); } },
    { fr: 'la cuillère', dens: '7,9', en: 'the spoon', floats: false, draw: g => { S('ellipse', { cx: -16, cy: 0, rx: 10, ry: 14, fill: '#C0C7D8', stroke: '#8D99AE', 'stroke-width': 3 }, g); S('rect', { x: -6, y: -4, width: 34, height: 8, rx: 4, fill: '#C0C7D8', stroke: '#8D99AE', 'stroke-width': 2.4 }, g); } },
    { fr: 'la mangue', dens: '0,95', en: 'the mango', floats: true, draw: g => { S('ellipse', { cx: 0, cy: 0, rx: 22, ry: 16, fill: '#FF9F1C', stroke: '#D97800', 'stroke-width': 3 }, g); S('path', { d: 'M 8 -12 Q 16 -22 24 -16', stroke: '#3FA34D', 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, g); } },
    { fr: "l'ancre", en: 'the anchor', floats: false, draw: g => { S('path', { d: 'M 0 -20 L 0 16 M -16 6 Q 0 26 16 6 M 0 -20 m -6 0 a 6 6 0 1 0 12 0 a 6 6 0 1 0 -12 0', stroke: '#2B2D42', 'stroke-width': 6, fill: 'none', 'stroke-linecap': 'round' }, g); } }
  ];
  let items = [], sorted = 0, roundItems = [], roundLive = false;
  function bobAtSurface(g, x) {
    const anim = g.animate([
      { transform: `translate(${x}px,${WATER_Y - 4}px) rotate(-5deg)` },
      { transform: `translate(${x}px,${WATER_Y + 5}px) rotate(5deg)` },
      { transform: `translate(${x}px,${WATER_Y - 4}px) rotate(-5deg)` }
    ], { duration: 2000, iterations: Infinity });
    return anim;
  }
  function rings(x, y) {
    for (let i = 0; i < 3; i++) {
      const r = S('ellipse', { cx: x, cy: y, rx: 10, ry: 4, fill: 'none', stroke: 'rgba(255,255,255,0.8)', 'stroke-width': 3.4 }, svg);

      o.draw(g);

      items.push(it);
      makeDraggable(g, svg, {
        start: () => { if (!roundLive) return; sfx.tap(); if (it.anim) { it.anim.cancel(); it.anim = null; } svg.appendChild(g); },
        move: p => { if (!roundLive) return; g.setAttribute('transform', `translate(${p.x},${p.y}) scale(1.15)`); },
        end: p => {
          if (!roundLive) return;
          if (it.state === 'tested') {
            // sort to dock
            const wantF = p.x > 950 && p.y < 500;
            const wantS = p.x > 950 && p.y >= 500;
            if (wantF || wantS) {
              const correct = (wantF && it.o.floats) || (wantS && !it.o.floats);
              if (correct) {
                it.state = 'sorted'; sorted++;
                const dock = wantF ? [1050 + (sorted * 34) % 190, 372] : [1050 + (sorted * 34) % 190, 600];
                g.setAttribute('transform', `translate(${dock[0]},${dock[1]}) scale(0.8)`);
                sfx.good(); say('Oui ! ' + T(it.o.fr, it.o.en) + T(it.o.floats ? ' flotte !' : ' coule !', it.o.floats ? ' floats!' : ' sinks!'));
                if (sorted >= roundItems.length) { roundLive = false; if (Rounds.gem()) setTimeout(zoneComplete, 900); else setTimeout(nextRound, 1100); }
              } else { Rounds.miss(); sfx.bad(); say('Regarde ce qui se passe dans l’eau !', 'Watch what happens in the water!'); backToWater(it); }
              return;
            }
            backToWater(it); return;
          }
          if (p.y > WATER_Y - 60 && p.x < 950) {
            // drop in water → physics!
            it.state = 'tested';
            rings(p.x, WATER_Y);
            if (it.o.floats) { sfx.splash(); it.anim = bobAtSurface(g, p.x); }
            else {
              sfx.splash();
              g.animate([{ transform: `translate(${p.x}px,${WATER_Y}px)` }, { transform: `translate(${p.x + rnd(-20, 20)}px,700px) rotate(20deg)` }], { duration: 1100, easing: 'ease-in', fill: 'forwards' });
              for (let b = 0; b < 5; b++) { const bb = S('circle', { cx: p.x + rnd(-14, 14), cy: WATER_Y + 40 + b * 40, r: rnd(3, 7), fill: 'rgba(255,255,255,0.7)' }, svg); bb.animate([{ opacity: 0.8, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-70px)' }], { duration: 900, delay: b * 120 }).onfinish = () => bb.remove(); }
            }
            if (D() >= 5 && it.o.dens) {
              const lab = S('g', { transform: `translate(${p.x},${WATER_Y - 64})` }, svg);
              S('rect', { x: -74, y: -22, width: 148, height: 36, rx: 18, fill: '#fff', stroke: '#2EC4B6', 'stroke-width': 4 }, lab);
              S('text', { x: 0, y: 4, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 800, fill: '#2B2D42', 'font-family': 'inherit', text: T('densité ' + it.o.dens, 'density ' + it.o.dens.replace(',', '.')) }, lab);
              fxPop(lab);
              setTimeout(() => lab.remove(), 2600);
              say(T(it.o.fr, it.o.en) + ' : ' + T('densité ' + it.o.dens + '. ', 'density ' + it.o.dens.replace(',', '.') + '. ') + T(it.o.floats ? 'Moins de un : ça flotte !' : 'Plus de un : ça coule !', it.o.floats ? 'Less than one: it floats!' : 'More than one: it sinks!'));
            } else say(T(it.o.fr, it.o.en) + ' ... ' + T(it.o.floats ? 'ça flotte !' : 'ça coule !', it.o.floats ? 'it floats!' : 'it sinks!'));
            setTimeout(() => say('Range-' + (isEN() ? 'it' : 'le') + ' sur le bon ponton !', 'Drag it to the right dock!'), 1800);
          } else {
            g.animate([{ transform: `translate(${p.x}px,${p.y}px)` }, { transform: `translate(${it.home[0]}px,${it.home[1]}px)` }], { duration: 420, easing: 'cubic-bezier(0.34,1.56,0.64,1)' }).onfinish = () => g.setAttribute('transform', `translate(${it.home[0]},${it.home[1]})`);
          }
        }
      });
    });
    mission("Jette les objets dans l'eau, puis range-les : FLOTTE ou COULE !", 'Drop the objects in the water, then sort them: FLOATS or SINKS!', ZONE_ICONS.splash);
    roundLive = true;
  }
  function backToWater(it) {
    const x = rnd(400, 850);
    if (it.o.floats) { it.anim = bobAtSurface(it.g, x); }
    else it.g.setAttribute('transform', `translate(${x},690)`);
  }
  nextRound();
};

  const sunFill = meter(54, '#FFD23F', g => { S('circle', { cx: 0, cy: 0, r: 9, fill: '#FFD23F' }, g); for (let i = 0; i < 8; i++) S('rect', { x: -1.6, y: -17, width: 3.2, height: 6, rx: 1.6, fill: '#FFD23F', transform: `rotate(${i * 45})` }, g); });
  let water = 0, sun = 0, stage = 0, needW = 3, needS = 3, roundLive = false, plantKind = 0;

  ];
  function drawPlant() {

        }

    }

    end: p => {
      if (Math.abs(p.x - 750) < 200 && p.y < 520) {

      }

  let target = null, roundLive = false, found = [], tries = 0;
  DATA.forEach(c => {
    const p = S('path', { d: c.path, fill: REGION_HUE[c.region] || '#B3A6E0', stroke: '#fff', 'stroke-width': 0.38, 'stroke-linejoin': 'round', class: 'grab', style: 'transition:filter 0.2s;' }, map);
    els[c.id] = p;
    p.addEventListener('pointerenter', () => { if (!found.includes(c.id)) p.style.filter = 'brightness(1.16)'; });
    p.addEventListener('pointerleave', () => { if (!found.includes(c.id)) p.style.filter = ''; });
  });
  // balloon with Leo
  const balloon = S('g', { transform: 'translate(170,190)' }, svg);
  const balloonInner = S('g', {}, balloon);
  S('path', { d: 'M 0 -96 A 62 70 0 1 1 -0.1 -96 Z', fill: '#FF4D57', stroke: '#C42631', 'stroke-width': 5 }, balloonInner);
  S('path', { d: 'M 0 -96 A 62 70 0 0 1 0 36 A 24 70 0 0 0 0 -96 Z', fill: '#FFD23F', opacity: 0.9 }, balloonInner);
  S('path', { d: 'M -34 20 L -16 62 M 34 20 L 16 62', stroke: '#8A5A33', 'stroke-width': 4 }, balloonInner);
  S('path', { d: 'M -18 60 L 18 60 L 12 92 L -12 92 Z', fill: 'url(#gWood)', stroke: '#6B421D', 'stroke-width': 4 }, balloonInner);
  drawLeo(balloonInner, 0, 44, 0.42);
  fxBob(balloonInner, 13, 3000);
  let balloonPos = { x: 170, y: 190 };
  // clue card: the country's REAL shape + name (or only its capital for the big kids)
  const clueCard = S('g', { transform: 'translate(170,600)' }, svg);
  const EASY = ['ma', 'eg', 'ng', 'cm', 'za', 'cd', 'ke', 'sn', 'dz', 'mg'];
  const MID = EASY.concat(['tz', 'gh', 'ci', 'ml', 'ne', 'td', 'sd', 'et', 'ug', 'zm', 'zw', 'ao', 'mz', 'ly', 'tn', 'bf']);
  function pool() { const d = D(); const ids = d <= 1 ? EASY : (d <= 3 ? MID : DATA.map(c => c.id)); return DATA.filter(c => ids.includes(c.id) && !found.includes(c.id)); }
  function showClue() {
    clueCard.innerHTML = '';
    const d = D();
    S('rect', { x: -108, y: -92, width: 216, height: 196, rx: 22, fill: '#fff', stroke: '#FFD23F', 'stroke-width': 6 }, clueCard);
    if (d <= 4) {
      let bb; try { bb = els[target.id].getBBox(); } catch (e) { bb = { x: 0, y: 0, width: 20, height: 20 }; }
      const sc = Math.min(112 / Math.max(1, bb.width), 112 / Math.max(1, bb.height));
      const mini = S('g', { transform: `translate(0,-30) scale(${sc}) translate(${-(bb.x + bb.width / 2)},${-(bb.y + bb.height / 2)})` }, clueCard);
      S('path', { d: target.path, fill: '#5E60CE', stroke: '#2B2D42', 'stroke-width': Math.min(1.4, 0.8 / sc) }, mini);
    } else {
      S('text', { x: 0, y: -8, 'text-anchor': 'middle', 'font-size': 86, 'font-weight': 800, fill: '#C9D3EE', 'font-family': 'inherit', text: '?' }, clueCard);
    }
    const lbl = d >= 4 ? T('Capitale : ' + target.cap, 'Capital: ' + target.cap) : T(target.fr, target.en);
    S('text', { x: 0, y: 52, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 800, fill: '#2B2D42', 'font-family': 'inherit', text: d < 1 ? '' : lbl }, clueCard);
    if (d >= 2 && d <= 3) S('text', { x: 0, y: 82, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, fill: '#8A93AD', 'font-family': 'inherit', text: T('Région : ', 'Region: ') + target.region }, clueCard);
    else if (d >= 4) S('text', { x: 0, y: 82, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, fill: '#8A93AD', 'font-family': 'inherit', text: T('Quel pays ?', 'Which country?') }, clueCard);
    fxPop(clueCard);
  }
  function flyTo(x, y, cb) {
    sfx.whoosh();
    const x0 = balloonPos.x, y0 = balloonPos.y;
    tween(1100, k => {
      const e = easeOut(k);
      balloon.setAttribute('transform', `translate(${x0 + (x - x0) * e},${y0 + (y - y0) * e - Math.sin(k * Math.PI) * 60}) rotate(${Math.sin(k * Math.PI * 2) * 4})`);
    }, () => { balloonPos = { x, y }; cb && cb(); });
  }
  function hintTarget() {
    const p = els[target.id];
    p.setAttribute('stroke', '#FFD23F'); p.setAttribute('stroke-width', 1.6); p.style.filter = 'brightness(1.3)';
    setTimeout(() => { p.setAttribute('stroke', '#fff'); p.setAttribute('stroke-width', 0.38); p.style.filter = ''; }, 1800);
  }
  map.addEventListener('pointerdown', ev => {
    if (!roundLive) return;
    const hit = DATA.find(c => els[c.id] === ev.target);
    if (!hit || found.includes(hit.id)) return;
    roundLive = false;
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    flyTo(p.x, p.y - 60, () => {
      if (hit.id === target.id) {
        els[hit.id].style.filter = 'brightness(1.2) saturate(1.5)';
        found.push(hit.id);
        const mk = S('g', { transform: `translate(${ox + hit.x * K},${oy + hit.y * K})` }, svg);
        const stw = S('g', { transform: 'scale(1.1) translate(-12,-12)' }, mk);
        drawStarIcon(stw, 1, '#FFD23F');
        fxPop(mk);
        sfx.good(); confetti(16);
        say('Bravo ! ' + target.fr + ' ! Capitale : ' + target.cap + ' !', 'Great! ' + target.en + '! Capital: ' + target.cap + '!');
        setTimeout(() => { if (Rounds.gem()) setTimeout(zoneComplete, 800); else nextRound(); }, 1100);
      } else {
        Rounds.miss(); sfx.bad(); tries++;
        fxWobble(els[hit.id]);
        say('Ici c’est ' + hit.fr + ', en ' + hit.region + ' ! Cherche ' + (D() >= 4 ? 'le pays de ' + target.cap : target.fr) + ' !',
            'This is ' + hit.en + ', in ' + hit.region + '! Look for ' + (D() >= 4 ? 'the country of ' + target.cap : target.en) + '!');
        if (tries >= 3) hintTarget();
        roundLive = true;
      }
    });
  });
  function nextRound() {
    tries = 0;
    const po = pool();
    target = po[ri(0, po.length - 1)] || DATA[ri(0, DATA.length - 1)];
    showClue();
    const d = D();
    if (d >= 4) mission('Vole vers le pays dont la capitale est ' + target.cap + ' !', 'Fly to the country whose capital is ' + target.cap + '!', ZONE_ICONS.safari);
    else mission('Vole avec Léo vers ' + target.fr + ' ! Regarde sa forme !', 'Fly with Leo to ' + target.en + '! Look at its shape!', ZONE_ICONS.safari);
    roundLive = true;
  }
  nextRound();
};

      ],
      q: { fr: "Qu'a fait Léo ?", en: 'What did Leo do?' },
      panels: [
        { ok: true, draw: g => { drawLeo(g, -36, 0, 0.42); drawMonkey(g, 44, -6, 0.4); S('ellipse', { cx: 2, cy: 34, rx: 16, ry: 11, fill: '#FF9F1C', stroke: '#D97800', 'stroke-width': 2.5 }, g); } },
        { ok: false, draw: g => { drawLeo(g, 0, -4, 0.46); S('path', { d: 'M -30 36 Q 0 52 30 36', stroke: '#C42631', 'stroke-width': 6, fill: 'none', 'stroke-linecap': 'round', transform: 'rotate(180 0 40)' }, g); } },
        { ok: false, draw: g => { drawFrog(g, 0, 6, 0.6); } }
      ]
    },
    {
      lines: [
        { fr: 'Fela la grenouille sautait sous la pluie.', dens: '1', en: 'Fela the frog was hopping in the rain.', act: () => move(actors.frog, 500, 500) },
        { fr: 'Elle a glissé et est tombée dans la boue !', dens: '1', en: 'She slipped and fell in the mud!', act: () => { fxSquish(actors.frog); sfx.splash(); } },
        { fr: 'Léo lui a tendu la patte pour la relever.', dens: '1', en: 'Leo reached out his paw and helped her up.', act: () => { move(actors.leo, 560, 480); sfx.good(); } }
      ],
      q: { fr: 'Qui a aidé Fela ?', dens: '1', en: 'Who helped Fela?' },
      panels: [
        { ok: false, draw: g => { drawMonkey(g, 0, -10, 0.46) } },
        { ok: true, draw: g => { drawLeo(g, 0, -2, 0.46) } },
        { ok: false, draw: g => { drawSun(g, 0, 0, 0.5) } }
      ]
    },
    {
      lines: [
        { fr: 'Momo a planté une petite graine le matin.', dens: '1', en: 'Momo planted a tiny seed in the morning.', act: () => move(actors.momo, 700, 470) },
        { fr: 'La pluie est tombée, le soleil a brillé.', dens: '1', en: 'The rain fell and the sun shone bright.', act: () => sfx.splash() },
        { fr: 'Le soir, une jolie fleur est apparue !', dens: '1', en: 'By evening, a pretty flower appeared!', act: () => sfx.good() }
      ],
      q: { fr: "Qu'est-ce qui a poussé ?", en: 'What grew?' },
      panels: [
        { ok: false, draw: g => drawFish(g, 0, 0, 0.9, '#4CC9F0') },
        { ok: false, draw: g => { S('path', { d: 'M 0 -18 A 15 16 0 1 1 -0.1 -18 Z', fill: '#FF4D57' }, g); S('rect', { x: -5, y: 12, width: 10, height: 10, rx: 2, fill: '#8A5A33' }, g); } },
        { ok: true, draw: g => { S('rect', { x: -3, y: 0, width: 6, height: 24, rx: 3, fill: '#3FA34D' }, g); [0, 72, 144, 216, 288].forEach(a => S('ellipse', { cx: 0, cy: -12, rx: 7, ry: 12, fill: '#F25CA2', transform: `rotate(${a} 0 -4)` }, g)); S('circle', { cx: 0, cy: -4, r: 6, fill: '#FFD23F' }, g); } }
      ]
    }
  ];
  let story = null, lineIdx = 0;
  function openCurtains() {
    sfx.fanfare();
    curtL.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-70px)' }], { duration: 900, fill: 'forwards', easing: 'ease-out' });
    curtR.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(70px)' }], { duration: 900, fill: 'forwards', easing: 'ease-out' });
  }
  function playLine() {
    if (lineIdx >= story.lines.length) { askQuestion(); return; }
    const L = story.lines[lineIdx];
    L.act && L.act();
    say(L.fr, L.en);
    const ms = Math.max(2600, T(L.fr, L.en).length * (D() <= 1 ? 110 : 80));
    lineIdx++;
    setTimeout(playLine, ms);
  }
  function askQuestion() {
    mission(story.q.fr, story.q.en, ZONE_ICONS.theatre);
    answerG.innerHTML = '';
    shuffle(story.panels).forEach((p, i) => {
      const x = 430 + i * 320;
      const g = S('g', { transform: `translate(${x},${700})`, class: 'grab' }, answerG);
      S('rect', { x: -120, y: -70, width: 240, height: 140, rx: 22, fill: '#fff', stroke: '#FFD23F', 'stroke-width': 6 }, g);
      const art = S('g', { transform: 'translate(0,6)' }, g); p.draw(art); fxPop(g);
      g.addEventListener('pointerdown', () => {
        if (p.ok) {
          sfx.good(); answerG.innerHTML = '';
          if (Rounds.gem()) setTimeout(zoneComplete, 900); else setTimeout(nextRound, 1000);
        } else { Rounds.miss(); sfx.bad(); fxWobble(g); say('Regarde encore la scène !', 'Watch the scene again!'); }
      });
    });
  }
  function nextRound() {
    answerG.innerHTML = '';
    placeActors();
    story = STORIES[Rounds.idx % STORIES.length];
    lineIdx = 0;
    mission('Regarde bien le spectacle !', 'Watch the show closely!', ZONE_ICONS.theatre);
    setTimeout(() => { openCurtains(); setTimeout(playLine, 1000); }, 600);
  }
  nextRound();
};


/* ================= Z9 — CHANTIER DE TIBO (building projects) ================= */

  drawSun(svg, 1380, 100, 0.8);
  drawCloud(svg, 240, 110, 0.8);
  // crane décor
  const crane = S('g', { transform: 'translate(1300,600)' }, svg);
  S('rect', { x: -12, y: -330, width: 24, height: 330, fill: '#F3A712', stroke: '#B4654A', 'stroke-width': 3 }, crane);

  const blueprintG = S('g', { transform: 'translate(950,440)' }, svg);
  const trayG = S('g', {}, svg);
  const fxG = S('g', {}, svg);
  const STRUCTURES = [
    { fr: 'la maison', dens: '1', en: 'the house', parts: [
      { t: 'r', x: -110, y: -10, w: 220, h: 160, c: '#F2C078' },
      { t: 't', pts: [[-135, -10], [135, -10], [0, -135]], c: '#E5252A' },
      { t: 'r', x: -32, y: 66, w: 64, h: 84, c: '#8A5A33' },
      { t: 'c', x: -62, y: 36, r: 25, c: '#4CC9F0' },
      { t: 'c', x: 62, y: 36, r: 25, c: '#4CC9F0' }
    ] },
    { fr: 'la fusée', dens: '1', en: 'the rocket', parts: [
      { t: 'r', x: -48, y: -80, w: 96, h: 210, c: '#E8EAF3' },
      { t: 't', pts: [[-58, -80], [58, -80], [0, -190]], c: '#E5252A' },
      { t: 'c', x: 0, y: -14, r: 30, c: '#4CC9F0' },
      { t: 't', pts: [[-48, 70], [-48, 130], [-104, 130]], c: '#FF9F1C' },
      { t: 't', pts: [[48, 70], [48, 130], [104, 130]], c: '#FF9F1C' }
    ] },
    { fr: 'le pont', dens: '1', en: 'the bridge', parts: [
      { t: 'r', x: -170, y: 20, w: 340, h: 34, c: '#B4654A' },
      { t: 'r', x: -140, y: -110, w: 34, h: 130, c: '#8A5A33' },
      { t: 'r', x: 106, y: -110, w: 34, h: 130, c: '#8A5A33' },
      { t: 't', pts: [[-106, 20], [-16, 20], [-106, -94]], c: '#FFD23F' },
      { t: 't', pts: [[106, 20], [16, 20], [106, -94]], c: '#FFD23F' }
    ] },
    { fr: 'le robot', dens: '1', en: 'the robot', parts: [
      { t: 'r', x: -75, y: -55, w: 150, h: 130, c: '#8D99AE' },
      { t: 'r', x: -52, y: -150, w: 104, h: 86, c: '#C0C7D8' },
      { t: 'c', x: -24, y: -112, r: 14, c: '#4CC9F0' },
      { t: 'c', x: 24, y: -112, r: 14, c: '#4CC9F0' },
      { t: 't', pts: [[-14, -150], [14, -150], [0, -192]], c: '#E5252A' }
    ] },
    { fr: 'le bateau', dens: '1', en: 'the boat', parts: [
      { t: 'r', x: -140, y: 40, w: 280, h: 56, c: '#B4654A' },
      { t: 'r', x: -8, y: -140, w: 16, h: 180, c: '#8A5A33' },
      { t: 't', pts: [[8, -140], [8, -20], [122, -34]], c: '#FFD23F' },
      { t: 't', pts: [[-8, -140], [-8, -56], [-86, -70]], c: '#E5252A' }
    ] }
  ];
  function drawShape(parent, part, mode) {
    const common = mode === 'outline'
      ? { fill: 'rgba(255,255,255,0.35)', stroke: '#8A93AD', 'stroke-width': 4, 'stroke-dasharray': '10 8' }
      : { fill: part.c, stroke: 'rgba(0,0,0,0.25)', 'stroke-width': 4 };
    if (part.t === 'r') return S('rect', Object.assign({ x: part.x, y: part.y, width: part.w, height: part.h, rx: 8 }, common), parent);
    if (part.t === 'c') return S('circle', Object.assign({ cx: part.x, cy: part.y, r: part.r }, common), parent);
    return S('path', Object.assign({ d: 'M ' + part.pts.map(p => p.join(' ')).join(' L ') + ' Z' }, common), parent);
  }
  const center = p => p.t === 'r' ? [p.x + p.w / 2, p.y + p.h / 2] : (p.t === 'c' ? [p.x, p.y] : [(p.pts[0][0] + p.pts[1][0] + p.pts[2][0]) / 3, (p.pts[0][1] + p.pts[1][1] + p.pts[2][1]) / 3]);
  let structIdx = -1, placed = 0, parts = [], roundLive = false;
  function nextRound() {
    blueprintG.innerHTML = ''; trayG.innerHTML = ''; fxG.innerHTML = '';
    structIdx = (structIdx + 1) % STRUCTURES.length;
    const st = STRUCTURES[structIdx];
    const d = D();
    parts = st.parts.slice(0, d <= 1 ? 3 : (d <= 3 ? 4 : st.parts.length));
    placed = 0;
    parts.forEach(p => drawShape(blueprintG, p, 'outline'));
    // tray pieces (shuffled)
    shuffle(parts.map((p, i) => i)).forEach((pi, slot) => {
      const p = parts[pi];
      const hx = 180 + (slot % 2) * 220, hy = 300 + Math.floor(slot / 2) * 170;
      const c = center(p);
      const g = S('g', { transform: `translate(${hx},${hy})` }, trayG);
      const art = S('g', { transform: `translate(${-c[0]},${-c[1]}) ` }, g);
      drawShape(art, p, 'solid');
      S('circle', { r: 60, fill: 'rgba(255,255,255,0.001)' }, g);
      fxPop(g);
      let done = false;
      makeDraggable(g, svg, {
        start: () => { if (!roundLive || done) return; sfx.tap(); trayG.appendChild(g); },
        move: pt2 => { if (!roundLive || done) return; g.setAttribute('transform', `translate(${pt2.x},${pt2.y}) scale(1.08)`); },
        end: pt2 => {
          if (!roundLive || done) return;
          const tx = 950 + c[0], ty = 440 + c[1];
          if (Math.hypot(pt2.x - tx, pt2.y - ty) < 85) {
            done = true; placed++;
            g.remove();
            const solid = S('g', {}, blueprintG);
            drawShape(solid, p, 'solid');
            fxPop(solid);
            sfx.pop();
            say(placed === parts.length ? '' : 'Bien construit !', placed === parts.length ? '' : 'Well built!');
            if (placed === parts.length) finishStructure(st);
          } else {
            Rounds.miss();
            g.animate([{ transform: `translate(${pt2.x}px,${pt2.y}px)` }, { transform: `translate(${hx}px,${hy}px)` }], { duration: 420, easing: 'cubic-bezier(0.34,1.56,0.64,1)' }).onfinish = () => g.setAttribute('transform', `translate(${hx},${hy})`);
            sfx.whoosh();
          }
        }
      });
    });
    mission('Construis ' + st.fr + ' : pose chaque pièce sur le plan en pointillés !', 'Build ' + st.en + ': drop each piece onto the dotted blueprint!', ZONE_ICONS.builder);
    roundLive = true;
  }
  function finishStructure(st) {
    roundLive = false;
    for (let i = 0; i < 6; i++) {
      const puff = S('circle', { cx: 950 + rnd(-120, 120), cy: 440 + rnd(-120, 80), r: rnd(8, 16), fill: 'rgba(255,255,255,0.85)' }, fxG);
      puff.animate([{ transform: 'translateY(0) scale(1)', opacity: 0.9 }, { transform: 'translateY(-70px) scale(2.2)', opacity: 0 }], { duration: 900, delay: i * 90 }).onfinish = () => puff.remove();
    }
    sfx.fanfare();
    say('Magnifique, ' + st.fr + ' est fini !', 'Beautiful, ' + st.en + ' is finished!');
    if (Rounds.gem()) setTimeout(zoneComplete, 1000); else setTimeout(nextRound, 1300);
  }
  nextRound();
};

/* ================= Z10 — CHERCHE & TROUVE (seek and find) ================= */

ZONE_BUILDERS.words = function (host) {

  const picG = S('g', { transform: 'translate(260,430)' }, svg);
  const slotG = S('g', { transform: 'translate(880,320)' }, svg);
  const tileG = S('g', {}, svg);
  const MINIS = {
    lion: g => drawLeo(g, 0, 0, 1.1),

    ball: g => { S('circle', { r: 56, fill: '#FF4D57', stroke: '#C42631', 'stroke-width': 4 }, g); S('path', { d: 'M -56 0 Q 0 -30 56 0 M -56 0 Q 0 30 56 0', stroke: '#fff', 'stroke-width': 7, fill: 'none' }, g); },
    house: g => { S('rect', { x: -56, y: -10, width: 112, height: 80, rx: 6, fill: '#F2C078', stroke: '#B4654A', 'stroke-width': 4 }, g); S('path', { d: 'M -68 -10 L 68 -10 L 0 -72 Z', fill: '#E5252A' }, g); S('rect', { x: -14, y: 28, width: 28, height: 42, fill: '#8A5A33' }, g); },
    flower: g => { [0, 72, 144, 216, 288].forEach(a => S('ellipse', { cx: 0, cy: -34, rx: 20, ry: 34, fill: '#FF9BC0', transform: `rotate(${a})` }, g)); S('circle', { r: 20, fill: '#FFD23F' }, g); },
    cat: g => { S('circle', { r: 46, fill: '#8D99AE', stroke: '#5C6784', 'stroke-width': 4 }, g); [[-30, -34], [30, -34]].forEach(([x, y]) => S('path', { d: `M ${x - 14} ${y + 10} L ${x} ${y - 22} L ${x + 14} ${y + 10} Z`, fill: '#8D99AE', stroke: '#5C6784', 'stroke-width': 3 }, g)); [[-16, -6], [16, -6]].forEach(([x, y]) => { S('circle', { cx: x, cy: y, r: 7, fill: '#fff' }, g); S('circle', { cx: x, cy: y + 1.5, r: 3.2, fill: '#2B2D42' }, g); }); S('path', { d: 'M -8 14 Q 0 20 8 14 M 0 8 L 0 14', stroke: '#5C6784', 'stroke-width': 3, fill: 'none', 'stroke-linecap': 'round' }, g); }
  };
  const BANK = {
    fr: [{ w: 'LION', m: 'lion' }, { w: 'SOLEIL', m: 'sun' }, { w: 'LUNE', m: 'moon' }, { w: 'BALLON', m: 'ball' }, { w: 'MAISON', m: 'house' }, { w: 'FLEUR', m: 'flower' }, { w: 'CHAT', m: 'cat' }, { w: 'POISSON', m: 'fish' }],
    en: [{ w: 'LION', m: 'lion' }, { w: 'SUN', m: 'sun' }, { w: 'MOON', m: 'moon' }, { w: 'BALL', m: 'ball' }, { w: 'HOUSE', m: 'house' }, { w: 'FLOWER', m: 'flower' }, { w: 'CAT', m: 'cat' }, { w: 'FISH', m: 'fish' }]
  };
  const VOW = 'AEIOUY';
  let word = '', filled = [], roundLive = false;
  function buildSlots() {
    slotG.innerHTML = '';
    const w = 86;
    word.split('').forEach((ch, i) => {
      const x = (i - (word.length - 1) / 2) * (w + 10);
      S('rect', { x: x - w / 2, y: -46, width: w, height: 92, rx: 16, fill: filled[i] ? '#DFFAE8' : '#fff', stroke: filled[i] ? '#57CC57' : '#C9D3EE', 'stroke-width': 5 }, slotG);
      if (filled[i]) S('text', { x, y: 22, 'text-anchor': 'middle', 'font-size': 58, 'font-weight': 800, 'font-family': 'inherit', fill: VOW.includes(ch) ? '#FF4D57' : '#1C7ED6', text: ch }, slotG);
      S('rect', { x: x - w / 2, y: -46, width: w, height: 92, rx: 16, fill: 'rgba(0,0,0,0)', 'data-slot': i, class: 'word-slot' }, slotG);
    });
  }
  function spawnTiles() {
    tileG.innerHTML = '';
    const d = D();
    const letters = word.split('').map((ch, i) => ({ ch, forIdx: i })).filter((o, i) => !filled[i]);
    const decoyCount = d <= 1 ? 0 : (d <= 3 ? 2 : 4);
    const alpha = 'ABCDEFGHIJLMNOPRSTUV';
    for (let i = 0; i < decoyCount; i++) letters.push({ ch: alpha[ri(0, alpha.length - 1)], forIdx: -1 });
    shuffle(letters).forEach((L, i) => {
      const hx = 560 + (i % 5) * 150, hy = 560 + Math.floor(i / 5) * 130;
      const g = S('g', { transform: `translate(${hx},${hy})`, class: 'grab' }, tileG);
      S('rect', { x: -40, y: -40, width: 80, height: 80, rx: 14, fill: '#fff', stroke: '#06B6D4', 'stroke-width': 5 }, g);
      S('rect', { x: -40, y: 28, width: 80, height: 12, rx: 6, fill: '#06B6D4', opacity: 0.4 }, g);
      S('text', { x: 0, y: 18, 'text-anchor': 'middle', 'font-size': 50, 'font-weight': 800, 'font-family': 'inherit', fill: VOW.includes(L.ch) ? '#FF4D57' : '#1C7ED6', text: L.ch }, g);
      S('circle', { r: 48, fill: 'rgba(0,0,0,0)' }, g);
      fxPop(g);
      let used = false;
      makeDraggable(g, svg, {
        start: () => { if (!roundLive || used) return; sfx.tap(); say(L.ch, L.ch); tileG.appendChild(g); },
        move: p => { if (!roundLive || used) return; g.setAttribute('transform', `translate(${p.x},${p.y}) scale(1.15)`); },
        end: p => {
          if (!roundLive || used) return;
          // which slot was it dropped on?
          const w = 86;
          const rel = { x: p.x - 880, y: p.y - 320 };
          let hit = -1;
          word.split('').forEach((ch, i) => {
            const x = (i - (word.length - 1) / 2) * (w + 10);
            if (!filled[i] && Math.abs(rel.x - x) < w / 2 + 12 && Math.abs(rel.y) < 70) hit = i;
          });
          if (hit >= 0 && word[hit] === L.ch) {
            used = true; filled[hit] = true;
            g.remove(); sfx.pop(); buildSlots();
            if (filled.every(Boolean)) {
              roundLive = false;
              sfx.fanfare();
              say('Bravo, tu as écrit ' + word + ' !', 'Great, you spelled ' + word + '!');
              if (Rounds.gem()) setTimeout(zoneComplete, 900); else setTimeout(nextRound, 1300);
            }
          } else {
            if (hit >= 0) { Rounds.miss(); sfx.bad(); say('Non, là il faut la lettre ' + word[hit] + ' !', 'No, that spot needs the letter ' + word[hit] + '!'); }
            g.animate([{ transform: `translate(${p.x}px,${p.y}px)` }, { transform: `translate(${hx}px,${hy}px)` }], { duration: 420, easing: 'cubic-bezier(0.34,1.56,0.64,1)' }).onfinish = () => g.setAttribute('transform', `translate(${hx},${hy})`);
          }
        }
      });
    });
  }
  function nextRound() {
    const bank = BANK[isEN() ? 'en' : 'fr'];
    const item = bank[Rounds.idx % bank.length];
    word = item.w;
    const d = D();
    filled = word.split('').map((ch, i) => d === 0 ? i > 0 : (d === 1 ? i > 1 : false));
    picG.innerHTML = '';
    const frame = S('g', {}, picG);
    S('circle', { r: 150, fill: '#fff', stroke: '#06B6D4', 'stroke-width': 8 }, frame);
    const art = S('g', {}, frame);
    MINIS[item.m](art);
    fxPop(frame);
    buildSlots();
    spawnTiles();
    mission('Fabrique le mot de l’image avec les lettres !', 'Build the picture’s word with the letters!', ZONE_ICONS.words);
    say('Écoute bien : ' + word + ' ! À toi !', 'Listen: ' + word + '! Your turn!');
    roundLive = true;
  }
  nextRound();
};

    { k: 'house', fr: ['maison', 'maisons'], en: ['house', 'houses'], draw: g => { S('rect', { x: -22, y: -4, width: 44, height: 32, rx: 3, fill: '#F2C078', stroke: '#B4654A', 'stroke-width': 2.5 }, g); S('path', { d: 'M -27 -4 L 27 -4 L 0 -28 Z', fill: '#E5252A' }, g); S('rect', { x: -6, y: 12, width: 12, height: 16, fill: '#8A5A33' }, g); } }

    sfx.fanfare(); confetti(50);
    say('Quel chef-d’œuvre ! Ton tableau : ' + bits.join(', ') + ' !', 'What a masterpiece! Your picture: ' + bits.join(', ') + '!');

        return;
      }

    makeDraggable(inst, svg, {
      move: p2 => { if (!eraser) inst.setAttribute('transform', `translate(${p2.x},${p2.y})`); },
      end: () => {}
    });
    if (totalPlaced >= 4 && !doneShown) { doneBtn.setAttribute('opacity', 1); fxPop(doneBtn); }
  });
  mission('Crée TON tableau magique : choisis des tampons, touche la scène pour les poser ! 4 ou plus, puis la coche verte !', 'Create YOUR magic picture: pick stamps, tap the scene to place them! 4 or more, then the green check!', ZONE_ICONS.create);
};
